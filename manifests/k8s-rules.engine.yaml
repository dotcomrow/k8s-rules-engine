# =========================
# Kogito Management Console (UI)
# =========================
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kogito-console-config
  namespace: drools
data:
  KOGITO_CONSOLES_KEYCLOAK_CONFIG_URL: "https://auth.suncoast.systems"
  KOGITO_CONSOLES_KEYCLOAK_CONFIG_REALM: "internal"
  KOGITO_CONSOLES_KEYCLOAK_CONFIG_HEALTH_CHECK_URL: "https://auth.suncoast.systems/realms/internal/.well-known/openid-configuration"
  KOGITO_CONSOLES_KEYCLOAK_CONFIG_DISABLE_HEALTH_CHECK: "false"
  KOGITO_CONSOLES_KEYCLOAK_CONFIG_UPDATE_TOKEN_VALIDITY: "30"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kogito-console-entrypoint
  namespace: drools
data:
  run-console.sh: |
    #!/usr/bin/env sh
    set -euo pipefail
    if [ -f /vault-secrets/kogito-console-env.sh ]; then
      # shellcheck disable=SC1091
      . /vault-secrets/kogito-console-env.sh
    fi

    KOGITO_HOME="${KOGITO_HOME:-/home/kogito}"

    for candidate in \
      "${KOGITO_HOME}/kogito-app-launch.sh" \
      /usr/local/bin/run.sh \
      /usr/local/bin/entrypoint.sh \
      /docker-entrypoint.sh \
      /opt/kogito/launch/run.sh \
      /opt/kogito/run.sh; do
      if [ -x "$candidate" ]; then
        exec "$candidate"
      fi
    done

    if command -v nginx >/dev/null 2>&1; then
      exec nginx -g "daemon off;"
    fi
    if command -v httpd >/dev/null 2>&1; then
      exec httpd -D FOREGROUND
    fi

    echo "❌ No known entrypoint found for Kogito console image" >&2
    exit 1

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kogito-management-console-proxy-config
  namespace: drools
data:
  nginx.conf: |
    worker_processes  auto;
    events { worker_connections 1024; use epoll; multi_accept on; }
    http {
      include /etc/nginx/mime.types;
      default_type application/octet-stream;

      log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'rt=$request_time uct="$upstream_connect_time" '
                      'uht="$upstream_header_time" urt="$upstream_response_time"';
      access_log /var/log/nginx/access.log main;
      error_log  /var/log/nginx/error.log warn;

      sendfile on; tcp_nopush on; tcp_nodelay on; keepalive_timeout 65;
      client_max_body_size 50m; client_body_timeout 60s; client_header_timeout 60s;

      map $http_upgrade $connection_upgrade { default upgrade; '' close; }

      upstream console_ui { server kogito-management-console.drools.svc.cluster.local:8080; keepalive 16; }
      upstream data_index { server kogito-data-index.drools.svc.cluster.local:8080; keepalive 16; }
      upstream jobs_service { server kogito-jobs-service.drools.svc.cluster.local:8080; keepalive 16; }

      server {
        listen 8080; server_name localhost;

        location ^~ /assets/images/ {
          rewrite ^/assets/images/(.*)$ /images/$1 last;
        }

        location ^~ /assets/fonts/ {
          rewrite ^/assets/fonts/(.*)$ /fonts/$1 last;
        }

        location ^~ /assets/pficon/ {
          rewrite ^/assets/pficon/(.*)$ /fonts/$1 last;
        }

        location /graphql {
          proxy_pass http://data_index;
          proxy_http_version 1.1;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection $connection_upgrade;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header X-Forwarded-Host $host;
          proxy_read_timeout 300s;
        }

        location /jobs {
          proxy_pass http://jobs_service;
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header X-Forwarded-Host $host;
          proxy_read_timeout 300s;
        }

        location ~* \\.png$ {
          proxy_pass http://console_ui;
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header X-Forwarded-Host $host;
          proxy_set_header Authorization "";
          proxy_hide_header Content-Type;
          add_header Content-Type image/png always;
          proxy_read_timeout 300s;
        }

        location ~* \\.jpe?g$ {
          proxy_pass http://console_ui;
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header X-Forwarded-Host $host;
          proxy_set_header Authorization "";
          proxy_hide_header Content-Type;
          add_header Content-Type image/jpeg always;
          proxy_read_timeout 300s;
        }

        location ~* \\.gif$ {
          proxy_pass http://console_ui;
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header X-Forwarded-Host $host;
          proxy_set_header Authorization "";
          proxy_hide_header Content-Type;
          add_header Content-Type image/gif always;
          proxy_read_timeout 300s;
        }

        location ~* \\.webp$ {
          proxy_pass http://console_ui;
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header X-Forwarded-Host $host;
          proxy_set_header Authorization "";
          proxy_hide_header Content-Type;
          add_header Content-Type image/webp always;
          proxy_read_timeout 300s;
        }

        location ~* \\.ico$ {
          proxy_pass http://console_ui;
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header X-Forwarded-Host $host;
          proxy_set_header Authorization "";
          proxy_hide_header Content-Type;
          add_header Content-Type image/x-icon always;
          proxy_read_timeout 300s;
        }

        location ~* \\.woff2$ {
          proxy_pass http://console_ui;
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
