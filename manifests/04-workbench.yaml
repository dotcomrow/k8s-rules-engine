# =========================
# KIE Workbench (Business Central) – Showcase image + redirect
# =========================
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kie-workbench-niogit
  namespace: drools
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
    argocd.argoproj.io/sync-wave: "0"
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: longhorn
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kie-workbench-m2
  namespace: drools
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
    argocd.argoproj.io/sync-wave: "0"
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: longhorn
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kie-workbench
  namespace: drools
  labels:
    app: kie-workbench
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  # First boot can take longer than 30 minutes while Vault, OIDC, Maven, and
  # Workbench initialization complete; ArgoCD blocks later waves if this trips.
  progressDeadlineSeconds: 3600
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: kie-workbench }
  template:
    metadata:
      labels:
        app: kie-workbench
      annotations:
        # Business Central uses WildFly management (http-remoting on :9990) to populate the
        # Deployments/Data Sources UI. Linkerd's proxying can break this loopback connection.
        config.linkerd.io/skip-outbound-ports: "9990"
        config.linkerd.io/skip-inbound-ports: "9990"
    spec:
      serviceAccountName: drools-workbench
      securityContext:
        fsGroup: 1000
      volumes:
        - name: workbench-config
          emptyDir: {}
        - name: redirect-cli
          configMap:
            name: workbench-redirect-cli
            items:
              - { key: enable-redirect.cli, path: enable-redirect.cli, mode: 0444 }
              - { key: run-cli.sh,        path: run-cli.sh,        mode: 0555 }
        - name: welcome-content
          emptyDir: {}
        - name: vault-secrets
          emptyDir: {}
        - name: workbench-niogit
          persistentVolumeClaim:
            claimName: kie-workbench-niogit
        - name: workbench-m2
          persistentVolumeClaim:
            claimName: kie-workbench-m2
        - name: wildfly-oidc
          configMap:
            name: wildfly-oidc-config
            items:
              - { key: enable-oidc.cli,    path: enable-oidc.cli,    mode: 0444 }
              - { key: configure-oidc.sh,  path: configure-oidc.sh,  mode: 0555 }
        - name: wildfly-modules
          emptyDir: {}
        - name: workbench-extra-libs
          emptyDir: {}

      initContainers:
        - name: wait-for-config-job
          image: alpine/k8s:1.31.4
          command: ["/bin/sh","-lc"]
          args:
            - |
              echo "Waiting for Job vault/drools-yugabyte-config to complete..."
              while true; do
                if ! kubectl -n vault get job drools-yugabyte-config >/dev/null 2>&1; then
                  echo "  └─ job not found yet..."; sleep 5; continue
                fi
                SUCC="$(kubectl -n vault get job drools-yugabyte-config -o jsonpath='{.status.succeeded}' 2>/dev/null || true)"; SUCC="${SUCC:-0}"
                [ "$SUCC" -ge 1 ] && break
                sleep 5
              done
        - name: vault-kie-users
          image: hashicorp/vault:1.15.4
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              export VAULT_ADDR="http://vault.vault.svc.cluster.local:8200"
              apk add --no-cache jq curl
              VAULT_TOKEN=$(vault write -field=token auth/kubernetes/login \
                role=drools \
                jwt=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token))
              export VAULT_TOKEN

              OIDC_ENV_FILE="/shared/oidc-env.sh"
              : > "$OIDC_ENV_FILE"
              # Base OIDC settings (constant)
              OIDC_AUTH_URL="https://auth.suncoast.systems"
              OIDC_REALM="internal"
              echo "export OIDC_AUTH_URL=\"$OIDC_AUTH_URL\"" >> "$OIDC_ENV_FILE"
              echo "export OIDC_REALM=\"$OIDC_REALM\"" >> "$OIDC_ENV_FILE"
              echo 'export OIDC_CONFIDENTIAL="true"' >> "$OIDC_ENV_FILE"
              echo 'export OIDC_ENABLE_BASIC_AUTH="false"' >> "$OIDC_ENV_FILE"
              echo 'export OIDC_BEARER_ONLY="false"' >> "$OIDC_ENV_FILE"
              echo "export OIDC_KIE_SERVER_AUTH_URL=\"$OIDC_AUTH_URL\"" >> "$OIDC_ENV_FILE"
              echo "export OIDC_KIE_SERVER_REALM=\"$OIDC_REALM\"" >> "$OIDC_ENV_FILE"
              echo 'export OIDC_KIE_SERVER_CONFIDENTIAL="false"' >> "$OIDC_ENV_FILE"
              echo 'export OIDC_KIE_SERVER_BEARER_ONLY="false"' >> "$OIDC_ENV_FILE"
              echo 'export OIDC_KIE_SERVER_ENABLE_BASIC_AUTH="false"' >> "$OIDC_ENV_FILE"

              REALM_JSON="$(curl -fsSL "$OIDC_AUTH_URL/realms/$OIDC_REALM")"
              OIDC_PUBLIC_KEY="$(printf '%s' "$REALM_JSON" | jq -r '.public_key // empty')"
              if [ -z "${OIDC_PUBLIC_KEY:-}" ]; then
                echo "❌ Keycloak realm public key not found"
                exit 1
              fi
              OIDC_PUBLIC_KEY_PEM="$(printf '-----BEGIN PUBLIC KEY-----\n%s\n-----END PUBLIC KEY-----' "$OIDC_PUBLIC_KEY")"
              printf 'export OIDC_JWT_PUBLIC_KEY="%s"\n' "$OIDC_PUBLIC_KEY_PEM" >> "$OIDC_ENV_FILE"

              OIDC_ID_JSON="$(vault kv get -format=json secret/keycloak-client-id-drools-workbench 2>/dev/null || true)"
              OIDC_ID="$(printf '%s' "$OIDC_ID_JSON" | jq -r '.data.data.value // .data.data.id // empty')"
              if [ -z "${OIDC_ID:-}" ]; then
                echo "❌ OIDC client id not found at secret/keycloak-client-id-drools-workbench"
                exit 1
              fi
              echo "✅ OIDC client id loaded for drools-workbench"
              echo "export OIDC_CLIENT_ID=\"$OIDC_ID\"" >> "$OIDC_ENV_FILE"

              OIDC_SECRET_JSON="$(vault kv get -format=json secret/keycloak-client-secret-drools-workbench 2>/dev/null || true)"
              OIDC_SECRET="$(printf '%s' "$OIDC_SECRET_JSON" | jq -r '.data.data.value // .data.data.secret // empty')"
              if [ -z "${OIDC_SECRET:-}" ]; then
                echo "❌ OIDC client secret not found at secret/keycloak-client-secret-drools-workbench"
                exit 1
              fi
              echo "export OIDC_CLIENT_SECRET=\"$OIDC_SECRET\"" >> "$OIDC_ENV_FILE"
              echo "✅ OIDC client secret loaded for drools-workbench"

              KIE_OIDC_ID_JSON="$(vault kv get -format=json secret/keycloak-client-id-drools-kie-server 2>/dev/null || true)"
              KIE_OIDC_ID="$(printf '%s' "$KIE_OIDC_ID_JSON" | jq -r '.data.data.value // .data.data.id // empty')"
              if [ -z "${KIE_OIDC_ID:-}" ]; then
                echo "❌ OIDC client id not found at secret/keycloak-client-id-drools-kie-server"
                exit 1
              fi
              echo "✅ OIDC client id loaded for drools-kie-server"
              echo "export OIDC_KIE_SERVER_CLIENT_ID=\"$KIE_OIDC_ID\"" >> "$OIDC_ENV_FILE"

              KIE_OIDC_SECRET_JSON="$(vault kv get -format=json secret/keycloak-client-secret-drools-kie-server 2>/dev/null || true)"
              KIE_OIDC_SECRET="$(printf '%s' "$KIE_OIDC_SECRET_JSON" | jq -r '.data.data.value // .data.data.secret // empty')"
              if [ -z "${KIE_OIDC_SECRET:-}" ]; then
                echo "❌ OIDC client secret not found at secret/keycloak-client-secret-drools-kie-server"
                exit 1
              fi
              echo "export OIDC_KIE_SERVER_CLIENT_SECRET=\"$KIE_OIDC_SECRET\"" >> "$OIDC_ENV_FILE"
              echo "✅ OIDC client secret loaded for drools-kie-server"

              GH_USER_JSON="$(vault kv get -format=json secret/k8s-rules-engine-github-packages-username 2>/dev/null || true)"
              GH_USER="$(printf '%s' "$GH_USER_JSON" | jq -r '.data.data.value // empty')"
              GH_TOKEN_JSON="$(vault kv get -format=json secret/k8s-rules-engine-github-packages-token 2>/dev/null || true)"
              GH_TOKEN="$(printf '%s' "$GH_TOKEN_JSON" | jq -r '.data.data.value // empty')"
              if [ -z "${GH_USER:-}" ] || [ -z "${GH_TOKEN:-}" ]; then
                echo "❌ Missing GitHub Packages credentials in Vault"
                exit 1
              fi
              K8S_API="https://kubernetes.default.svc"
              SA_TOKEN="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
              CA_CERT="/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
              EXTRA_REPOS="$(curl -fsS --cacert "$CA_CERT" -H "Authorization: Bearer $SA_TOKEN" \
                "$K8S_API/api/v1/namespaces/drools/configmaps?labelSelector=rules.dotcomrow/maven-repo%3Dtrue" \
                | jq -r '.items[]? | select(.data["repo-id"] and .data["repo-url"]) | "\(.data["repo-id"])|\(.data["repo-url"])"' \
                | sort -u || true)"
              EXTRA_REPO_SERVERS=""
              EXTRA_REPO_BLOCKS=""
              EXTRA_PLUGIN_REPO_BLOCKS=""
              if [ -n "${EXTRA_REPOS:-}" ]; then
                IFS=$'\n'
                for entry in $EXTRA_REPOS; do
                  repo_id="${entry%%|*}"
                  repo_url="${entry#*|}"
                  case "$repo_id" in
                    github|central|guvnor-m2-repo|kie-server)
                      continue
                      ;;
                  esac
                  EXTRA_REPO_SERVERS="${EXTRA_REPO_SERVERS}
                  <server>
                    <id>${repo_id}</id>
                    <username>${GH_USER}</username>
                    <password>${GH_TOKEN}</password>
                  </server>"
                  EXTRA_REPO_BLOCKS="${EXTRA_REPO_BLOCKS}
                      <repository>
                        <id>${repo_id}</id>
                        <url>${repo_url}</url>
                        <releases><enabled>true</enabled></releases>
                        <snapshots><enabled>true</enabled></snapshots>
                      </repository>"
                  EXTRA_PLUGIN_REPO_BLOCKS="${EXTRA_PLUGIN_REPO_BLOCKS}
                      <pluginRepository>
                        <id>${repo_id}</id>
                        <url>${repo_url}</url>
                        <releases><enabled>true</enabled></releases>
                        <snapshots><enabled>true</enabled></snapshots>
                      </pluginRepository>"
                done
                unset IFS
              fi
              mkdir -p /workbench-m2
              cat > /workbench-m2/settings.xml <<EOF
              <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                        xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                        xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 https://maven.apache.org/xsd/settings-1.0.0.xsd">
                <servers>
                  <server>
                    <id>github</id>
                    <username>${GH_USER}</username>
                    <password>${GH_TOKEN}</password>
                  </server>
                  <server>
                    <id>guvnor-m2-repo</id>
                    <username>${GH_USER}</username>
                    <password>${GH_TOKEN}</password>
                  </server>
                  <server>
                    <id>kie-server</id>
                    <username>${GH_USER}</username>
                    <password>${GH_TOKEN}</password>
                  </server>
                  ${EXTRA_REPO_SERVERS}
                </servers>
                <profiles>
                  <profile>
                    <id>github</id>
                    <repositories>
                      <repository>
                        <id>github</id>
                        <url>https://maven.pkg.github.com/dotcomrow/rules-packages</url>
                        <releases><enabled>true</enabled></releases>
                        <snapshots><enabled>true</enabled></snapshots>
                      </repository>
                      ${EXTRA_REPO_BLOCKS}
                      <repository>
                        <id>central</id>
                        <url>https://repo1.maven.org/maven2/</url>
                        <releases><enabled>true</enabled></releases>
                        <snapshots><enabled>false</enabled></snapshots>
                      </repository>
                    </repositories>
                    <pluginRepositories>
                      <pluginRepository>
                        <id>github</id>
                        <url>https://maven.pkg.github.com/dotcomrow/rules-packages</url>
                        <releases><enabled>true</enabled></releases>
                        <snapshots><enabled>true</enabled></snapshots>
                      </pluginRepository>
                      ${EXTRA_PLUGIN_REPO_BLOCKS}
                      <pluginRepository>
                        <id>central</id>
                        <url>https://repo1.maven.org/maven2/</url>
                        <releases><enabled>true</enabled></releases>
                        <snapshots><enabled>false</enabled></snapshots>
                      </pluginRepository>
                    </pluginRepositories>
                  </profile>
                </profiles>
                <activeProfiles>
                  <activeProfile>github</activeProfile>
                </activeProfiles>
              </settings>
              EOF
              echo "✅ GitHub Packages Maven settings created"

              KIE_ENV_FILE="/shared/kie-users-env.sh"
              : > "$KIE_ENV_FILE"
              ADMIN_JSON="$(vault kv get -format=json secret/drools/admin 2>/dev/null || true)"
              ADMIN_USER="$(printf '%s' "$ADMIN_JSON" | jq -r '.data.data.username // empty')"
              ADMIN_PASS="$(printf '%s' "$ADMIN_JSON" | jq -r '.data.data.password // empty')"
              KIE_USER_JSON="$(vault kv get -format=json secret/drools/kie-user 2>/dev/null || true)"
              KIE_USER="$(printf '%s' "$KIE_USER_JSON" | jq -r '.data.data.username // empty')"
              KIE_PASS="$(printf '%s' "$KIE_USER_JSON" | jq -r '.data.data.password // empty')"
              if [ -z "${ADMIN_USER:-}" ] || [ -z "${ADMIN_PASS:-}" ]; then
                echo "Missing drools admin creds in Vault"
                exit 1
              fi
              {
                echo "export KIE_SERVER_CONTROLLER_USER=\"$ADMIN_USER\""
                echo "export KIE_SERVER_CONTROLLER_PWD=\"$ADMIN_PASS\""
                echo "export KIE_SERVER_USER=\"$ADMIN_USER\""
                echo "export KIE_SERVER_PWD=\"$ADMIN_PASS\""
              } > "$KIE_ENV_FILE"
          volumeMounts:
            - name: vault-secrets
              mountPath: /shared
            - name: workbench-m2
              mountPath: /workbench-m2
        - name: vault-db-creds
          image: hashicorp/vault:1.15.4
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              export VAULT_ADDR="http://vault.vault.svc.cluster.local:8200"
              apk add --no-cache jq curl
              # Authenticate with Kubernetes auth
              VAULT_TOKEN=$(vault write -field=token auth/kubernetes/login \
                role=drools \
                jwt=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token))
              export VAULT_TOKEN
              
              echo "🔑 Fetching database credentials from Vault..."
              vault read -format=json yugabyte-db/static-creds/drools-yb-admin > /shared/db-creds.json
              
              # Extract credentials and create environment file
              DB_USERNAME=$(cat /shared/db-creds.json | jq -r '.data.username')
              DB_PASSWORD=$(cat /shared/db-creds.json | jq -r '.data.password')
              
              echo "export KIE_CONNECTION_USERNAME=\"$DB_USERNAME\"" > /shared/db-env.sh
              echo "export KIE_CONNECTION_PASSWORD=\"$DB_PASSWORD\"" >> /shared/db-env.sh
              
              echo "✅ Database credentials retrieved: user=$DB_USERNAME"

              OIDC_ENV_FILE="/shared/oidc-env.sh"
              : > "$OIDC_ENV_FILE"
              # Base OIDC settings (constant)
              OIDC_AUTH_URL="https://auth.suncoast.systems"
              OIDC_REALM="internal"
              echo "export OIDC_AUTH_URL=\"$OIDC_AUTH_URL\"" >> "$OIDC_ENV_FILE"
              echo "export OIDC_REALM=\"$OIDC_REALM\"" >> "$OIDC_ENV_FILE"
              echo 'export OIDC_CONFIDENTIAL="true"' >> "$OIDC_ENV_FILE"
              echo 'export OIDC_ENABLE_BASIC_AUTH="false"' >> "$OIDC_ENV_FILE"
              echo 'export OIDC_BEARER_ONLY="false"' >> "$OIDC_ENV_FILE"
              echo "export OIDC_KIE_SERVER_AUTH_URL=\"$OIDC_AUTH_URL\"" >> "$OIDC_ENV_FILE"
              echo "export OIDC_KIE_SERVER_REALM=\"$OIDC_REALM\"" >> "$OIDC_ENV_FILE"
              echo 'export OIDC_KIE_SERVER_CONFIDENTIAL="false"' >> "$OIDC_ENV_FILE"
              echo 'export OIDC_KIE_SERVER_BEARER_ONLY="false"' >> "$OIDC_ENV_FILE"
              echo 'export OIDC_KIE_SERVER_ENABLE_BASIC_AUTH="false"' >> "$OIDC_ENV_FILE"

              REALM_JSON="$(curl -fsSL "$OIDC_AUTH_URL/realms/$OIDC_REALM")"
              OIDC_PUBLIC_KEY="$(printf '%s' "$REALM_JSON" | jq -r '.public_key // empty')"
              if [ -z "${OIDC_PUBLIC_KEY:-}" ]; then
                echo "❌ Keycloak realm public key not found"
                exit 1
              fi
              OIDC_PUBLIC_KEY_PEM="$(printf '-----BEGIN PUBLIC KEY-----\n%s\n-----END PUBLIC KEY-----' "$OIDC_PUBLIC_KEY")"
              printf 'export OIDC_JWT_PUBLIC_KEY="%s"\n' "$OIDC_PUBLIC_KEY_PEM" >> "$OIDC_ENV_FILE"

              OIDC_ID_JSON="$(vault kv get -format=json secret/keycloak-client-id-drools-workbench 2>/dev/null || true)"
              OIDC_ID="$(printf '%s' "$OIDC_ID_JSON" | jq -r '.data.data.value // .data.data.id // empty')"
              if [ -z "${OIDC_ID:-}" ]; then
                echo "❌ OIDC client id not found at secret/keycloak-client-id-drools-workbench"
                exit 1
              fi
              echo "✅ OIDC client id loaded for drools-workbench"
              echo "export OIDC_CLIENT_ID=\"$OIDC_ID\"" >> "$OIDC_ENV_FILE"

              OIDC_SECRET_JSON="$(vault kv get -format=json secret/keycloak-client-secret-drools-workbench 2>/dev/null || true)"
              OIDC_SECRET="$(printf '%s' "$OIDC_SECRET_JSON" | jq -r '.data.data.value // .data.data.secret // empty')"
              if [ -z "${OIDC_SECRET:-}" ]; then
                echo "❌ OIDC client secret not found at secret/keycloak-client-secret-drools-workbench"
                exit 1
              fi
              echo "export OIDC_CLIENT_SECRET=\"$OIDC_SECRET\"" >> "$OIDC_ENV_FILE"
              echo "✅ OIDC client secret loaded for drools-workbench"

              KIE_OIDC_ID_JSON="$(vault kv get -format=json secret/keycloak-client-id-drools-kie-server 2>/dev/null || true)"
              KIE_OIDC_ID="$(printf '%s' "$KIE_OIDC_ID_JSON" | jq -r '.data.data.value // .data.data.id // empty')"
              if [ -z "${KIE_OIDC_ID:-}" ]; then
                echo "❌ OIDC client id not found at secret/keycloak-client-id-drools-kie-server"
                exit 1
              fi
              echo "✅ OIDC client id loaded for drools-kie-server"
              echo "export OIDC_KIE_SERVER_CLIENT_ID=\"$KIE_OIDC_ID\"" >> "$OIDC_ENV_FILE"

              KIE_OIDC_SECRET_JSON="$(vault kv get -format=json secret/keycloak-client-secret-drools-kie-server 2>/dev/null || true)"
              KIE_OIDC_SECRET="$(printf '%s' "$KIE_OIDC_SECRET_JSON" | jq -r '.data.data.value // .data.data.secret // empty')"
              if [ -z "${KIE_OIDC_SECRET:-}" ]; then
                echo "❌ OIDC client secret not found at secret/keycloak-client-secret-drools-kie-server"
                exit 1
              fi
              echo "export OIDC_KIE_SERVER_CLIENT_SECRET=\"$KIE_OIDC_SECRET\"" >> "$OIDC_ENV_FILE"
              echo "✅ OIDC client secret loaded for drools-kie-server"

              # Seed Workbench local users for Basic auth (controller sync)
              ADMIN_JSON="$(vault kv get -format=json secret/drools/admin 2>/dev/null || true)"
              ADMIN_USER="$(printf '%s' "$ADMIN_JSON" | jq -r '.data.data.username // empty')"
              ADMIN_PASS="$(printf '%s' "$ADMIN_JSON" | jq -r '.data.data.password // empty')"
              KIE_USER_JSON="$(vault kv get -format=json secret/drools/kie-user 2>/dev/null || true)"
              KIE_USER="$(printf '%s' "$KIE_USER_JSON" | jq -r '.data.data.username // empty')"
              KIE_PASS="$(printf '%s' "$KIE_USER_JSON" | jq -r '.data.data.password // empty')"
              if [ -z "${ADMIN_USER:-}" ] || [ -z "${ADMIN_PASS:-}" ] || [ -z "${KIE_USER:-}" ] || [ -z "${KIE_PASS:-}" ]; then
                echo "❌ Missing drools admin/kie-user creds in Vault"
                exit 1
              fi
              REALM="ApplicationRealm"
              ADMIN_HASH="$(printf '%s:%s:%s' "$ADMIN_USER" "$REALM" "$ADMIN_PASS" | md5sum | awk '{print $1}')"
              KIE_HASH="$(printf '%s:%s:%s' "$KIE_USER" "$REALM" "$KIE_PASS" | md5sum | awk '{print $1}')"
              USERS_FILE="/shared/application-users.properties"
              ROLES_FILE="/shared/application-roles.properties"
              printf '%s=%s\n' "$ADMIN_USER" "$ADMIN_HASH" > "$USERS_FILE"
              printf '%s=%s\n' "$KIE_USER" "$KIE_HASH" >> "$USERS_FILE"
              printf '%s=%s\n' "$ADMIN_USER" "admin,rest-all,developer,analyst,manager,user,kie-server" > "$ROLES_FILE"
              printf '%s=%s\n' "$KIE_USER" "kie-server,rest-all" >> "$ROLES_FILE"
              echo "✅ Workbench application users/roles seeded"
          volumeMounts:
            - name: vault-secrets
              mountPath: /shared
        - name: configure-root-redirect
          image: quay.io/kiegroup/business-central-workbench-showcase:7.74.1.Final
          command: ["/bin/sh","-c"]
          args: ["/redirect/run-cli.sh"]
          volumeMounts:
            - { name: workbench-config, mountPath: /config }
            - { name: redirect-cli,     mountPath: /redirect }
            - { name: vault-secrets,    mountPath: /shared }
        - name: copy-wildfly-modules
          image: quay.io/kiegroup/business-central-workbench-showcase:7.74.1.Final
          command: ["/bin/sh","-c"]
          args:
            - |
              set -euo pipefail
              cp -R /opt/jboss/wildfly/modules/. /target/
              echo "✅ WildFly modules copied"
          volumeMounts:
            - { name: wildfly-modules, mountPath: /target }
        - name: install-keycloak-adapter
          image: alpine:3.20
          command: ["/bin/sh","-c"]
          env:
            - name: KEYCLOAK_ADAPTER_URL
              value: "https://repo1.maven.org/maven2/org/keycloak/keycloak-wildfly-adapter-dist/24.0.5/keycloak-wildfly-adapter-dist-24.0.5.zip"
          args:
            - |
              set -euo pipefail
              apk add --no-cache curl unzip
              WORK="/tmp/keycloak"
              mkdir -p "$WORK"
              echo "⬇️  Downloading Keycloak WildFly adapter..."
              curl -fsSL "$KEYCLOAK_ADAPTER_URL" -o "$WORK/adapter.zip"
              unzip -q "$WORK/adapter.zip" -d "$WORK"
              ADAPTER_DIR="$(find "$WORK" -maxdepth 1 -type d -name "keycloak-wildfly-adapter-dist*" | head -n1)"
              if [ -z "$ADAPTER_DIR" ] || [ ! -d "$ADAPTER_DIR/modules" ]; then
                if [ -d "$WORK/modules" ]; then
                  ADAPTER_DIR="$WORK"
                else
                  echo "❌ Keycloak adapter modules not found in distribution."
                  find "$WORK" -maxdepth 2 -type d -name "modules" -print || true
                  exit 1
                fi
              fi
              cp -R "$ADAPTER_DIR/modules/." /target/
              if [ -d /target/system/add-ons/keycloak/org/keycloak ]; then
                mkdir -p /target/system/layers/base/org
                cp -R /target/system/add-ons/keycloak/org/keycloak /target/system/layers/base/org/
              fi
              echo "✅ Keycloak adapter modules installed"
          volumeMounts:
            - { name: wildfly-modules, mountPath: /target }
        - name: install-cglib-module
          image: alpine:3.20
          command: ["/bin/sh","-c"]
          env:
            - name: CGLIB_VERSION
              value: "3.2.12"
          args:
            - |
              set -euo pipefail
              apk add --no-cache curl
              TARGET_DIR="/target/system/layers/base/net/sf/cglib/main"
              mkdir -p "$TARGET_DIR"
              JAR="cglib-nodep-${CGLIB_VERSION}.jar"
              URL="https://repo1.maven.org/maven2/cglib/cglib-nodep/${CGLIB_VERSION}/${JAR}"
              echo "Downloading cglib ${CGLIB_VERSION}..."
              curl -fsSL "$URL" -o "${TARGET_DIR}/${JAR}"
              cat > "${TARGET_DIR}/module.xml" << EOF
              <?xml version="1.0" encoding="UTF-8"?>
              <module xmlns="urn:jboss:module:1.9" name="net.sf.cglib">
                <resources>
                  <resource-root path="${JAR}"/>
                </resources>
              </module>
              EOF
              echo "✅ cglib module installed: ${JAR}"
          volumeMounts:
            - { name: wildfly-modules, mountPath: /target }
        - name: install-workbench-libs
          image: alpine:3.20
          command: ["/bin/sh","-c"]
          env:
            - name: DROOLS_VERSION
              value: "7.74.1.Final"
          args:
            - |
              set -euo pipefail
              apk add --no-cache curl
              JAR="drools-compiler-${DROOLS_VERSION}.jar"
              URL="https://repo1.maven.org/maven2/org/drools/drools-compiler/${DROOLS_VERSION}/${JAR}"
              echo "Downloading ${JAR}..."
              curl -fsSL "$URL" -o "/target/${JAR}"
              echo "drools-compiler downloaded"
              echo "drools-compiler staged for Workbench injection"
          volumeMounts:
            - { name: workbench-extra-libs, mountPath: /target }
        - name: build-workbench-jdt-core
          image: maven:3.9.7-eclipse-temurin-11
          command: ["/bin/sh","-c"]
          env:
            - name: JDT_CORE_VERSION
              value: "3.18.0"
          args:
            - |
              set -eu
              WORKDIR="/tmp/jdt-core-shaded"
              mkdir -p "$WORKDIR"
              cat > "$WORKDIR/pom.xml" <<EOF
              <project xmlns="http://maven.apache.org/POM/4.0.0"
                       xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                       xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 http://maven.apache.org/xsd/maven-4.0.0.xsd">
                <modelVersion>4.0.0</modelVersion>
                <groupId>org.drools</groupId>
                <artifactId>jdt-core-shaded</artifactId>
                <version>${JDT_CORE_VERSION}</version>
                <dependencies>
                  <dependency>
                    <groupId>org.eclipse.jdt</groupId>
                    <artifactId>org.eclipse.jdt.core</artifactId>
                    <version>${JDT_CORE_VERSION}</version>
                  </dependency>
                </dependencies>
                <build>
                  <plugins>
                    <plugin>
                      <groupId>org.apache.maven.plugins</groupId>
                      <artifactId>maven-shade-plugin</artifactId>
                      <version>3.5.0</version>
                      <executions>
                        <execution>
                          <phase>package</phase>
                          <goals>
                            <goal>shade</goal>
                          </goals>
                          <configuration>
                            <createDependencyReducedPom>false</createDependencyReducedPom>
                            <filters>
                              <filter>
                                <artifact>*:*</artifact>
                                <excludes>
                                  <exclude>META-INF/*.SF</exclude>
                                  <exclude>META-INF/*.DSA</exclude>
                                  <exclude>META-INF/*.RSA</exclude>
                                </excludes>
                              </filter>
                            </filters>
                            <artifactSet>
                              <includes>
                                <include>org.eclipse.jdt:org.eclipse.jdt.core</include>
                              </includes>
                            </artifactSet>
                            <relocations>
                              <relocation>
                                <pattern>org.eclipse.jdt</pattern>
                                <shadedPattern>org.drools.compiler.shade.org.eclipse.jdt</shadedPattern>
                              </relocation>
                            </relocations>
                          </configuration>
                        </execution>
                      </executions>
                    </plugin>
                  </plugins>
                </build>
              </project>
              EOF
              cd "$WORKDIR"
              mvn -q -DskipTests package
              JAR="jdt-core-shaded-${JDT_CORE_VERSION}.jar"
              cp "$WORKDIR/target/${JAR}" "/target/${JAR}"
              echo "jdt-core shaded jar staged for Workbench injection: ${JAR}"
          volumeMounts:
            - { name: workbench-extra-libs, mountPath: /target }
        - name: install-eclipse-runtime-libs
          image: alpine:3.20
          command: ["/bin/sh","-c"]
          env:
            - name: ECLIPSE_RUNTIME_VERSION
              value: "3.20.0"
            - name: EQUINOX_COMMON_VERSION
              value: "3.14.0"
          args:
            - |
              set -euo pipefail
              apk add --no-cache curl
              RUNTIME_JAR="org.eclipse.core.runtime-${ECLIPSE_RUNTIME_VERSION}.jar"
              RUNTIME_URL="https://repo1.maven.org/maven2/org/eclipse/platform/org.eclipse.core.runtime/${ECLIPSE_RUNTIME_VERSION}/${RUNTIME_JAR}"
              COMMON_JAR="org.eclipse.equinox.common-${EQUINOX_COMMON_VERSION}.jar"
              COMMON_URL="https://repo1.maven.org/maven2/org/eclipse/platform/org.eclipse.equinox.common/${EQUINOX_COMMON_VERSION}/${COMMON_JAR}"
              echo "Downloading Eclipse runtime libs..."
              curl -fsSL "$RUNTIME_URL" -o "/target/${RUNTIME_JAR}"
              curl -fsSL "$COMMON_URL" -o "/target/${COMMON_JAR}"
              echo "✅ Eclipse runtime libs staged for Workbench injection"
          volumeMounts:
            - { name: workbench-extra-libs, mountPath: /target }
        - name: configure-oidc
          image: quay.io/kiegroup/business-central-workbench-showcase:7.74.1.Final
          command: ["/bin/sh","-c"]
          args:
            - |
              set -e
              sh /oidc/configure-oidc.sh
          env:
            - { name: OIDC_ENABLE, value: "true" }
          volumeMounts:
            - { name: workbench-config, mountPath: /opt/jboss/wildfly/standalone/configuration }
            - { name: wildfly-oidc, mountPath: /oidc }
            - { name: vault-secrets, mountPath: /vault-secrets }
            - { name: wildfly-modules, mountPath: /opt/jboss/wildfly/modules }
        - name: setup-redirect-fallback
          image: quay.io/kiegroup/business-central-workbench-showcase:7.74.1.Final
          command: ["/bin/sh", "-c"]
          args:
            - |
              rm -rf /opt/jboss/wildfly/welcome-content/*
              cat > /opt/jboss/wildfly/welcome-content/index.html << 'EOF'
              <!DOCTYPE html><meta http-equiv="refresh" content="0; url=/business-central/">
              <title>Redirecting…</title><a href="/business-central/">Continue</a>
              EOF
          volumeMounts:
            - { name: welcome-content, mountPath: /opt/jboss/wildfly/welcome-content }
      containers:
        - name: kie-workbench
          image: quay.io/kiegroup/business-central-workbench-showcase:7.74.1.Final
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -e
              echo "🔑 Loading database credentials from Vault..."
              if [ -f /vault-secrets/db-env.sh ]; then
                source /vault-secrets/db-env.sh
                echo "✅ Database credentials loaded for user: $KIE_CONNECTION_USERNAME"
                export KIE_CONNECTION_USERNAME
                export KIE_CONNECTION_PASSWORD
              else
                echo "❌ Database credentials not found!"
                exit 1
              fi

              if [ -f /vault-secrets/oidc-env.sh ]; then
                # shellcheck disable=SC1091
                . /vault-secrets/oidc-env.sh
              fi

              if [ -f /vault-secrets/kie-users-env.sh ]; then
                # shellcheck disable=SC1091
                . /vault-secrets/kie-users-env.sh
                if [ -n "${KIE_SERVER_USER:-}" ] && [ -n "${KIE_SERVER_PWD:-}" ]; then
                  JAVA_OPTS="$JAVA_OPTS -Dorg.kie.server.user=${KIE_SERVER_USER} -Dorg.kie.server.pwd=${KIE_SERVER_PWD}"
                  export JAVA_OPTS
                fi
              fi

              if [ -n "${JAVA_OPTS_APPEND:-}" ]; then
                JAVA_OPTS="$JAVA_OPTS $JAVA_OPTS_APPEND"
                export JAVA_OPTS
              fi

              EXTRA_LIBS_DIR="/workbench-extra-libs"
              BC_LIB_DIR="/opt/jboss/wildfly/standalone/deployments/business-central.war/WEB-INF/lib"
              if [ -d "$BC_LIB_DIR" ]; then
                for jar in "$EXTRA_LIBS_DIR"/*.jar; do
                  [ -f "$jar" ] || continue
                  base="$(basename "$jar")"
                  if [ ! -f "$BC_LIB_DIR/$base" ]; then
                    echo "Injecting ${base} into business-central libs..."
                    cp "$jar" "$BC_LIB_DIR/"
                  fi
                done
              else
                echo "WARN: business-central.war not exploded; skipping extra lib injection"
              fi
              
              echo "🚀 Starting KIE Workbench..."
              exec /opt/jboss/wildfly/bin/standalone.sh -b 0.0.0.0 -bmanagement 0.0.0.0
          ports:
            - { name: http,  containerPort: 8080 }
            - { name: debug, containerPort: 8001 }
            - { name: git,   containerPort: 9418 }
          env:
            - name: JAVA_OPTS
              value: >-
                -Xms512m -Xmx2048m -Dorg.kie.workbench.profile=FULL
                -Dorg.uberfire.nio.git.daemon.host=0.0.0.0
                -Dorg.uberfire.nio.git.dir=/opt/jboss/.niogit
                -Dorg.uberfire.nio.git.defaultbranch=prod
                -Dorg.uberfire.nio.git.default.branch=prod
                -Dorg.uberfire.nio.git.defaultBranch=prod
                -Djboss.bind.address=0.0.0.0
                -Djboss.bind.address.management=0.0.0.0
                -Dorg.kie.server.location=https://workbench-drools.teleport.app.suncoast.systems/business-central/
                -Djboss.http.proxy.scheme=https
                -Djboss.http.proxy.port=443
                -Djboss.http.proxy.proxyName=workbench-drools.teleport.app.suncoast.systems
                -Dorg.jboss.as.logging.per-deployment=false
                -Dorg.kie.security.useSSO=true
                -Dorg.uberfire.ext.security.management.keycloak.enabled=true
                -Dorg.uberfire.ext.security.management.keycloak.authServer=https://auth.suncoast.systems
                -Dorg.uberfire.ext.security.management.keycloak.use-resource-role-mappings=true
                -Dorg.kie.maven.settings.custom=/opt/jboss/.m2/settings.xml
                -Dorg.guvnor.m2repo.id=github
                -Dorg.guvnor.m2repo.url=https://maven.pkg.github.com/dotcomrow/rules-packages
            - name: JAVA_OPTS_APPEND
              value: >-
                -Djboss.logging.level.org.keycloak.adapters=DEBUG
                -Djboss.logging.level.org.keycloak.adapters.OAuthRequestAuthenticator=DEBUG
                -Djboss.logging.level.org.keycloak=DEBUG
                -Djboss.as.management.blocking.timeout=600
                -Dorg.jboss.as.controller.blocking.timeout=600
                -Derrai.bus.enable_sse_support=false
            - name: DROOLS_VERSION
              value: "7.74.1.Final"
            - name: KIE_CONNECTION_URL
              value: "jdbc:postgresql://yb-tserver-service.yugabyte.svc.cluster.local:5433/drools?currentSchema=drools&sslmode=disable"
            - name: KIE_CONNECTION_DRIVER_CLASS
              value: "org.postgresql.Driver"
            - name: PROXY_ADDRESS_FORWARDING
              value: "true"
            - name: KEYCLOAK_FRONTEND_URL
              value: "https://auth.suncoast.systems"
            - name: KEYCLOAK_REDIRECT_HOSTNAME
              value: "workbench-drools.teleport.app.suncoast.systems"
            - name: KEYCLOAK_REDIRECT_PORT
              value: "443"
            - name: KEYCLOAK_REDIRECT_PATH
              value: "/business-central"
            - name: KEYCLOAK_REDIRECT_PATH_KIE_SERVER
              value: "/business-central/rest/controller/server/kie-server"
            - name: JAEGER_DISABLED
              value: "true"
          volumeMounts:
            - { name: workbench-config,  mountPath: /opt/jboss/wildfly/standalone/configuration }
            - { name: welcome-content,   mountPath: /opt/jboss/wildfly/welcome-content }
            - { name: vault-secrets,     mountPath: /vault-secrets }
            - { name: wildfly-modules,   mountPath: /opt/jboss/wildfly/modules }
            - { name: workbench-extra-libs, mountPath: /workbench-extra-libs }
            - { name: workbench-niogit,  mountPath: /opt/jboss/.niogit }
            - { name: workbench-m2,      mountPath: /opt/jboss/.m2 }
          startupProbe:
            httpGet:
              path: /business-central/
              port: 8080
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 80
          readinessProbe:
            httpGet:
              path: /business-central/
              port: 8080
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 4
          livenessProbe:
            httpGet:
              path: /business-central/
              port: 8080
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 6

---
apiVersion: v1
kind: Service
metadata:
  name: kie-workbench
  namespace: drools
  annotations:
    teleport.dev/name: "drools-workbench"
    teleport.dev/protocol: "http"
    teleport.dev/public-addr: "workbench-drools.teleport.app.suncoast.systems"
    teleport.dev/description: "KIE Workbench - Business rules authoring and management interface"
    teleport.dev/port: "8080"
  labels:
    app.kubernetes.io/name: kie-workbench
    app.kubernetes.io/component: authoring
    teleport.dev/app: "drools-workbench"
    teleport.dev/enroll: "true"
spec:
  selector:
    app: kie-workbench
  ports:
    - { name: http, port: 8080, targetPort: 8080, protocol: TCP }
    - { name: git,  port: 9418, targetPort: 9418, protocol: TCP }
  type: ClusterIP

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: drools-maven-repos-reader
  namespace: drools
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: drools-maven-repos-reader-workbench
  namespace: drools
subjects:
  - kind: ServiceAccount
    name: drools-workbench
    namespace: drools
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: drools-maven-repos-reader

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: drools-maven-repos-reader-kie-server
  namespace: drools
subjects:
  - kind: ServiceAccount
    name: drools-kie-server
    namespace: drools
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: drools-maven-repos-reader
