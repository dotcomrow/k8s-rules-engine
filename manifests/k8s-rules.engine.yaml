              VAULT_TOKEN=$(vault write -field=token auth/kubernetes/login \
                role=drools \
                jwt=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token))
              export VAULT_TOKEN

              ID_JSON="$(vault kv get -format=json secret/keycloak-client-id-kogito-console 2>/dev/null || true)"
              SECRET_JSON="$(vault kv get -format=json secret/keycloak-client-secret-kogito-console 2>/dev/null || true)"
              CLIENT_ID="$(printf '%s' "$ID_JSON" | jq -r '.data.data.value // .data.data.id // empty')"
              CLIENT_SECRET="$(printf '%s' "$SECRET_JSON" | jq -r '.data.data.value // .data.data.secret // empty')"
              if [ -z "${CLIENT_ID:-}" ] || [ -z "${CLIENT_SECRET:-}" ]; then
                echo "❌ Missing kogito console client id/secret in Vault"
                exit 1
              fi
              {
                echo "export KOGITO_CONSOLES_KEYCLOAK_CONFIG_CLIENT_ID=\"$CLIENT_ID\""
                echo "export KOGITO_CONSOLES_KEYCLOAK_CLIENT_ID=\"$CLIENT_ID\""
                echo "export KOGITO_CONSOLES_KEYCLOAK_CLIENT_SECRET=\"$CLIENT_SECRET\""
              } > /shared/kogito-console-env.sh
          volumeMounts:
            - { name: vault-secrets, mountPath: /shared }
      containers:
        - name: kogito-task-console
          image: quay.io/kiegroup/kogito-task-console:1.40
          command: ["/bin/sh", "-c"]
          args: ["/entrypoint/run-console.sh"]
          ports: [{ containerPort: 8080 }]
          env:
            - { name: KOGITO_DATAINDEX_HTTP_URL, value: "https://kogito-task-console-drools.teleport.app.suncoast.systems/graphql" }
            - { name: KOGITO_DATAINDEX_WS_URL, value: "wss://kogito-task-console-drools.teleport.app.suncoast.systems/graphql" }
            - { name: KOGITO_JOBS_SERVICE_URL, value: "https://kogito-task-console-drools.teleport.app.suncoast.systems/jobs" }
            - { name: QUARKUS_HTTP_CORS, value: "true" }
            - { name: QUARKUS_HTTP_CORS_ORIGINS, value: "https://kogito-task-console-drools.teleport.app.suncoast.systems,https://kogito-console-drools.teleport.app.suncoast.systems,https://teleport.app.suncoast.systems" }
            - { name: QUARKUS_HTTP_CORS_HEADERS, value: "authorization,content-type,accept,origin,referer,cache-control,pragma" }
            - { name: QUARKUS_HTTP_CORS_METHODS, value: "GET,POST,PUT,DELETE,OPTIONS,PATCH" }
            - { name: QUARKUS_HTTP_CORS_ACCESS_CONTROL_ALLOW_CREDENTIALS, value: "true" }
          envFrom:
            - configMapRef:
                name: kogito-console-config
          readinessProbe:
            httpGet: { path: /, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 5
          livenessProbe:
            httpGet: { path: /, port: 8080 }
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - { name: vault-secrets, mountPath: /vault-secrets }
            - { name: console-entrypoint, mountPath: /entrypoint }

---
apiVersion: v1
kind: Service
metadata:
  name: kogito-task-console
  namespace: drools
  labels:
    app: kogito-task-console
spec:
  selector:
    app: kogito-task-console
  ports:
    - { name: http, port: 8080, targetPort: 8080, protocol: TCP }
  type: ClusterIP

# =========================
# Kogito Task Console Proxy (UI + APIs)
# =========================
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kogito-task-console-proxy
  namespace: drools
  labels: { app: kogito-task-console-proxy }
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels: { app: kogito-task-console-proxy }
  template:
    metadata:
      labels: { app: kogito-task-console-proxy }
    spec:
      containers:
        - name: nginx
          image: nginx:1.25-alpine
          ports: [{ containerPort: 8080 }]
          volumeMounts:
            - { name: nginx-config, mountPath: /etc/nginx/nginx.conf, subPath: nginx.conf }
          readinessProbe:
            httpGet: { path: /ready, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: nginx-config
          configMap: { name: kogito-task-console-proxy-config }

---
apiVersion: v1
kind: Service
metadata:
  name: kogito-task-console-proxy
  namespace: drools
  annotations:
    teleport.dev/name: "kogito-task-console"
    teleport.dev/protocol: "http"
    teleport.dev/public-addr: "kogito-task-console-drools.teleport.app.suncoast.systems"
    teleport.dev/description: "Kogito Task Console - human task UI"
    teleport.dev/port: "8080"
  labels:
    teleport.dev/app: "kogito-task-console"
    teleport.dev/enroll: "true"
spec:
  selector:
    app: kogito-task-console-proxy
  ports:
    - { name: http, port: 8080, targetPort: 8080, protocol: TCP }
  type: ClusterIP

