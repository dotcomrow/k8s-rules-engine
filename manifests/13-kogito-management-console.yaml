          proxy_hide_header Content-Type;
          add_header Content-Type font/ttf always;
          proxy_read_timeout 300s;
        }

        location ~* \\.otf$ {
          proxy_pass http://console_ui;
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header X-Forwarded-Host $host;
          proxy_set_header Authorization "";
          proxy_hide_header Content-Type;
          add_header Content-Type font/otf always;
          proxy_read_timeout 300s;
        }

        location ~* \\.eot$ {
          proxy_pass http://console_ui;
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header X-Forwarded-Host $host;
          proxy_set_header Authorization "";
          proxy_hide_header Content-Type;
          add_header Content-Type application/vnd.ms-fontobject always;
          proxy_read_timeout 300s;
        }

        location ~* \\.svg$ {
          proxy_pass http://console_ui;
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header X-Forwarded-Host $host;
          proxy_set_header Authorization "";
          proxy_hide_header Content-Type;
          add_header Content-Type image/svg+xml always;
          proxy_read_timeout 300s;
        }

        location = /app.bundle.js {
          proxy_pass http://console_ui;
          proxy_http_version 1.1;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection $connection_upgrade;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header X-Forwarded-Host $host;
          proxy_set_header Authorization "";
          proxy_hide_header Content-Type;
          add_header Content-Type application/javascript always;
          proxy_read_timeout 300s;
        }

        location = /app.bundle.js.map {
          proxy_pass http://console_ui;
          proxy_http_version 1.1;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection $connection_upgrade;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header X-Forwarded-Host $host;
          proxy_set_header Authorization "";
          proxy_hide_header Content-Type;
          add_header Content-Type application/json always;
          proxy_read_timeout 300s;
        }

        location / {
          proxy_pass http://console_ui;
          proxy_http_version 1.1;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection $connection_upgrade;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header X-Forwarded-Host $host;
          proxy_set_header Authorization "";
          proxy_set_header Accept-Encoding "";
          sub_filter_types text/html;
          sub_filter_once on;
          sub_filter '</head>' '<script>window.KOGITO_CONSOLES_KEYCLOAK_CONFIG_CHECK_LOGIN_IFRAME=false;window.KOGITO_CONSOLES_KEYCLOAK_CHECK_LOGIN_IFRAME=false;</script></head>';
          proxy_read_timeout 300s;
        }

        location = /health { access_log off; return 200 'healthy'; }
        location = /ready  { access_log off; return 200 'ready'; }
      }
    }

