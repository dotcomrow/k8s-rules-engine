# =========================
# KIE Workbench - Web Authoring and Deployment GUI
# Full-featured business rules authoring environment with Vault integration
# =========================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kie-workbench
  namespace: drools
  labels:
    app: kie-workbench
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kie-workbench
  template:
    metadata:
      labels:
        app: kie-workbench
      annotations:
        # Vault agent for secret files
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "drools"
        vault.hashicorp.com/agent-init-first: "true"
        vault.hashicorp.com/agent-pre-populate: "true"

        # DB creds (static role)
        vault.hashicorp.com/agent-inject-secret-db-username: "yugabyte-db/static-creds/drools-app"
        vault.hashicorp.com/agent-inject-template-db-username: |
          {{- with secret "yugabyte-db/static-creds/drools-app" -}}{{ .Data.username }}{{- end -}}
        vault.hashicorp.com/agent-inject-secret-db-password: "yugabyte-db/static-creds/drools-app"
        vault.hashicorp.com/agent-inject-template-db-password: |
          {{- with secret "yugabyte-db/static-creds/drools-app" -}}{{ .Data.password }}{{- end -}}

        # Admin creds
        vault.hashicorp.com/agent-inject-secret-drools-admin: "secret/data/drools/admin"
        vault.hashicorp.com/agent-inject-template-drools-admin: |
          {{- with secret "secret/data/drools/admin" -}}
          ADMIN_USER={{ .Data.data.username }}
          ADMIN_PASS={{ .Data.data.password }}
          {{- end -}}

        # KIE Server user creds
        vault.hashicorp.com/agent-inject-secret-kie-user: "secret/data/drools/kie-user"
        vault.hashicorp.com/agent-inject-template-kie-user: |
          {{- with secret "secret/data/drools/kie-user" -}}
          KIE_SERVER_USER={{ .Data.data.username }}
          KIE_SERVER_PASSWORD={{ .Data.data.password }}
          {{- end -}}

        # Linkerd: allow direct Postgres/Vault egress from this pod
        config.linkerd.io/skip-outbound-ports: "8200,5433"

        # Teleport service annotation
        teleport.dev/name: "drools-workbench"
    spec:
      serviceAccountName: drools-workbench
      initContainers:
        - name: wait-for-config-job
          image: alpine/k8s:1.31.4
          command: ["/bin/sh","-lc"]
          args:
            - |
              echo "Waiting for Job vault/drools-yugabyte-config to complete (will retry until ready)..."
              while true; do
                if ! kubectl -n vault get job drools-yugabyte-config >/dev/null 2>&1; then
                  echo "  └─ job not found yet..."
                  sleep 5
                  continue
                fi
                SUCC="$(kubectl -n vault get job drools-yugabyte-config -o jsonpath='{.status.succeeded}' 2>/dev/null || true)"; SUCC="${SUCC:-0}"
                if [ "$SUCC" -ge 1 ] 2>/dev/null; then
                  echo "✅ DB bootstrap job is complete."
                  break
                fi
                if kubectl -n vault wait --for=condition=complete job/drools-yugabyte-config --timeout=10s >/dev/null 2>&1; then
                  echo "✅ DB bootstrap job is complete."
                  break
                fi
                FAIL="$(kubectl -n vault get job drools-yugabyte-config -o jsonpath='{.status.failed}' 2>/dev/null || true)";  FAIL="${FAIL:-0}"
                ACTV="$(kubectl -n vault get job drools-yugabyte-config -o jsonpath='{.status.active}' 2>/dev/null || true)";  ACTV="${ACTV:-0}"
                echo "  └─ still waiting... succeeded=${SUCC} failed=${FAIL} active=${ACTV}"
                sleep 5
              done
      containers:
      - name: kie-workbench
        image: jboss/drools-workbench:latest
        ports:
        - containerPort: 8080
          name: http
        - containerPort: 8001
          name: debug
        - containerPort: 9418
          name: git
        command: ["/bin/bash", "-c"]
        args:
          - |
            set -euo pipefail
            
            # Source admin and kie-user credentials from Vault
            source /vault/secrets/drools-admin
            source /vault/secrets/kie-user
            
            # Set database credentials from Vault
            export KIE_CONNECTION_USER="$(cat /vault/secrets/db-username)"
            export KIE_CONNECTION_PASSWORD="$(cat /vault/secrets/db-password)"
            
            # Override welcome content with redirect
            echo "🔧 Replacing Wildfly welcome content with Business Central redirect..."
            
            # Replace the entire welcome-content directory with our redirect
            rm -rf /opt/jboss/wildfly/welcome-content/*
            cat > /opt/jboss/wildfly/welcome-content/index.html << 'EOF'
            <!DOCTYPE html>
            <html>
            <head>
                <meta http-equiv="refresh" content="0; url=/business-central/">
                <title>Redirecting to Business Central...</title>
            </head>
            <body>
                <p>Redirecting to <a href="/business-central/">Business Central</a>...</p>
                <script>window.location.href='/business-central/';</script>
            </body>
            </html>
            EOF
            
            echo "🚀 Starting KIE Workbench with Vault credentials..."
            exec /opt/jboss/wildfly/bin/standalone.sh -b 0.0.0.0 -bmanagement 0.0.0.0
        env:
        - name: JAVA_OPTS
          value: "-Xms512m -Xmx2048m -XX:MetaspaceSize=96M -XX:MaxMetaspaceSize=512m -Djava.net.preferIPv4Stack=true -Dfile.encoding=UTF-8 -Dorg.kie.server.bypass.auth.user=false -Dorg.kie.workbench.profile=FULL -Dorg.uberfire.nio.git.daemon.host=0.0.0.0 -Djboss.bind.address=0.0.0.0 -Djboss.bind.address.management=0.0.0.0"
        - name: KIE_WORKBENCH_INDEX_REDIRECT
          value: "true"
        - name: KIE_CONNECTION_URL
          value: "jdbc:postgresql://yb-tserver-service.yugabyte.svc.cluster.local:5433/drools?currentSchema=drools"
        - name: KIE_CONNECTION_DRIVER_CLASS
          value: "org.postgresql.Driver"
        - name: KIE_SERVER_LOCATION
          value: "https://kie-server-drools.app.suncoast.systems/services/rest/server"
        - name: DROOLS_WB_HOST
          value: "workbench-drools.app.suncoast.systems"
        - name: DROOLS_WB_PROTOCOL
          value: "https"
        - name: DROOLS_WB_PORT
          value: "443"
        volumeMounts:
        - name: git-storage
          mountPath: /opt/jboss/.niogit
        readinessProbe:
          httpGet:
            path: /business-central
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 15
          timeoutSeconds: 10
          failureThreshold: 5
        livenessProbe:
          httpGet:
            path: /business-central
            port: 8080
          initialDelaySeconds: 120
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "3Gi"
            cpu: "2000m"
      volumes:
      - name: git-storage
        emptyDir: {}

---
# =========================
# Teleport Service - KIE Workbench (Business Rules Authoring)
# =========================
apiVersion: v1
kind: Service
metadata:
  name: kie-workbench
  namespace: drools
  annotations:
    teleport.dev/name: "drools-workbench"
    teleport.dev/protocol: "http"
    teleport.dev/public-addr: "workbench-drools.app.suncoast.systems"
    teleport.dev/description: "KIE Workbench - Business rules authoring and management interface"
    teleport.dev/port: "8080"
    teleport.dev/uri: "/business-central/"
    app.kubernetes.io/name: kie-workbench
    app.kubernetes.io/component: authoring
    teleport.dev/app: "drools-workbench"
  labels:
    teleport.dev/enroll: "true"
spec:
  selector:
    app: kie-workbench
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    protocol: TCP
  - name: git
    port: 9418
    targetPort: 9418
    protocol: TCP
  type: ClusterIP

---
# =========================
# KIE Server - Embeddable Rules Runtime
# Execution server for business rules and decisions
# =========================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kie-server
  namespace: drools
  labels:
    app: kie-server
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kie-server
  template:
    metadata:
      labels:
        app: kie-server
      annotations:
        # Vault agent for secret files
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "drools"
        vault.hashicorp.com/agent-init-first: "true"
        vault.hashicorp.com/agent-pre-populate: "true"

        # Admin creds
        vault.hashicorp.com/agent-inject-secret-drools-admin: "secret/data/drools/admin"
        vault.hashicorp.com/agent-inject-template-drools-admin: |
          {{- with secret "secret/data/drools/admin" -}}
          ADMIN_USER={{ .Data.data.username }}
          ADMIN_PASS={{ .Data.data.password }}
          {{- end -}}

        # KIE Server user creds
        vault.hashicorp.com/agent-inject-secret-kie-user: "secret/data/drools/kie-user"
        vault.hashicorp.com/agent-inject-template-kie-user: |
          {{- with secret "secret/data/drools/kie-user" -}}
          KIE_SERVER_USER={{ .Data.data.username }}
          KIE_SERVER_PASSWORD={{ .Data.data.password }}
          {{- end -}}

        # Linkerd: allow direct Vault egress
        config.linkerd.io/skip-outbound-ports: "8200"

        # Teleport service annotation
        teleport.dev/name: "drools-kie-server"
    spec:
      serviceAccountName: drools-kie-server
      initContainers:
        - name: wait-for-config-job
          image: alpine/k8s:1.31.4
          command: ["/bin/sh","-lc"]
          args:
            - |
              echo "Waiting for Job vault/drools-yugabyte-config to complete..."
              while true; do
                if ! kubectl -n vault get job drools-yugabyte-config >/dev/null 2>&1; then
                  echo "  └─ job not found yet..."
                  sleep 5
                  continue
                fi
                SUCC="$(kubectl -n vault get job drools-yugabyte-config -o jsonpath='{.status.succeeded}' 2>/dev/null || true)"; SUCC="${SUCC:-0}"
                if [ "$SUCC" -ge 1 ] 2>/dev/null; then
                  echo "✅ DB bootstrap job is complete."
                  break
                fi
                sleep 5
              done
      containers:
      - name: kie-server
        image: jboss/kie-server:latest
        ports:
        - containerPort: 8080
        command: ["/bin/bash", "-c"]
        args:
          - |
            set -euo pipefail
            
            # Source credentials from Vault
            source /vault/secrets/drools-admin
            source /vault/secrets/kie-user
            
            # Export credentials for KIE Server
            export KIE_SERVER_CONTROLLER_USER="$ADMIN_USER"
            export KIE_SERVER_CONTROLLER_PWD="$ADMIN_PASS"
            export KIE_SERVER_USER="$KIE_SERVER_USER"
            export KIE_SERVER_PWD="$KIE_SERVER_PASSWORD"
            export KIE_MAVEN_REPO_USER="$ADMIN_USER"
            export KIE_MAVEN_REPO_PWD="$ADMIN_PASS"
            
            # Override welcome content with redirect
            echo "🔧 Replacing Wildfly welcome content with KIE Server redirect..."
            
            # Replace the entire welcome-content directory with our redirect
            rm -rf /opt/jboss/wildfly/welcome-content/*
            cat > /opt/jboss/wildfly/welcome-content/index.html << 'EOF'
            <!DOCTYPE html>
            <html>
            <head>
                <meta http-equiv="refresh" content="0; url=/kie-server/services/rest/server">
