apiVersion: batch/v1
kind: Job
metadata:
  name: workbench-dashbuilder-datasets-seed
  namespace: drools
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 1
  template:
    metadata:
      labels: { app: workbench-dashbuilder-datasets-seed }
      annotations:
        linkerd.io/inject: disabled
    spec:
      restartPolicy: Never
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: kie-workbench
              topologyKey: kubernetes.io/hostname
      containers:
        - name: seed-datasets
          image: alpine/git:2.47.2
          command: ["/bin/sh","-c"]
          args:
            - |
              set -euo pipefail
              REPO_DIR="/niogit/.niogit/dashbuilder/datasets.git"
              DEFAULT_BRANCH="master"
              if [ ! -d "$REPO_DIR" ]; then
                echo "Creating datasets repo at $REPO_DIR"
                mkdir -p "$REPO_DIR"
                git -c init.defaultBranch="$DEFAULT_BRANCH" init --bare "$REPO_DIR"
              fi

              tmp="$(mktemp -d)"
              trap 'rm -rf "$tmp"' EXIT
              WORKDIR="$tmp/repo"

              if git --git-dir="$REPO_DIR" show-ref --quiet refs/heads/main; then
                DEFAULT_BRANCH="main"
              elif git --git-dir="$REPO_DIR" show-ref --quiet refs/heads/master; then
                DEFAULT_BRANCH="master"
              fi

              if git --git-dir="$REPO_DIR" show-ref --quiet; then
                git clone "$REPO_DIR" "$WORKDIR"
              else
                git -c init.defaultBranch="$DEFAULT_BRANCH" init "$WORKDIR"
                git -C "$WORKDIR" remote add origin "$REPO_DIR"
              fi

              cd "$WORKDIR"
              git config user.email "dashbuilder@local"
              git config user.name "dashbuilder"
              if git show-ref --quiet "refs/heads/$DEFAULT_BRANCH"; then
                git checkout "$DEFAULT_BRANCH"
              else
                git checkout -b "$DEFAULT_BRANCH"
              fi
              git pull --rebase origin "$DEFAULT_BRANCH" >/dev/null 2>&1 || true
              mkdir -p definitions
              cat > definitions/gitContributors.dset <<'EOF'
              {
                "uuid": "gitContributors",
                "name": "Git Contributors",
                "provider": "STATIC",
                "isPublic": true,
                "cacheEnabled": false,
                "cacheMaxRows": 1000,
                "pushEnabled": false,
                "pushMaxSize": 1024,
                "refreshAlways": false
              }
              EOF
              git add definitions/gitContributors.dset
              if git diff --cached --quiet; then
                echo "dashbuilder datasets already up to date"
                exit 0
              fi
              git commit -m "Seed dashbuilder datasets"
              git push origin "HEAD:$DEFAULT_BRANCH"
              echo "dashbuilder datasets repo seeded"
          volumeMounts:
            - { name: workbench-niogit, mountPath: /niogit }
      volumes:
        - name: workbench-niogit
          persistentVolumeClaim:
            claimName: kie-workbench-niogit
