        - name: KIE_SERVER_JMS_QUEUE_RESPONSE
          value: "queue/KIE.SERVER.RESPONSE"
        - name: KIE_SERVER_EXECUTOR_JMS_QUEUE
          value: "queue/KIE.SERVER.EXECUTOR"
        - name: MESSAGING_SERIALIZERS
          value: "org.apache.activemq.artemis.jms.client.ActiveMQObjectMessage,org.apache.activemq.artemis.jms.client.ActiveMQMessage,org.apache.activemq.artemis.jms.client.ActiveMQTextMessage"
        readinessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 120
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          tcpSocket:
            port: 8080
