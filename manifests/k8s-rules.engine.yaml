---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kogito-decision-service
  namespace: drools
  labels:
    app: kogito-decision-service
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kogito-decision-service
  template:
    metadata:
      labels:
        app: kogito-decision-service
    spec:
      initContainers:
        - name: setup-redirect
          image: quay.io/kiegroup/kie-server-showcase:latest
          command: ["/bin/bash", "-c"]
          args:
            - |
              echo "🔧 Setting up Decision Service redirect..."
              mkdir -p /shared/welcome-content
              cat > /shared/welcome-content/index.html << 'EOF'
              <!DOCTYPE html><meta http-equiv="refresh" content="0; url=/kie-server/services/rest/server">
              <title>Redirecting…</title><a href="/kie-server/services/rest/server">Continue</a>
              EOF
              echo "✅ Redirect setup complete"
          volumeMounts:
            - name: welcome-content
              mountPath: /shared
      containers:
        - name: kogito-decision-service
          image: quay.io/kiegroup/kie-server-showcase:latest
          command: ["/bin/bash", "-c"]
          args:
            - exec /opt/jboss/wildfly/bin/standalone.sh -b 0.0.0.0 -bmanagement 0.0.0.0 -c standalone-full.xml
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: welcome-content
              mountPath: /opt/jboss/wildfly/welcome-content
              subPath: welcome-content
          env:
            - { name: JAVA_OPTS, value: "-Xms512m -Xmx2048m -Djava.net.preferIPv4Stack=true -Dfile.encoding=UTF-8" }
            - { name: KIE_SERVER_LOCATION, value: "http://kogito-decision-service.drools.svc.cluster.local:8080/kie-server/services/rest/server" }
            - { name: KIE_SERVER_USER, value: "kieserver" }
            - { name: KIE_SERVER_PWD,  value: "kieserver1!" }
            - { name: KIE_SERVER_CONTROLLER_USER, value: "admin" }
            - { name: KIE_SERVER_CONTROLLER_PWD,  value: "admin" }
            - { name: KIE_SERVER_HOST, value: "0.0.0.0" }
            - { name: KIE_SERVER_PORT, value: "8080" }
          readinessProbe:
            tcpSocket: { port: 8080 }
            initialDelaySeconds: 120
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket: { port: 8080 }
            initialDelaySeconds: 180
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
      volumes:
        - name: welcome-content
          emptyDir: {}

