h() > 0}","configuration":{"addHeaders":[{"name":"X-Exchanged-Token-Present","value":"true"}]}},{"name":"apply-exchanged-token","policy":"transform-headers","enabled":true,"messageCondition":"{#context.attributes[\"exchanged_token\"] != null && #context.attributes[\"exchanged_token\"].length() > 0}","configuration":{"addHeaders":[{"name":"Authorization","value":"Bearer {#context.attributes[\"exchanged_token\"]}"}]}},{"name":"validate-jwt","policy":"jwt","enabled":true,"messageCondition":"{#request.headers[\"authorization\"] != null && #request.headers[\"authorization\"].size() > 0 && #request.headers[\"authorization\"][0].startsWith(\"Bearer \")}","configuration":{"signature":"RSA_RS256","publicKeyResolver":"JWKS_URL","resolverParameter":"https://auth.suncoast.systems/realms/internal/protocol/openid-connect/certs","extractClaims":true,"userClaim":"preferred_username","propagateAuthHeader":true}}],"response":[{"name":"debug-token-exchange-callout","policy":"transform-headers","enabled":true,"messageCondition":"{#context.attributes[\"exchange_callout_status\"] != null}","configuration":{"addHeaders":[{"name":"X-Keycloak-Exchange-Callout-Status","value":"{#context.attributes[\"exchange_callout_status\"]}"}]}}]}]'
