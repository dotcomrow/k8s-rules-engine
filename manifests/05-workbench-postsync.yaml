# =========================
# Workbench PostSync import (optional)
# =========================
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: workbench-rules-import
  namespace: drools
data:
  projects.json: |
    []
  README.txt: |
    Provide a JSON array of projects to import after ArgoCD sync.
    Fields: space, name, gitUrl, branch (optional), username (optional), password (optional).
    Example:
    [
      {"space":"rules","name":"example-rules","gitUrl":"https://github.com/your-org/example-rules.git","branch":"prod"}
    ]
---
apiVersion: batch/v1
kind: Job
metadata:
  name: workbench-postsync
  namespace: drools
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 1
  template:
    metadata:
      labels: { app: workbench-postsync }
      annotations:
        linkerd.io/inject: disabled
    spec:
      serviceAccountName: drools-workbench
      restartPolicy: Never
      containers:
        - name: rollout-and-import
          image: alpine/k8s:1.31.4
          command: ["/bin/sh","-c"]
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: WORKBENCH_URL
              value: "http://kie-workbench.drools.svc.cluster.local:8080/business-central"
            - name: PROJECTS_JSON
              value: "/config/projects.json"
            - name: VAULT_ADDR
              value: "http://vault.vault.svc.cluster.local:8200"
            - name: OIDC_AUTH_URL
              value: "https://auth.suncoast.systems"
            - name: OIDC_REALM
              value: "internal"
            - name: POSTSYNC_ENABLED
              value: "false"
          args:
            - |
              set -euo pipefail
              apk add --no-cache curl jq ca-certificates
              if [ "${POSTSYNC_ENABLED:-false}" != "true" ]; then
                echo "PostSync disabled; skipping restarts/imports."
                exit 0
              fi

              restart_deploy() {
                name="$1"
                timeout="${2:-10m}"
                if kubectl -n "$NAMESPACE" get deployment "$name" >/dev/null 2>&1; then
                  echo "Restarting deployment/$name..."
                  kubectl -n "$NAMESPACE" rollout restart "deployment/$name"
                  case "$timeout" in
                    *h) timeout_seconds=$(( ${timeout%h} * 3600 )) ;;
                    *m) timeout_seconds=$(( ${timeout%m} * 60 )) ;;
                    *s) timeout_seconds=${timeout%s} ;;
                    *)  timeout_seconds=$timeout ;;
                  esac
                  start_ts="$(date +%s)"
                  while true; do
                    desired="$(kubectl -n "$NAMESPACE" get deployment "$name" -o jsonpath='{.spec.replicas}')"
                    available="$(kubectl -n "$NAMESPACE" get deployment "$name" -o jsonpath='{.status.availableReplicas}')"
                    desired="${desired:-0}"
                    available="${available:-0}"
                    if [ "$available" -ge "$desired" ]; then
                      echo "deployment/$name ready ($available/$desired)"
                      break
                    fi
                    now_ts="$(date +%s)"
                    if [ $((now_ts - start_ts)) -ge "$timeout_seconds" ]; then
                      echo "Timed out waiting for deployment/$name ($available/$desired)"
                      exit 1
                    fi
                    sleep 5
                  done
                else
                  echo "deployment/$name not found; skipping."
                fi
              }

              restart_deploy "kie-server" "10m"
              restart_deploy "kogito-decision-service" "10m"
              restart_deploy "kie-workbench" "15m"

              if [ ! -s "$PROJECTS_JSON" ]; then
                echo "No rules project imports configured; skipping."
                exit 0
              fi

              if ! jq -e 'type == "array"' "$PROJECTS_JSON" >/dev/null 2>&1; then
                echo "projects.json must be a JSON array"
                exit 1
              fi

              if [ "$(jq 'length' "$PROJECTS_JSON")" -eq 0 ]; then
                echo "projects.json is empty; skipping import."
                exit 0
              fi

              SA_JWT="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
              LOGIN_PAYLOAD="$(printf '{"role":"drools","jwt":"%s"}' "$SA_JWT")"
              VAULT_TOKEN="$(curl -fsSL -H 'Content-Type: application/json' --data "$LOGIN_PAYLOAD" "$VAULT_ADDR/v1/auth/kubernetes/login" | jq -r '.auth.client_token')"
              if [ -z "${VAULT_TOKEN:-}" ] || [ "$VAULT_TOKEN" = "null" ]; then
                echo "Vault login failed"
                exit 1
              fi

              ADMIN_JSON="$(curl -fsSL -H "X-Vault-Token: $VAULT_TOKEN" "$VAULT_ADDR/v1/secret/data/drools/admin")"
              ADMIN_USER="$(printf '%s' "$ADMIN_JSON" | jq -r '.data.data.username // empty')"
              ADMIN_PASS="$(printf '%s' "$ADMIN_JSON" | jq -r '.data.data.password // empty')"
              if [ -z "${ADMIN_USER:-}" ] || [ -z "${ADMIN_PASS:-}" ]; then
                echo "Missing admin credentials in Vault"
                exit 1
              fi

              OIDC_ID_JSON="$(curl -fsSL -H "X-Vault-Token: $VAULT_TOKEN" "$VAULT_ADDR/v1/secret/data/keycloak-client-id-drools-workbench")"
              OIDC_CLIENT_ID="$(printf '%s' "$OIDC_ID_JSON" | jq -r '.data.data.value // .data.data.id // empty')"
              OIDC_SECRET_JSON="$(curl -fsSL -H "X-Vault-Token: $VAULT_TOKEN" "$VAULT_ADDR/v1/secret/data/keycloak-client-secret-drools-workbench")"
              OIDC_CLIENT_SECRET="$(printf '%s' "$OIDC_SECRET_JSON" | jq -r '.data.data.value // .data.data.secret // empty')"
              if [ -z "${OIDC_CLIENT_ID:-}" ] || [ -z "${OIDC_CLIENT_SECRET:-}" ]; then
                echo "Missing OIDC client credentials in Vault"
                exit 1
              fi

              TOKEN_URL="${OIDC_AUTH_URL}/realms/${OIDC_REALM}/protocol/openid-connect/token"
              TOKEN_RESPONSE="$(curl -fsSL -H 'Content-Type: application/x-www-form-urlencoded' \
                -d "grant_type=password" \
                -d "client_id=${OIDC_CLIENT_ID}" \
                -d "client_secret=${OIDC_CLIENT_SECRET}" \
                -d "username=${ADMIN_USER}" \
                -d "password=${ADMIN_PASS}" \
                "$TOKEN_URL")"
              ACCESS_TOKEN="$(printf '%s' "$TOKEN_RESPONSE" | jq -r '.access_token // empty')"
              if [ -z "${ACCESS_TOKEN:-}" ]; then
                echo "Failed to obtain OIDC access token"
                exit 1
              fi
              AUTH_HEADER="Authorization: Bearer ${ACCESS_TOKEN}"

              ready=""
              for i in $(seq 1 60); do
                code="$(curl -s -o /dev/null -w '%{http_code}' -H "$AUTH_HEADER" "$WORKBENCH_URL/rest/spaces")"
                if [ "$code" = "200" ]; then
                  ready="yes"
                  break
                fi
                echo "Waiting for Workbench API (status $code)..."
                sleep 10
              done
              if [ -z "$ready" ]; then
                echo "Workbench API not ready after waiting"
                exit 1
              fi

              jq -c '.[]' "$PROJECTS_JSON" > /tmp/projects.jsonl
              while read -r item; do
                space="$(printf '%s' "$item" | jq -r '.space // empty')"
                name="$(printf '%s' "$item" | jq -r '.name // empty')"
                git_url="$(printf '%s' "$item" | jq -r '.gitUrl // empty')"
                branch="$(printf '%s' "$item" | jq -r '.branch // empty')"
                username="$(printf '%s' "$item" | jq -r '.username // empty')"
                password="$(printf '%s' "$item" | jq -r '.password // empty')"

                if [ -z "$space" ] || [ -z "$name" ] || [ -z "$git_url" ]; then
                  echo "Skipping entry with missing space/name/gitUrl: $item"
                  continue
                fi

                space_payload="$(jq -n --arg name "$space" --arg description "$space" '{name:$name, description:$description}')"
                space_code="$(curl -s -o /dev/null -w '%{http_code}' -H "$AUTH_HEADER" -H 'Content-Type: application/json' -X POST "$WORKBENCH_URL/rest/spaces" -d "$space_payload")"
                if [ "$space_code" != "201" ] && [ "$space_code" != "409" ]; then
                  echo "Failed to ensure space $space (status $space_code)"
                  exit 1
                fi

                project_payload="$(jq -n \
                  --arg name "$name" \
                  --arg description "$name" \
                  --arg gitUrl "$git_url" \
                  --arg branch "$branch" \
                  --arg username "$username" \
                  --arg password "$password" \
                  '
                  {name:$name, description:$description, gitURL:$gitUrl}
                  + ( ($branch|length) > 0 ? {branch:$branch} : {} )
                  + ( ($username|length) > 0 and ($password|length) > 0 ? {credentials:{username:$username,password:$password}} : {} )
                  '
                )"
                project_code="$(curl -s -o /dev/null -w '%{http_code}' -H "$AUTH_HEADER" -H 'Content-Type: application/json' -X POST "$WORKBENCH_URL/rest/spaces/$space/projects" -d "$project_payload")"
                if [ "$project_code" != "201" ] && [ "$project_code" != "200" ] && [ "$project_code" != "409" ]; then
                  echo "Failed to import project $space/$name (status $project_code)"
                  exit 1
                fi
                echo "Imported or verified project $space/$name"
              done < /tmp/projects.jsonl
          volumeMounts:
            - { name: workbench-rules-import, mountPath: /config }
      volumes:
        - name: workbench-rules-import
          configMap:
            name: workbench-rules-import
            items:
              - { key: projects.json, path: projects.json, mode: 0444 }

