apiVersion: v1
kind: ConfigMap
metadata:
  name: kogito-task-console-proxy-config
  namespace: drools
data:
  nginx.conf: |
    worker_processes  auto;
    events { worker_connections 1024; use epoll; multi_accept on; }
    http {
      include /etc/nginx/mime.types;
      default_type application/octet-stream;

      log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'rt=$request_time uct="$upstream_connect_time" '
                      'uht="$upstream_header_time" urt="$upstream_response_time"';
      access_log /var/log/nginx/access.log main;
      error_log  /var/log/nginx/error.log warn;

      sendfile on; tcp_nopush on; tcp_nodelay on; keepalive_timeout 65;
      client_max_body_size 50m; client_body_timeout 60s; client_header_timeout 60s;

      map $http_upgrade $connection_upgrade { default upgrade; '' close; }

      upstream console_ui { server kogito-task-console.drools.svc.cluster.local:8080; keepalive 16; }
      upstream data_index { server kogito-data-index.drools.svc.cluster.local:8080; keepalive 16; }
      upstream jobs_service { server kogito-jobs-service.drools.svc.cluster.local:8080; keepalive 16; }

      server {
        listen 8080; server_name localhost;

        location ^~ /assets/images/ {
          rewrite ^/assets/images/(.*)$ /images/$1 last;
        }

        location ^~ /assets/fonts/ {
          rewrite ^/assets/fonts/(.*)$ /fonts/$1 last;
        }

        location ^~ /assets/pficon/ {
          rewrite ^/assets/pficon/(.*)$ /fonts/$1 last;
