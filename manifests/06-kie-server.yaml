spec:
  selector:
    app: kie-server
  ports:
    - { name: http, port: 8080, targetPort: 8080, protocol: TCP }
  type: ClusterIP

---
apiVersion: gravitee.io/v1alpha1
kind: Application
metadata:
  name: rules-engine-internal
  namespace: drools
spec:
  contextRef:
    kind: ManagementContext
    name: gravitee-default
    namespace: k8s-api-gateway
  name: rules-engine-internal
  description: "Rules engine internal access"
  settings:
    app:
      type: BACKEND_TO_BACKEND
      clientId: rules-engine-internal
