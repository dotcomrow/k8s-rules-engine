                  <script>window.location.href='/kie-server/services/rest/server';</script>
              </body>
              </html>
              EOF
              echo "Redirect setup complete"
          volumeMounts:
          - name: welcome-content
            mountPath: /shared
      containers:
      - name: kogito-decision-service
        image: quay.io/kiegroup/kie-server-showcase:latest
        command: ["/bin/bash", "-c"]
