# =========================
# Kogito Data Index (ephemeral)
# =========================
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kogito-data-index
  namespace: drools
  labels: { app: kogito-data-index }
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels: { app: kogito-data-index }
  template:
    metadata:
      labels: { app: kogito-data-index }
    spec:
      containers:
        - name: kogito-data-index
          image: quay.io/kiegroup/kogito-data-index-ephemeral:1.44.1
          ports: [{ containerPort: 8080 }]
          env:
            - { name: QUARKUS_HTTP_PORT, value: "8080" }
            - { name: QUARKUS_HTTP_HOST, value: "0.0.0.0" }
            - { name: KOGITO_DATA_INDEX_URL, value: "https://monitoring-drools.teleport.app.suncoast.systems" }
          readinessProbe:
            httpGet: { path: /q/health/ready, port: 8080 }
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /q/health/live, port: 8080 }
            initialDelaySeconds: 30
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: kogito-data-index
  namespace: drools
spec:
  selector:
    app: kogito-data-index
  ports:
    - { name: http, port: 8080, targetPort: 8080, protocol: TCP }
  type: ClusterIP

