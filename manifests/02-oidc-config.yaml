    if (outcome != success) of /subsystem=keycloak/secure-deployment=kie-server.war/credential=secret:read-resource()
      /subsystem=keycloak/secure-deployment=kie-server.war/credential=secret:add(value="${env.OIDC_KIE_SERVER_CLIENT_SECRET:${env.OIDC_CLIENT_SECRET:}}")
    end-if
    if (outcome == success) of /subsystem=undertow/server=default-server/http-listener=default:read-resource()
      /subsystem=undertow/server=default-server/http-listener=default:write-attribute(name=proxy-address-forwarding,value=true)
    end-if
    if (outcome != success) of /subsystem=undertow/configuration=filter/custom-filter=oidc-dumper:read-resource()
      /subsystem=undertow/configuration=filter/custom-filter=oidc-dumper:add(class-name=io.undertow.server.handlers.RequestDumpingHandler,module=io.undertow.core)
    end-if
    if (outcome != success) of /subsystem=undertow/server=default-server/host=default-host/filter-ref=oidc-dumper:read-resource()
      /subsystem=undertow/server=default-server/host=default-host/filter-ref=oidc-dumper:add()
    end-if
    if (outcome != success) of /subsystem=logging/logger=org.keycloak:read-resource()
      /subsystem=logging/logger=org.keycloak:add(level=TRACE)
    end-if
    if (outcome != success) of /subsystem=logging/logger=org.keycloak.authorization:read-resource()
      /subsystem=logging/logger=org.keycloak.authorization:add(level=TRACE)
    end-if
    if (outcome != success) of /subsystem=logging/logger=org.keycloak.adapters:read-resource()
      /subsystem=logging/logger=org.keycloak.adapters:add(level=DEBUG)
