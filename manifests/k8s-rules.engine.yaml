            </html>
            EOF
            
            echo "🚀 Starting KIE Server with Vault credentials..."
            # Ensure KIE Server deploys at root for now
            exec /opt/jboss/wildfly/bin/standalone.sh -b 0.0.0.0 -bmanagement 0.0.0.0 -c standalone-full.xml -Djboss.bind.address=0.0.0.0 -Djboss.bind.address.management=0.0.0.0
