    gravitee.io/definition-metadata: '{"owner":"drools","system":"rules-engine"}'
    gravitee.io/definition-properties: '{"tier":"internal","region":"cluster","token_exchange_url":"https://auth.suncoast.systems/realms/internal/protocol/openid-connect/token","token_exchange_client_id":"<path:secret/data/keycloak-client-id-drools-kie-server-service#value>","token_exchange_client_secret":"<path:secret/data/keycloak-client-secret-drools-kie-server-service#value>"}'
    gravitee.io/definition-resources: '[]'
    gravitee.io/definition-endpoint-groups: '[{"name":"default","type":"http-proxy","sharedConfiguration":{"http":{"version":"HTTP_1_1","connectTimeout":30000,"readTimeout":300000,"idleTimeout":300000,"keepAlive":true,"keepAliveTimeout":30000,"pipelining":false,"useCompression":false,"propagateClientAcceptEncoding":false,"followRedirects":false,"maxConcurrentConnections":20}},"services":{"healthCheck":{"enabled":true,"overrideConfiguration":true,"type":"http-health-check","configuration":{"schedule":"*/30 * * * * *","target":"/kie-server/services/rest/server/healthcheck","method":"GET","overrideEndpointPath":true,"headers":[],"assertion":"{#response.status == 200 || #response.status == 401 || #response.status == 403}","successThreshold":2,"failureThreshold":2}}},"endpoints":[{"name":"decision-service-http","type":"http-proxy","inheritConfiguration":true,"weight":1,"configuration":{"target":"http://kogito-decision-service.drools.svc.cluster.local:8080"},"secondary":false}]}]'
    gravitee.io/definition-pages: '{"swagger":{"type":"SWAGGER","name":"openapi","published":true,"visibility":"PUBLIC","homepage":false,"source":{"type":"http-fetcher","configuration":{"url":"http://kogito-decision-openapi.drools.svc.cluster.local:8080/openapi.json","autoFetch":true,"fetchCron":"0 */5 * * * *","useSystemProxy":false}}}}'
    gravitee.io/definition-plans: '{"bearer-internal":{"name":"Bearer Token","description":"Bearer token (validated by JWT policy)","security":{"type":"KEY_LESS"},"status":"PUBLISHED","validation":"AUTO","type":"API","selectionRule":"{#request.headers[\"authorization\"] != null && #request.headers[\"authorization\"].size() > 0 && #request.headers[\"authorization\"][0].startsWith(\"Bearer \")}"}}'
    gravitee.io/definition-flows: '[{"name":"token-exchange","enabled":true,"request":[{"name":"keycloak-token-exchange","policy":"policy-http-callout","enabled":true,"description":"Exchange token to internal realm","messageCondition":"{#request.headers[\"authorization\"] != null && #request.headers[\"authorization\"].size() > 0 && #request.headers[\"authorization\"][0].startsWith(\"Bearer \")}","configuration":{"url":"{#properties[\"token_exchange_url\"]}","method":"POST","headers":[{"name":"Content-Type","value":"application/x-www-form-urlencoded"}],"body":"grant_type=urn:ietf:params:oauth:grant-type:token-exchange&client_id={#properties[\"token_exchange_client_id\"]}&client_secret={#properties[\"token_exchange_client_secret\"]}&subject_token={#request.headers[\"authorization\"][0].substring(7)}","exitOnError":false,"variables":[{"name":"exchanged_token","value":"{#calloutResponse != null && #calloutResponse.status == 200 ? #jsonPath(#calloutResponse.content, \"$.access_token\") : null}"}]}},{"name":"strip-auth-header","policy":"transform-headers","enabled":true,"messageCondition":"{#context.attributes[\"exchanged_token\"] != null && #context.attributes[\"exchanged_token\"].length() > 0}","configuration":{"removeHeaders":["Authorization"]}},{"name":"apply-exchanged-token","policy":"transform-headers","enabled":true,"messageCondition":"{#context.attributes[\"exchanged_token\"] != null && #context.attributes[\"exchanged_token\"].length() > 0}","configuration":{"addHeaders":[{"name":"Authorization","value":"Bearer {#context.attributes[\"exchanged_token\"]}"}]}},{"name":"validate-jwt","policy":"jwt","enabled":true,"messageCondition":"{#request.headers[\"authorization\"] != null && #request.headers[\"authorization\"].size() > 0 && #request.headers[\"authorization\"][0].startsWith(\"Bearer \")}","configuration":{"signature":"RSA_RS256","publicKeyResolver":"JWKS_URL","resolverParameter":"https://auth.suncoast.systems/realms/internal/protocol/openid-connect/certs","extrac