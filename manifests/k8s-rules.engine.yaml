# =========================
# Vault and YugabyteDB Initialization Jobs
# =========================
apiVersion: batch/v1
kind: Job
metadata:
  name: copy-drools-vault-root-token
  namespace: vault
spec:
  backoffLimit: 0
  template:
    spec:
      serviceAccountName: default
      restartPolicy: Never
      containers:
        - name: copy-secret
          image: alpine/k8s:1.31.4
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits:   { cpu: "200m", memory: "256Mi" }
          command: ["/bin/sh","-c"]
          args:
            - |
              echo "🔁 Copying 'vault-root-token' from vault → drools..."
              kubectl get secret vault-root-token -n vault -o yaml | \
                sed 's/namespace: vault/namespace: drools/' | \
                kubectl apply -f -
              echo "✅ Secret copied successfully."
---
apiVersion: batch/v1
kind: Job
metadata:
  name: drools-yugabyte-config
  namespace: vault
spec:
  backoffLimit: 0
  template:
    metadata:
      annotations:
        linkerd.io/inject: "disabled"
    spec:
      restartPolicy: Never
      serviceAccountName: default
      volumes:
        - name: root-token
          secret:
            secretName: vault-root-token
      containers:
        - name: setup-role
          image: hashicorp/vault:1.15.4
          command: ["/bin/sh","-c"]
          args:
            - |
              #!/bin/sh
              set -eu

              PGHOST=yb-tserver-service.yugabyte.svc.cluster.local
              PGPORT=5433
              DB=drools
              ROLE_GROUP=drools
              ROLE_OWNER=drools_app
              VAULTADMIN_USER=vaultadmin

              apk add --no-cache postgresql15-client jq netcat-openbsd curl

              export PATH="$PATH:/vault-bin"
              export VAULT_ADDR="http://vault.vault.svc.cluster.local:8200"

              while [ ! -f /vault-token/VAULT_TOKEN ]; do
                echo "🔁 Waiting for Vault token file..."
                sleep 2
              done
              export VAULT_TOKEN="$(cat /vault-token/VAULT_TOKEN)"

              echo "🧩 Ensuring KV v2 at 'secret/'..."
              while :; do
                # already KVv2?
                if vault secrets list -format=json 2>/dev/null \
                  | jq -e '."secret/".type=="kv" and ."secret/".options.version=="2"' >/dev/null; then
                  echo "✅ 'secret/' is KVv2"
                  break
                fi

                # path exists but not KVv2 → bail
                if vault secrets list -format=json 2>/dev/null \
                  | jq -e 'has("secret/")' >/dev/null; then
                  echo "❌ 'secret/' exists but is not KVv2; please migrate manually."
                  exit 1
                fi

                # try to enable KVv2; if it works, we're done; otherwise, retry after a short pause
                vault secrets enable -path=secret -version=2 kv && break

                sleep 2
              done

              echo "🔐 Seeding Drools admin creds at secret/drools/admin (if missing)..."
              if ! vault kv get -format=json secret/drools/admin >/dev/null 2>&1; then
                PASS="$(tr -dc 'A-Za-z0-9@#%^+=_' </dev/urandom | head -c 32)"
                vault kv put secret/drools/admin username=admin password="$PASS"
                echo "✅ Seeded admin secret at secret/drools/admin"
              else
                echo "✅ Admin secret already present"
              fi

              echo "🔐 Seeding KIE Server user creds at secret/drools/kie-user (if missing)..."
              if ! vault kv get -format=json secret/drools/kie-user >/dev/null 2>&1; then
                PASS="$(tr -dc 'A-Za-z0-9@#%^+=_' </dev/urandom | head -c 32)"
                vault kv put secret/drools/kie-user username=kieserver password="$PASS"
                echo "✅ Seeded kie-user secret at secret/drools/kie-user"
              else
                echo "✅ KIE user secret already present"
              fi

              until getent hosts "$PGHOST" >/dev/null 2>&1; do echo "🔄 Waiting for DNS for $PGHOST..."; sleep 3; done
              until nc -z -w1 "$PGHOST" "$PGPORT"; do echo "⏳ Waiting for DB $PGHOST:$PGPORT..."; sleep 3; done
              echo "✅ Yugabyte reachable"

              echo "🔐 Waiting for secret/${VAULTADMIN_USER} to exist in Vault..."
              VAULTADMIN_PASS=""
              while :; do
                OUT="$(vault kv get -format=json "secret/${VAULTADMIN_USER}" 2>/dev/null || true)"
                if [ -n "${OUT}" ]; then
                  VAULTADMIN_PASS="$(printf '%s' "$OUT" | jq -r '.data.data.password // .data.data.value // empty')"
                  if [ -n "${VAULTADMIN_PASS}" ] && [ "${VAULTADMIN_PASS}" != "null" ]; then
                    echo "✅ Found secret/${VAULTADMIN_USER}"
                    break
                  fi
                fi
                echo "⏳ secret/${VAULTADMIN_USER} not ready yet; retrying in 5s..."
                sleep 5
              done
              export PGPASSWORD="$VAULTADMIN_PASS"

              while :; do
                DB_EXISTS="$(psql -h "$PGHOST" -p "$PGPORT" -U "$VAULTADMIN_USER" -d yugabyte -tAc "SELECT 1 FROM pg_database WHERE datname='$DB'" 2>/dev/null || true)"
                [ "$DB_EXISTS" = "1" ] && { echo "✅ DB '$DB' exists"; break; }
                echo "📦 Creating DB '$DB' owned by $VAULTADMIN_USER..."
                createdb -h "$PGHOST" -p "$PGPORT" -U "$VAULTADMIN_USER" -O "$VAULTADMIN_USER" "$DB" 2>/dev/null && { echo "✅ DB created"; break; }
                echo "🔁 Retry create DB in 3s..."; sleep 3
              done

              psql -h "$PGHOST" -p "$PGPORT" -U "$VAULTADMIN_USER" -d yugabyte <<EOSQL
              DO \$\$
              BEGIN
                IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = '${ROLE_GROUP}') THEN
                  CREATE ROLE ${ROLE_GROUP} NOLOGIN;
                END IF;
                IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = '${ROLE_OWNER}') THEN
                  CREATE ROLE ${ROLE_OWNER} LOGIN INHERIT;
                END IF;
              END
              \$\$;
              GRANT ${ROLE_GROUP} TO ${ROLE_OWNER};
              GRANT ${ROLE_OWNER} TO ${VAULTADMIN_USER};
              EOSQL

              # Create schemas for different Drools components
              psql -h "$PGHOST" -p "$PGPORT" -U "$VAULTADMIN_USER" -d "$DB" <<EOSQL
              CREATE SCHEMA IF NOT EXISTS drools AUTHORIZATION ${ROLE_OWNER};
              CREATE SCHEMA IF NOT EXISTS kie_server AUTHORIZATION ${ROLE_OWNER};
              CREATE SCHEMA IF NOT EXISTS kogito AUTHORIZATION ${ROLE_OWNER};
              CREATE SCHEMA IF NOT EXISTS data_index AUTHORIZATION ${ROLE_OWNER};
              ALTER SCHEMA drools OWNER TO ${ROLE_OWNER};
              ALTER SCHEMA kie_server OWNER TO ${ROLE_OWNER};
              ALTER SCHEMA kogito OWNER TO ${ROLE_OWNER};
              ALTER SCHEMA data_index OWNER TO ${ROLE_OWNER};
              ALTER ROLE ${ROLE_OWNER} SET search_path = drools,kie_server,kogito,data_index,public;
              GRANT CONNECT ON DATABASE ${DB} TO ${ROLE_OWNER};
              EOSQL

              # Set up permissions for each schema
              for schema in drools kie_server kogito data_index; do
                psql -h "$PGHOST" -p "$PGPORT" -U "$VAULTADMIN_USER" -d "$DB" <<EOSQL
              SET ROLE ${ROLE_OWNER};
              GRANT USAGE, CREATE ON SCHEMA ${schema} TO ${ROLE_GROUP};
              GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES    IN SCHEMA ${schema} TO ${ROLE_GROUP};
              GRANT USAGE, SELECT                     ON ALL SEQUENCES IN SCHEMA ${schema} TO ${ROLE_GROUP};
              ALTER DEFAULT PRIVILEGES IN SCHEMA ${schema}
                GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES   TO ${ROLE_GROUP};
              ALTER DEFAULT PRIVILEGES IN SCHEMA ${schema}
                GRANT USAGE, SELECT                ON SEQUENCES TO ${ROLE_GROUP};
              GRANT USAGE, CREATE ON SCHEMA ${schema} TO ${VAULTADMIN_USER};
              GRANT ALL PRIVILEGES ON ALL TABLES    IN SCHEMA ${schema} TO ${VAULTADMIN_USER};
              GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA ${schema} TO ${VAULTADMIN_USER};
              ALTER DEFAULT PRIVILEGES IN SCHEMA ${schema} GRANT ALL ON TABLES    TO ${VAULTADMIN_USER};
              ALTER DEFAULT PRIVILEGES IN SCHEMA ${schema} GRANT ALL ON SEQUENCES TO ${VAULTADMIN_USER};
              RESET ROLE;
              EOSQL
              done

              echo "✅ Schemas & privileges prepared for Drools components"

              if ! vault secrets list -format=json | jq -e 'has("yugabyte-db/")' >/dev/null 2>&1; then
                vault secrets enable -path=yugabyte-db database
                echo "✅ Enabled database secrets engine"
              fi

              # Create static role with automatic password rotation
              vault write yugabyte-db/static-roles/drools-app \
                db_name="yugabyte" \
                username="${ROLE_OWNER}" \
                rotation_statements="ALTER ROLE \"{{name}}\" WITH PASSWORD '{{password}}';" \
                rotation_period="24h"

              echo "✅ Configured Vault database connection and static role"

              vault policy write "drools" - <<'EOF'
              path "yugabyte-db/static-creds/drools-app"           { capabilities = ["read"] }
              path "secret/data/drools/admin"                      { capabilities = ["read"] }
              path "secret/data/drools/kie-user"                   { capabilities = ["read"] }
              path "secret/data/vaultadmin"                        { capabilities = ["read"] }
              EOF

              vault write auth/kubernetes/role/drools \
                bound_service_account_names="drools-workbench,drools-kie-server,drools-kogito-decisions,drools-kogito-jobs,drools-kogito-data-index,drools-rules-service,drools-api-gateway" \
                bound_service_account_namespaces="drools" \
                policies="drools" \
                ttl="48h"

              CREDS_JSON="$(vault read -format=json yugabyte-db/static-creds/drools-app)"
              DB_USER="$(printf '%s' "$CREDS_JSON" | jq -r .data.username)"
              DB_PASS="$(printf '%s' "$CREDS_JSON" | jq -r .data.password)"
              export PGPASSWORD="$DB_PASS"
              echo "🔎 Sanity check as \$DB_USER=$DB_USER"
              psql -h "$PGHOST" -p "$PGPORT" -U "$DB_USER" -d "$DB" -c "SELECT current_user, current_schema();"

              echo "🎉 Drools DB prepared; Vault static role + policy + K8s binding ready."
          volumeMounts:
            - name: root-token
              mountPath: /vault-token
              readOnly: true
          resources:
            requests: { cpu: "50m",  memory: "64Mi" }
            limits:   { cpu: "200m", memory: "256Mi" }
---
# RBAC for initialization jobs
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: job-status-reader-drools
  namespace: vault
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: job-status-reader-for-drools
  namespace: vault
subjects:
  - kind: ServiceAccount
    name: drools-workbench
    namespace: drools
  - kind: ServiceAccount
    name: drools-kie-server
    namespace: drools
  - kind: ServiceAccount
    name: drools-kogito-decisions
    namespace: drools
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: job-status-reader-drools
---
# RBAC for jobs service init container to read pod status
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-reader-drools
  namespace: drools
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pod-reader-for-jobs-service
  namespace: drools
subjects:
  - kind: ServiceAccount
    name: drools-kogito-jobs
    namespace: drools
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pod-reader-drools
---

apiVersion: v1
kind: Namespace
metadata:
  name: drools
  labels:
    name: drools-rules-engine
  annotations:
    linkerd.io/inject: enabled
    field.cattle.io/projectId: local:applications
    scheduler.alpha.kubernetes.io/node-selector: "dedicated=work-node"

