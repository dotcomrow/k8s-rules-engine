# =========================
# KIE Workbench - Business Central
# =========================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kie-workbench
  namespace: drools
  labels:
    app: kie-workbench
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kie-workbench
  template:
    metadata:
      labels:
        app: kie-workbench
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "drools"
        vault.hashicorp.com/agent-init-first: "true"
        vault.hashicorp.com/agent-pre-populate: "true"

        # DB creds (static role)
        vault.hashicorp.com/agent-inject-secret-db-username: "yugabyte-db/static-creds/drools-app"
        vault.hashicorp.com/agent-inject-template-db-username: |
          {{- with secret "yugabyte-db/static-creds/drools-app" -}}{{ .Data.username }}{{- end -}}
        vault.hashicorp.com/agent-inject-secret-db-password: "yugabyte-db/static-creds/drools-app"
        vault.hashicorp.com/agent-inject-template-db-password: |
          {{- with secret "yugabyte-db/static-creds/drools-app" -}}{{ .Data.password }}{{- end -}}

        # Admin creds
        vault.hashicorp.com/agent-inject-secret-drools-admin: "secret/data/drools/admin"
        vault.hashicorp.com/agent-inject-template-drools-admin: |
          {{- with secret "secret/data/drools/admin" -}}
          ADMIN_USER={{ .Data.data.username }}
          ADMIN_PASS={{ .Data.data.password }}
          {{- end -}}

        # KIE Server user creds
        vault.hashicorp.com/agent-inject-secret-kie-user: "secret/data/drools/kie-user"
        vault.hashicorp.com/agent-inject-template-kie-user: |
          {{- with secret "secret/data/drools/kie-user" -}}
          KIE_SERVER_USER={{ .Data.data.username }}
          KIE_SERVER_PASSWORD={{ .Data.data.password }}
          {{- end -}}

        # Allow direct Postgres/Vault egress
        config.linkerd.io/skip-outbound-ports: "8200,5433"

        teleport.dev/name: "drools-workbench"
    spec:
      serviceAccountName: drools-workbench
      initContainers:
        - name: wait-for-config-job
          image: alpine/k8s:1.31.4
          command: ["/bin/sh","-lc"]
          args:
            - |
              echo "Waiting for Job vault/drools-yugabyte-config to complete..."
              while true; do
                if ! kubectl -n vault get job drools-yugabyte-config >/dev/null 2>&1; then
                  echo "  └─ job not found yet..."
                  sleep 5
                  continue
                fi
                SUCC="$(kubectl -n vault get job drools-yugabyte-config -o jsonpath='{.status.succeeded}' 2>/dev/null || true)"; SUCC="${SUCC:-0}"
                if [ "$SUCC" -ge 1 ] 2>/dev/null; then
                  echo "DB bootstrap job complete."
                  break
                fi
                if kubectl -n vault wait --for=condition=complete job/drools-yugabyte-config --timeout=10s >/dev/null 2>&1; then
                  echo "DB bootstrap job complete."
                  break
                fi
                sleep 5
              done
        - name: setup-redirect
          image: quay.io/kiegroup/business-central-workbench:latest
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "Setting up Business Central redirect..."
              rm -rf /opt/jboss/wildfly/welcome-content/*
              cat > /opt/jboss/wildfly/welcome-content/index.html << 'EOF'
              <!DOCTYPE html>
              <html>
              <head>
                  <meta http-equiv="refresh" content="0; url=/business-central/">
                  <title>Redirecting to Business Central...</title>
              </head>
              <body>
                  <p>Redirecting to <a href="/business-central/">Business Central</a>...</p>
                  <script>window.location.href='/business-central/';</script>
              </body>
              </html>
              EOF
              echo "Redirect setup complete"
          volumeMounts:
          - name: welcome-content
            mountPath: /opt/jboss/wildfly/welcome-content
      containers:
      - name: kie-workbench
        image: quay.io/kiegroup/business-central-workbench:latest
        ports:
        - containerPort: 8080
          name: http
        - containerPort: 8001
          name: debug
        - containerPort: 9418
          name: git
        # Wrapper: export envs from Vault files, then run official bootstrap
        command: ["/bin/sh","-lc"]
        args:
          - |
            set -eu
            # Source Vault-injected files
            [ -f /vault/secrets/drools-admin ] && . /vault/secrets/drools-admin
            [ -f /vault/secrets/kie-user ] && . /vault/secrets/kie-user
            # Export envs expected by the image bootstrap
            [ -n "${ADMIN_USER:-}" ] && export KIE_ADMIN_USER="$ADMIN_USER"
            [ -n "${ADMIN_PASS:-}" ] && export KIE_ADMIN_PWD="$ADMIN_PASS"
            # Optional DB vars (left off for now to boot clean)
            exec /opt/jboss/run.sh
        env:
        - name: JAVA_OPTS
          value: "-Xms512m -Xmx2048m -XX:MetaspaceSize=96M -XX:MaxMetaspaceSize=512m -Djava.net.preferIPv4Stack=true -Dfile.encoding=UTF-8 -Dorg.kie.server.bypass.auth.user=false -Dorg.kie.workbench.profile=FULL -Dorg.uberfire.nio.git.daemon.host=0.0.0.0 -Djboss.bind.address=0.0.0.0 -Djboss.bind.address.management=0.0.0.0"
        - name: KIE_WORKBENCH_INDEX_REDIRECT
          value: "true"
        - name: KIE_CONNECTION_URL
          value: "jdbc:postgresql://yb-tserver-service.yugabyte.svc.cluster.local:5433/drools?currentSchema=drools"
        - name: KIE_CONNECTION_DRIVER_CLASS
          value: "org.postgresql.Driver"
        - name: KIE_SERVER_LOCATION
          value: "https://kie-server-drools.app.suncoast.systems/services/rest/server"
        - name: DROOLS_WB_HOST
          value: "workbench-drools.app.suncoast.systems"
        - name: DROOLS_WB_PROTOCOL
          value: "https"
        - name: DROOLS_WB_PORT
          value: "443"
        volumeMounts:
        - name: git-storage
          mountPath: /opt/jboss/.niogit
        - name: welcome-content
          mountPath: /opt/jboss/wildfly/welcome-content
        readinessProbe:
          httpGet:
            path: /business-central/
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 15
          timeoutSeconds: 10
          failureThreshold: 5
        livenessProbe:
          httpGet:
            path: /business-central/
            port: 8080
          initialDelaySeconds: 120
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "3Gi"
            cpu: "2000m"
      volumes:
      - name: git-storage
        emptyDir: {}
      - name: welcome-content
        emptyDir: {}

---
# Teleport Service - KIE Workbench
apiVersion: v1
kind: Service
metadata:
  name: kie-workbench
  namespace: drools
  annotations:
    teleport.dev/name: "drools-workbench"
    teleport.dev/protocol: "http"
    teleport.dev/public-addr: "workbench-drools.app.suncoast.systems"
    teleport.dev/description: "KIE Workbench - Business rules authoring and management interface"
    teleport.dev/port: "8080"
  labels:
    app.kubernetes.io/name: kie-workbench
    app.kubernetes.io/component: authoring
    teleport.dev/app: "drools-workbench"
    teleport.dev/enroll: "true"
spec:
  selector:
    app: kie-workbench
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    protocol: TCP
  - name: git
    port: 9418
    targetPort: 9418
    protocol: TCP
  type: ClusterIP

---
# =========================
# KIE Server - Runtime
# =========================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kie-server
  namespace: drools
  labels:
    app: kie-server
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kie-server
  template:
    metadata:
      labels:
        app: kie-server
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "drools"
        vault.hashicorp.com/agent-init-first: "true"
        vault.hashicorp.com/agent-pre-populate: "true"

        # Admin creds
        vault.hashicorp.com/agent-inject-secret-drools-admin: "secret/data/drools/admin"
        vault.hashicorp.com/agent-inject-template-drools-admin: |
          {{- with secret "secret/data/drools/admin" -}}
          ADMIN_USER={{ .Data.data.username }}
          ADMIN_PASS={{ .Data.data.password }}
          {{- end -}}

        # KIE Server user creds
        vault.hashicorp.com/agent-inject-secret-kie-user: "secret/data/drools/kie-user"
        vault.hashicorp.com/agent-inject-template-kie-user: |
          {{- with secret "secret/data/drools/kie-user" -}}
          KIE_SERVER_USER={{ .Data.data.username }}
          KIE_SERVER_PASSWORD={{ .Data.data.password }}
          {{- end -}}

        # Allow direct Vault egress
        config.linkerd.io/skip-outbound-ports: "8200"

        teleport.dev/name: "drools-kie-server"
    spec:
      serviceAccountName: drools-kie-server
      initContainers:
        - name: wait-for-config-job
          image: alpine/k8s:1.31.4
          command: ["/bin/sh","-lc"]
          args:
            - |
              echo "Waiting for Job vault/drools-yugabyte-config to complete..."
              while true; do
                if ! kubectl -n vault get job drools-yugabyte-config >/dev/null 2>&1; then
                  echo "  └─ job not found yet..."
                  sleep 5
                  continue
                fi
                SUCC="$(kubectl -n vault get job drools-yugabyte-config -o jsonpath='{.status.succeeded}' 2>/dev/null || true)"; SUCC="${SUCC:-0}"
                [ "$SUCC" -ge 1 ] && break
                sleep 5
              done
        - name: setup-redirect
          image: quay.io/kiegroup/kie-server:latest
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "Setting up KIE Server redirect..."
              rm -rf /opt/jboss/wildfly/welcome-content/*
              cat > /opt/jboss/wildfly/welcome-content/index.html << 'EOF'
              <!DOCTYPE html>
              <html>
              <head>
                  <meta http-equiv="refresh" content="0; url=/kie-server/services/rest/server">
                  <title>Redirecting to KIE Server API...</title>
              </head>
              <body>
                  <p>Redirecting to <a href="/kie-server/services/rest/server">KIE Server REST API</a>...</p>
                  <script>window.location.href='/kie-server/services/rest/server';</script>
              </body>
              </html>
              EOF
              echo "Redirect setup complete"
          volumeMounts:
          - name: welcome-content
            mountPath: /opt/jboss/wildfly/welcome-content
      containers:
      - name: kie-server
        image: quay.io/kiegroup/kie-server:latest
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: welcome-content
          mountPath: /opt/jboss/wildfly/welcome-content
        # Wrapper: source Vault files → export envs → run official bootstrap
        command: ["/bin/sh","-lc"]
        args:
          - |
            set -eu
            [ -f /vault/secrets/drools-admin ] && . /vault/secrets/drools-admin
            [ -f /vault/secrets/kie-user ] && . /vault/secrets/kie-user
            # KIE Server identity & controller auth
            [ -n "${KIE_SERVER_USER:-}" ] || export KIE_SERVER_USER="${KIE_SERVER_USER:-${KIE_SERVER_USER_NAME:-kieserver}}"
            [ -n "${KIE_SERVER_PASSWORD:-}" ] || export KIE_SERVER_PWD="${KIE_SERVER_PASSWORD:-kieserver1!}"
            [ -n "${KIE_SERVER_PWD:-}" ] || export KIE_SERVER_PWD="${KIE_SERVER_PASSWORD:-kieserver1!}"
            # Prefer admin for controller (works out of the box)
            [ -n "${ADMIN_USER:-}" ] && export KIE_SERVER_CONTROLLER_USER="$ADMIN_USER"
            [ -n "${ADMIN_PASS:-}" ] && export KIE_SERVER_CONTROLLER_PWD="$ADMIN_PASS"
            exec /opt/jboss/run.sh
        env:
        - name: JAVA_OPTS
          value: "-Xms256m -Xmx1024m -XX:MetaspaceSize=96M -XX:MaxMetaspaceSize=256m -Djava.net.preferIPv4Stack=true -Dfile.encoding=UTF-8"
        - name: KIE_SERVER_ID
          value: "kie-server"
        - name: KIE_SERVER_LOCATION
          value: "https://kie-server-drools.app.suncoast.systems/services/rest/server"
        - name: KIE_SERVER_CONTROLLER
          value: "https://workbench-drools.app.suncoast.systems/business-central/rest/controller"
        - name: KIE_MAVEN_REPO
          value: "https://workbench-drools.app.suncoast.systems/business-central/maven2"
        - name: KIE_SERVER_MODE
          value: "DEVELOPMENT"
        - name: DROOLS_SERVER_FILTER_CLASSES
          value: "true"
        - name: KIE_SERVER_BYPASS_AUTH_USER
          value: "false"
        - name: KIE_SERVER_HOST
          value: "0.0.0.0"
        - name: KIE_SERVER_PORT
          value: "8080"
        - name: KIE_SERVER_JMS_QUEUE_REQUEST
          value: "queue/KIE.SERVER.REQUEST"
        - name: KIE_SERVER_JMS_QUEUE_RESPONSE
