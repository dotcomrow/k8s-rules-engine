# =========================
# NGINX API Gateway
# =========================
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-gateway-nginx-conf
  namespace: drools
data:
  nginx.conf: |
    worker_processes  auto;
    events { worker_connections 1024; use epoll; multi_accept on; }
    http {
      include /etc/nginx/mime.types;
      default_type application/octet-stream;

      log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'rt=$request_time uct="$upstream_connect_time" '
                      'uht="$upstream_header_time" urt="$upstream_response_time"';
      access_log /var/log/nginx/access.log main;
      error_log  /var/log/nginx/error.log warn;

      sendfile on; tcp_nopush on; tcp_nodelay on; keepalive_timeout 65;
      client_max_body_size 50m; client_body_timeout 60s; client_header_timeout 60s;

      gzip on; gzip_vary on; gzip_min_length 1000;
      gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

      upstream kie_workbench { server kie-workbench.drools.svc.cluster.local:8080; keepalive 32; }
      upstream kie_server    { server kie-server.drools.svc.cluster.local:8080; keepalive 32; }
      upstream kogito_decision { server kogito-decision-service.drools.svc.cluster.local:8080; keepalive 32; }

      server {
        listen 8080; server_name localhost;

        set $cors_origin ""; set $cors_creds "false";
        set $cors_headers "Authorization,Content-Type,Accept,Origin,User-Agent,DNT,Cache-Control,X-Mx-ReqToken,Keep-Alive,X-Requested-With,If-Modified-Since,X-KIE-ContentType";
        if ($http_origin = '') { set $cors_origin "*"; }
        if ($http_origin != '') { set $cors_origin $http_origin; set $cors_creds "true"; }

        location = / {
          access_log off;
          add_header Content-Type "application/json; charset=utf-8" always;
          add_header Cache-Control "no-cache" always;
          return 200 '{"status":"healthy","services":{"business-central":"/business-central/","kie-server":"/kie-server/","health":"/health","api-docs":"/api/docs"},"individual_access":{"workbench":"https://workbench-drools.teleport.app.suncoast.systems/business-central/","kie-server":"https://kie-server-drools.teleport.app.suncoast.systems/","decisions":"https://decisions-drools.teleport.app.suncoast.systems/","jobs":"https://jobs-drools.teleport.app.suncoast.systems/","monitoring":"https://monitoring-drools.teleport.app.suncoast.systems/"}}';
        }

        location /business-central/ {
          if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Credentials $cors_creds always;
            add_header Access-Control-Allow-Methods "GET,POST,PUT,DELETE,OPTIONS,PATCH" always;
            add_header Access-Control-Allow-Headers $cors_headers always;
            add_header Access-Control-Max-Age 3600 always;
            add_header Content-Length 0 always; add_header Content-Type text/plain always;
            return 204;
          }
          proxy_pass http://kie_workbench/business-central/;
          proxy_http_version 1.1;
          proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade";
          proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Forwarded-Host $host;
          proxy_read_timeout 300s; proxy_connect_timeout 60s; proxy_send_timeout 60s;
          add_header X-Frame-Options DENY always; add_header X-Content-Type-Options nosniff always;
          add_header X-XSS-Protection "1; mode=block" always; add_header Referrer-Policy "strict-origin-when-cross-origin" always;
          add_header Access-Control-Allow-Origin $cors_origin always; add_header Access-Control-Allow-Credentials $cors_creds always;
          add_header Access-Control-Expose-Headers "Content-Disposition" always;
        }

        location /kie-server/ {
          if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Credentials $cors_creds always;
            add_header Access-Control-Allow-Methods "GET,POST,PUT,DELETE,OPTIONS,PATCH" always;
            add_header Access-Control-Allow-Headers $cors_headers always;
            add_header Access-Control-Max-Age 3600 always;
            add_header Content-Length 0 always; add_header Content-Type text/plain always;
            return 204;
          }
          proxy_pass http://kogito_decision/kie-server/;
          proxy_http_version 1.1; proxy_set_header Connection "";
          proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Forwarded-Host $host;
          add_header X-Frame-Options DENY always; add_header X-Content-Type-Options nosniff always;
          add_header X-XSS-Protection "1; mode=block" always; add_header Referrer-Policy "strict-origin-when-cross-origin" always;
          add_header Access-Control-Allow-Origin $cors_origin always; add_header Access-Control-Allow-Credentials $cors_creds always;
          add_header Access-Control-Expose-Headers "X-KIE-ContentType" always;
        }

        location /decisions/ {
          if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Credentials $cors_creds always;
            add_header Access-Control-Allow-Methods "GET,POST,PUT,DELETE,OPTIONS,PATCH" always;
            add_header Access-Control-Allow-Headers $cors_headers always;
            add_header Access-Control-Max-Age 3600 always; add_header Content-Length 0 always; add_header Content-Type text/plain always;
            return 204;
          }
          proxy_pass http://kogito_decision/kie-server/;
          proxy_http_version 1.1; proxy_set_header Connection "";
          proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Forwarded-Host $host;
          add_header X-Frame-Options DENY always; add_header X-Content-Type-Options nosniff always; add_header X-XSS-Protection "1; mode=block" always; add_header Referrer-Policy "strict-origin-when-cross-origin" always;
          add_header Access-Control-Allow-Origin $cors_origin always; add_header Access-Control-Allow-Credentials $cors_creds always;
        }

        location = /health { access_log off; add_header Content-Type text/plain always; return 200 'healthy'; }
        location = /ready  { access_log off; add_header Content-Type text/plain always; return 200 'ready'; }

        location /api/docs {
          if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Credentials $cors_creds always;
            add_header Access-Control-Allow-Methods "GET,POST,PUT,DELETE,OPTIONS,PATCH" always;
            add_header Access-Control-Allow-Headers $cors_headers always; add_header Access-Control-Max-Age 3600 always;
            add_header Content-Length 0 always; add_header Content-Type text/plain always;
            return 204;
          }
          proxy_pass http://kogito_decision/kie-server/docs/;
          proxy_http_version 1.1; proxy_set_header Connection ""; proxy_set_header Host $host;
          add_header Access-Control-Allow-Origin $cors_origin always;
        }

        location /api/openapi {
          if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $cors_origin always; add_header Access-Control-Allow-Credentials $cors_creds always;
            add_header Access-Control-Allow-Methods "GET,POST,PUT,DELETE,OPTIONS,PATCH" always; add_header Access-Control-Allow-Headers $cors_headers always;
            add_header Access-Control-Max-Age 3600 always; add_header Content-Length 0 always; add_header Content-Type text/plain always; return 204;
          }
          proxy_pass http://kogito_decision/kie-server/services/rest/server;
          proxy_http_version 1.1; proxy_set_header Connection ""; proxy_set_header Host $host;
          add_header Access-Control-Allow-Origin $cors_origin always; add_header Content-Type application/json always;
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: drools
  labels: { app: api-gateway }
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 2
  selector:
    matchLabels: { app: api-gateway }
  template:
    metadata:
      labels: { app: api-gateway }
    spec:
      containers:
        - name: nginx
          image: nginx:1.25-alpine
          ports: [{ containerPort: 8080 }]
          volumeMounts:
            - { name: nginx-config, mountPath: /etc/nginx/nginx.conf, subPath: nginx.conf }
          readinessProbe:
            httpGet: { path: /ready, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: nginx-config
          configMap: { name: api-gateway-nginx-conf }

---
apiVersion: v1
kind: Service
metadata:
  name: drools-api-gateway
  namespace: drools
spec:
  selector:
    app: api-gateway
  ports:
    - { name: http, port: 8080, targetPort: 8080, protocol: TCP }
  type: ClusterIP

# =========================
# Kogito Jobs Service (ephemeral)
# =========================
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kogito-jobs-service
  namespace: drools
  labels: { app: kogito-jobs-service }
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels: { app: kogito-jobs-service }
  template:
    metadata:
      labels: { app: kogito-jobs-service }
    spec:
      serviceAccountName: drools-kogito-jobs
      initContainers:
        - name: wait-for-services
          image: alpine/k8s:1.31.4
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "🔄 Waiting for core Drools services to be ready..."
              until kubectl get pods -n drools -l app=kie-server --field-selector=status.phase=Running 2>/dev/null | grep -q "Running"; do sleep 10; done
              until kubectl get pods -n drools -l app=kogito-decision-service --field-selector=status.phase=Running 2>/dev/null | grep -q "Running"; do sleep 10; done
              until kubectl get pods -n drools -l app=api-gateway --field-selector=status.phase=Running 2>/dev/null | grep -q "Running"; do sleep 10; done
              sleep 30
      containers:
        - name: kogito-jobs-service
          image: quay.io/kiegroup/kogito-jobs-service-ephemeral:1.40
          ports: [{ containerPort: 8080 }]
          env:
            - { name: QUARKUS_HTTP_PORT, value: "8080" }
            - { name: QUARKUS_HTTP_HOST, value: "0.0.0.0" }
            - { name: KOGITO_JOBS_SERVICE_URL, value: "https://jobs-drools.teleport.app.suncoast.systems" }
            - { name: QUARKUS_LOG_LEVEL, value: "INFO" }
            - { name: QUARKUS_LOG_CONSOLE_ENABLE, value: "true" }
            - { name: KOGITO_PERSISTENCE_TYPE, value: "ephemeral" }
            - { name: QUARKUS_SMALLRYE_OPENAPI_PATH, value: "/q/openapi" }
            - { name: QUARKUS_SWAGGER_UI_ALWAYS_INCLUDE, value: "true" }
          readinessProbe:
            httpGet: { path: /q/health/ready, port: 8080 }
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            httpGet: { path: /q/health/live, port: 8080 }
            initialDelaySeconds: 45
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: kogito-jobs-service
  namespace: drools
spec:
  selector:
    app: kogito-jobs-service
  ports:
    - { name: http, port: 8080, targetPort: 8080, protocol: TCP }
  type: ClusterIP

# =========================
# Kogito Data Index (ephemeral)
# =========================
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kogito-data-index
  namespace: drools
  labels: { app: kogito-data-index }
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels: { app: kogito-data-index }
  template:
    metadata:
      labels: { app: kogito-data-index }
    spec:
      containers:
        - name: kogito-data-index
          image: quay.io/kiegroup/kogito-data-index-ephemeral:1.40
          ports: [{ containerPort: 8080 }]
          env:
            - { name: QUARKUS_HTTP_PORT, value: "8080" }
            - { name: QUARKUS_HTTP_HOST, value: "0.0.0.0" }
            - { name: KOGITO_DATA_INDEX_URL, value: "https://monitoring-drools.teleport.app.suncoast.systems" }
          readinessProbe:
            httpGet: { path: /q/health/ready, port: 8080 }
