              echo "Setting up Decision Service redirect..."
              mkdir -p /shared/welcome-content
              cat > /shared/welcome-content/index.html << 'EOF'
              <!DOCTYPE html>
              <html>
              <head>
                  <meta http-equiv="refresh" content="0; url=/kie-server/services/rest/server">
                  <title>Redirecting to KIE Server API...</title>
              </head>
