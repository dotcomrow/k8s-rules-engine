# =========================
# Kogito Jobs Service - Async Job Processing
# =========================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kogito-jobs-service
  namespace: drools
  labels:
    app: kogito-jobs-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kogito-jobs-service
  template:
    metadata:
      labels:
        app: kogito-jobs-service
    spec:
      serviceAccountName: drools-kogito-jobs
      initContainers:
        - name: wait-for-services
          image: alpine/k8s:1.31.4
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "Waiting for core Drools services to be ready..."
              while true; do
                if kubectl get pods -n drools -l app=kie-server --field-selector=status.phase=Running 2>/dev/null | grep -q "3/3.*Running"; then
                  echo "KIE Server ready"
                  break
                fi
                sleep 10
              done
              while true; do
                if kubectl get pods -n drools -l app=kogito-decision-service --field-selector=status.phase=Running 2>/dev/null | grep -q "2/2.*Running"; then
                  echo "Decision Service ready"
                  break
                fi
                sleep 10
              done
              while true; do
                if kubectl get pods -n drools -l app=api-gateway --field-selector=status.phase=Running 2>/dev/null | grep -q "2/2.*Running"; then
                  echo "API Gateway ready"
                  break
                fi
                sleep 10
              done
              sleep 30
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits:   { cpu: "200m", memory: "256Mi" }
      containers:
      - name: kogito-jobs-service
        image: quay.io/kiegroup/kogito-jobs-service-ephemeral:1.40
        ports:
        - containerPort: 8080
        env:
        - name: QUARKUS_HTTP_PORT
          value: "8080"
        - name: QUARKUS_HTTP_HOST
          value: "0.0.0.0"
        - name: KOGITO_JOBS_SERVICE_URL
          value: "https://jobs-drools.app.suncoast.systems"
        - name: QUARKUS_LOG_LEVEL
          value: "INFO"
        - name: QUARKUS_LOG_CONSOLE_ENABLE
          value: "true"
        - name: KOGITO_PERSISTENCE_TYPE
          value: "ephemeral"
        - name: QUARKUS_SMALLRYE_OPENAPI_PATH
          value: "/q/openapi"
        - name: QUARKUS_SWAGGER_UI_ALWAYS_INCLUDE
          value: "true"
        readinessProbe:
          httpGet:
            path: /q/health/ready
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 5
        livenessProbe:
          httpGet:
            path: /q/health/live
            port: 8080
          initialDelaySeconds: 45
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"

---
apiVersion: v1
