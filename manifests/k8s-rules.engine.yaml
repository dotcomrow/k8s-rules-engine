# =========================
# Redirect CLIs (WF23 expression-filter) – Workbench & KIE Server
# =========================
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: workbench-nginx-config
  namespace: drools
data:
  nginx.conf: |
    events {
        worker_connections 1024;
    }
    http {
        upstream backend {
            server localhost:8080;
        }
        server {
            listen 9080;
            server_name _;
            
            # Root path redirects to business-central
            location = / {
                return 302 /business-central/;
            }
            
            # Proxy all other requests to the backend
            location / {
                proxy_pass http://backend;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }
        }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: workbench-redirect-cli
  namespace: drools
data:
  enable-redirect.cli: |
    embed-server --std-out=echo
    batch
    /subsystem=undertow/configuration=filter/expression-filter=redirect-root:add(expression="path('/') -> redirect('/business-central/')")
    /subsystem=undertow/configuration=filter/expression-filter=deny-basic-noncontroller:add(expression="not path-prefix('/business-central/rest/controller') and not path-prefix('/business-central/maven2') and regex(pattern='^Basic\\s', value=%{i,Authorization}) -> response-code(403)")
    /subsystem=undertow/server=default-server/host=default-host/filter-ref=redirect-root:add
    /subsystem=undertow/server=default-server/host=default-host/filter-ref=deny-basic-noncontroller:add
    /subsystem=undertow/server=default-server/http-listener=default:write-attribute(name=proxy-address-forwarding,value=true)
    /subsystem=undertow/server=default-server/host=default-host:write-attribute(name=default-response-code,value=404)
    run-batch
    stop-embedded-server
  run-cli.sh: |
    #!/usr/bin/env sh
    set -euo pipefail
    echo "📄 Copying standalone configuration into /config..."
    cp -a /opt/jboss/wildfly/standalone/configuration/* /config/
    if [ -f /shared/application-users.properties ]; then
      cp -a /shared/application-users.properties /config/application-users.properties
    fi
    if [ -f /shared/application-roles.properties ]; then
      cp -a /shared/application-roles.properties /config/application-roles.properties
    fi
    echo "🛠️  Applying redirect CLI (Workbench)..."
    /opt/jboss/wildfly/bin/jboss-cli.sh --file=/redirect/enable-redirect.cli
    echo "📦 Persisting modified standalone.xml into /config..."
    cp -a /opt/jboss/wildfly/standalone/configuration/standalone.xml /config/standalone.xml
    echo "🎯 Creating ROOT.war deployment to serve business-central directly..."
    echo "📁 Creating ROOT.war directory..."
    mkdir -p /opt/jboss/wildfly/standalone/deployments/ROOT.war/WEB-INF || { echo "❌ Failed to create ROOT.war directory"; exit 1; }
    echo "✅ ROOT.war directory created"
    cat > /opt/jboss/wildfly/standalone/deployments/ROOT.war/WEB-INF/web.xml << 'EOF'
    <?xml version="1.0" encoding="UTF-8"?>
    <web-app xmlns="http://xmlns.jcp.org/xml/ns/javaee"
             xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
             xsi:schemaLocation="http://xmlns.jcp.org/xml/ns/javaee 
             http://xmlns.jcp.org/xml/ns/javaee/web-app_3_1.xsd"
             version="3.1">
      <display-name>Root Redirect</display-name>
      <welcome-file-list>
        <welcome-file>index.html</welcome-file>
      </welcome-file-list>
    </web-app>
    EOF
    cat > /opt/jboss/wildfly/standalone/deployments/ROOT.war/index.html << 'EOF'
    <!DOCTYPE html>
    <html>
    <head>
        <title>Business Central</title>
        <meta http-equiv="refresh" content="0; url=/business-central/">
        <script>
            // Immediate JavaScript redirect as backup
            window.location.href = "/business-central/";
        </script>
    </head>
    <body>
        <p>Redirecting to <a href="/business-central/">Business Central</a>...</p>
    </body>
    </html>
    EOF
    echo "🚀 Marking ROOT.war for deployment..."
    touch /opt/jboss/wildfly/standalone/deployments/ROOT.war.dodeploy || { echo "❌ Failed to create deploy marker"; exit 1; }
    echo "✅ ROOT.war deployment configured successfully"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kieserver-redirect-cli
  namespace: drools
data:
  enable-redirect.cli: |
    embed-server --std-out=echo --server-config=standalone-full-kie-server.xml
    batch
    /subsystem=undertow/configuration=filter/expression-filter=redirect-root:add(expression="path('/') -> redirect('/kie-server/services/rest/server')")
    /subsystem=undertow/server=default-server/host=default-host/filter-ref=redirect-root:add
    run-batch
    stop-embedded-server
  run-cli.sh: |
    #!/usr/bin/env sh
    set -euo pipefail
    echo "📄 Copying standalone-full configuration into /config..."
    cp -a /opt/jboss/wildfly/standalone/configuration/* /config/
    echo "🛠️  Applying redirect CLI (KIE Server)..."
    /opt/jboss/wildfly/bin/jboss-cli.sh --file=/redirect/enable-redirect.cli
    echo "📦 Persisting modified standalone-full-kie-server.xml into /config..."
    cp -a /opt/jboss/wildfly/standalone/configuration/standalone-full-kie-server.xml /config/standalone-full-kie-server.xml
    echo "✅ Redirect configured"

# =========================
# KIE Workbench (Business Central) – Showcase image + redirect
# =========================
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kie-workbench
  namespace: drools
  labels: { app: kie-workbench }
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: kie-workbench }
  template:
    metadata:
      labels: { app: kie-workbench }
    spec:
      serviceAccountName: drools-workbench
      securityContext:
        fsGroup: 1000
      volumes:
        - name: workbench-config
          emptyDir: {}
        - name: redirect-cli
          configMap:
            name: workbench-redirect-cli
            items:
              - { key: enable-redirect.cli, path: enable-redirect.cli, mode: 0444 }
              - { key: run-cli.sh,        path: run-cli.sh,        mode: 0555 }
        - name: welcome-content
          emptyDir: {}
        - name: vault-secrets
          emptyDir: {}
        - name: wildfly-oidc
          configMap:
            name: wildfly-oidc-config
            items:
              - { key: enable-oidc.cli,    path: enable-oidc.cli,    mode: 0444 }
              - { key: configure-oidc.sh,  path: configure-oidc.sh,  mode: 0555 }
        - name: wildfly-modules
          emptyDir: {}

      initContainers:
        - name: wait-for-config-job
          image: alpine/k8s:1.31.4
          command: ["/bin/sh","-lc"]
          args:
            - |
              echo "Waiting for Job vault/drools-yugabyte-config to complete..."
              while true; do
                if ! kubectl -n vault get job drools-yugabyte-config >/dev/null 2>&1; then
                  echo "  └─ job not found yet..."; sleep 5; continue
                fi
                SUCC="$(kubectl -n vault get job drools-yugabyte-config -o jsonpath='{.status.succeeded}' 2>/dev/null || true)"; SUCC="${SUCC:-0}"
                [ "$SUCC" -ge 1 ] && break
                sleep 5
              done
        - name: vault-kie-users
          image: hashicorp/vault:1.15.4
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              export VAULT_ADDR="http://vault.vault.svc.cluster.local:8200"
              apk add --no-cache jq curl
              VAULT_TOKEN=$(vault write -field=token auth/kubernetes/login \
                role=drools \
                jwt=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token))
              export VAULT_TOKEN

              OIDC_ENV_FILE="/shared/oidc-env.sh"
              : > "$OIDC_ENV_FILE"
              # Base OIDC settings (constant)
              OIDC_AUTH_URL="https://auth.suncoast.systems"
              OIDC_REALM="internal"
              echo "export OIDC_AUTH_URL=\"$OIDC_AUTH_URL\"" >> "$OIDC_ENV_FILE"
              echo "export OIDC_REALM=\"$OIDC_REALM\"" >> "$OIDC_ENV_FILE"
              echo 'export OIDC_CONFIDENTIAL="true"' >> "$OIDC_ENV_FILE"
              echo 'export OIDC_ENABLE_BASIC_AUTH="true"' >> "$OIDC_ENV_FILE"
              echo 'export OIDC_BEARER_ONLY="false"' >> "$OIDC_ENV_FILE"
              echo "export OIDC_KIE_SERVER_AUTH_URL=\"$OIDC_AUTH_URL\"" >> "$OIDC_ENV_FILE"
              echo "export OIDC_KIE_SERVER_REALM=\"$OIDC_REALM\"" >> "$OIDC_ENV_FILE"
              echo 'export OIDC_KIE_SERVER_CONFIDENTIAL="false"' >> "$OIDC_ENV_FILE"
              echo 'export OIDC_KIE_SERVER_BEARER_ONLY="false"' >> "$OIDC_ENV_FILE"
              echo 'export OIDC_KIE_SERVER_ENABLE_BASIC_AUTH="true"' >> "$OIDC_ENV_FILE"

              REALM_JSON="$(curl -fsSL "$OIDC_AUTH_URL/realms/$OIDC_REALM")"
              OIDC_PUBLIC_KEY="$(printf '%s' "$REALM_JSON" | jq -r '.public_key // empty')"
              if [ -z "${OIDC_PUBLIC_KEY:-}" ]; then
                echo "❌ Keycloak realm public key not found"
                exit 1
              fi
              OIDC_PUBLIC_KEY_PEM="$(printf '-----BEGIN PUBLIC KEY-----\n%s\n-----END PUBLIC KEY-----' "$OIDC_PUBLIC_KEY")"
              printf 'export OIDC_JWT_PUBLIC_KEY="%s"\n' "$OIDC_PUBLIC_KEY_PEM" >> "$OIDC_ENV_FILE"

              OIDC_ID_JSON="$(vault kv get -format=json secret/keycloak-client-id-drools-workbench 2>/dev/null || true)"
              OIDC_ID="$(printf '%s' "$OIDC_ID_JSON" | jq -r '.data.data.value // .data.data.id // empty')"
              if [ -z "${OIDC_ID:-}" ]; then
                echo "❌ OIDC client id not found at secret/keycloak-client-id-drools-workbench"
                exit 1
              fi
              echo "✅ OIDC client id loaded for drools-workbench"
              echo "export OIDC_CLIENT_ID=\"$OIDC_ID\"" >> "$OIDC_ENV_FILE"

              OIDC_SECRET_JSON="$(vault kv get -format=json secret/keycloak-client-secret-drools-workbench 2>/dev/null || true)"
              OIDC_SECRET="$(printf '%s' "$OIDC_SECRET_JSON" | jq -r '.data.data.value // .data.data.secret // empty')"
              if [ -z "${OIDC_SECRET:-}" ]; then
                echo "❌ OIDC client secret not found at secret/keycloak-client-secret-drools-workbench"
                exit 1
              fi
              echo "export OIDC_CLIENT_SECRET=\"$OIDC_SECRET\"" >> "$OIDC_ENV_FILE"
              echo "✅ OIDC client secret loaded for drools-workbench"

              KIE_OIDC_ID_JSON="$(vault kv get -format=json secret/keycloak-client-id-drools-kie-server 2>/dev/null || true)"
              KIE_OIDC_ID="$(printf '%s' "$KIE_OIDC_ID_JSON" | jq -r '.data.data.value // .data.data.id // empty')"
              if [ -z "${KIE_OIDC_ID:-}" ]; then
                echo "❌ OIDC client id not found at secret/keycloak-client-id-drools-kie-server"
                exit 1
              fi
              echo "✅ OIDC client id loaded for drools-kie-server"
              echo "export OIDC_KIE_SERVER_CLIENT_ID=\"$KIE_OIDC_ID\"" >> "$OIDC_ENV_FILE"

              KIE_OIDC_SECRET_JSON="$(vault kv get -format=json secret/keycloak-client-secret-drools-kie-server 2>/dev/null || true)"
              KIE_OIDC_SECRET="$(printf '%s' "$KIE_OIDC_SECRET_JSON" | jq -r '.data.data.value // .data.data.secret // empty')"
              if [ -z "${KIE_OIDC_SECRET:-}" ]; then
                echo "❌ OIDC client secret not found at secret/keycloak-client-secret-drools-kie-server"
                exit 1
              fi
              echo "export OIDC_KIE_SERVER_CLIENT_SECRET=\"$KIE_OIDC_SECRET\"" >> "$OIDC_ENV_FILE"
              echo "✅ OIDC client secret loaded for drools-kie-server"

              KIE_ENV_FILE="/shared/kie-users-env.sh"
              : > "$KIE_ENV_FILE"
              ADMIN_JSON="$(vault kv get -format=json secret/drools/admin 2>/dev/null || true)"
              ADMIN_USER="$(printf '%s' "$ADMIN_JSON" | jq -r '.data.data.username // empty')"
              ADMIN_PASS="$(printf '%s' "$ADMIN_JSON" | jq -r '.data.data.password // empty')"
              KIE_USER_JSON="$(vault kv get -format=json secret/drools/kie-user 2>/dev/null || true)"
              KIE_USER="$(printf '%s' "$KIE_USER_JSON" | jq -r '.data.data.username // empty')"
              KIE_PASS="$(printf '%s' "$KIE_USER_JSON" | jq -r '.data.data.password // empty')"
              if [ -z "${ADMIN_USER:-}" ] || [ -z "${ADMIN_PASS:-}" ] || [ -z "${KIE_USER:-}" ] || [ -z "${KIE_PASS:-}" ]; then
                echo "Missing drools admin/kie-user creds in Vault"
                exit 1
              fi
              {
                echo "export KIE_SERVER_CONTROLLER_USER=\"$ADMIN_USER\""
                echo "export KIE_SERVER_CONTROLLER_PWD=\"$ADMIN_PASS\""
                echo "export KIE_SERVER_USER=\"$KIE_USER\""
                echo "export KIE_SERVER_PWD=\"$KIE_PASS\""
              } > "$KIE_ENV_FILE"
          volumeMounts:
            - name: vault-secrets
              mountPath: /shared
        - name: vault-db-creds
          image: hashicorp/vault:1.15.4
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              export VAULT_ADDR="http://vault.vault.svc.cluster.local:8200"
              apk add --no-cache jq curl
              # Authenticate with Kubernetes auth
              VAULT_TOKEN=$(vault write -field=token auth/kubernetes/login \
                role=drools \
                jwt=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token))
              export VAULT_TOKEN
              
              echo "🔑 Fetching database credentials from Vault..."
              vault read -format=json yugabyte-db/static-creds/drools-app > /shared/db-creds.json
              
              # Extract credentials and create environment file
              DB_USERNAME=$(cat /shared/db-creds.json | jq -r '.data.username')
              DB_PASSWORD=$(cat /shared/db-creds.json | jq -r '.data.password')
              
              echo "export KIE_CONNECTION_USERNAME=\"$DB_USERNAME\"" > /shared/db-env.sh
              echo "export KIE_CONNECTION_PASSWORD=\"$DB_PASSWORD\"" >> /shared/db-env.sh
              
              echo "✅ Database credentials retrieved: user=$DB_USERNAME"

              OIDC_ENV_FILE="/shared/oidc-env.sh"
              : > "$OIDC_ENV_FILE"
              # Base OIDC settings (constant)
              OIDC_AUTH_URL="https://auth.suncoast.systems"
              OIDC_REALM="internal"
              echo "export OIDC_AUTH_URL=\"$OIDC_AUTH_URL\"" >> "$OIDC_ENV_FILE"
              echo "export OIDC_REALM=\"$OIDC_REALM\"" >> "$OIDC_ENV_FILE"
              echo 'export OIDC_CONFIDENTIAL="true"' >> "$OIDC_ENV_FILE"
              echo 'export OIDC_ENABLE_BASIC_AUTH="true"' >> "$OIDC_ENV_FILE"
              echo 'export OIDC_BEARER_ONLY="false"' >> "$OIDC_ENV_FILE"
              echo "export OIDC_KIE_SERVER_AUTH_URL=\"$OIDC_AUTH_URL\"" >> "$OIDC_ENV_FILE"
              echo "export OIDC_KIE_SERVER_REALM=\"$OIDC_REALM\"" >> "$OIDC_ENV_FILE"
              echo 'export OIDC_KIE_SERVER_CONFIDENTIAL="false"' >> "$OIDC_ENV_FILE"
              echo 'export OIDC_KIE_SERVER_BEARER_ONLY="false"' >> "$OIDC_ENV_FILE"
              echo 'export OIDC_KIE_SERVER_ENABLE_BASIC_AUTH="true"' >> "$OIDC_ENV_FILE"

              REALM_JSON="$(curl -fsSL "$OIDC_AUTH_URL/realms/$OIDC_REALM")"
              OIDC_PUBLIC_KEY="$(printf '%s' "$REALM_JSON" | jq -r '.public_key // empty')"
              if [ -z "${OIDC_PUBLIC_KEY:-}" ]; then
                echo "❌ Keycloak realm public key not found"
                exit 1
              fi
              OIDC_PUBLIC_KEY_PEM="$(printf '-----BEGIN PUBLIC KEY-----\n%s\n-----END PUBLIC KEY-----' "$OIDC_PUBLIC_KEY")"
              printf 'export OIDC_JWT_PUBLIC_KEY="%s"\n' "$OIDC_PUBLIC_KEY_PEM" >> "$OIDC_ENV_FILE"

              OIDC_ID_JSON="$(vault kv get -format=json secret/keycloak-client-id-drools-workbench 2>/dev/null || true)"
              OIDC_ID="$(printf '%s' "$OIDC_ID_JSON" | jq -r '.data.data.value // .data.data.id // empty')"
              if [ -z "${OIDC_ID:-}" ]; then
                echo "❌ OIDC client id not found at secret/keycloak-client-id-drools-workbench"
                exit 1
              fi
              echo "✅ OIDC client id loaded for drools-workbench"
              echo "export OIDC_CLIENT_ID=\"$OIDC_ID\"" >> "$OIDC_ENV_FILE"

              OIDC_SECRET_JSON="$(vault kv get -format=json secret/keycloak-client-secret-drools-workbench 2>/dev/null || true)"
              OIDC_SECRET="$(printf '%s' "$OIDC_SECRET_JSON" | jq -r '.data.data.value // .data.data.secret // empty')"
              if [ -z "${OIDC_SECRET:-}" ]; then
                echo "❌ OIDC client secret not found at secret/keycloak-client-secret-drools-workbench"
                exit 1
              fi
              echo "export OIDC_CLIENT_SECRET=\"$OIDC_SECRET\"" >> "$OIDC_ENV_FILE"
              echo "✅ OIDC client secret loaded for drools-workbench"

              KIE_OIDC_ID_JSON="$(vault kv get -format=json secret/keycloak-client-id-drools-kie-server 2>/dev/null || true)"
              KIE_OIDC_ID="$(printf '%s' "$KIE_OIDC_ID_JSON" | jq -r '.data.data.value // .data.data.id // empty')"
              if [ -z "${KIE_OIDC_ID:-}" ]; then
                echo "❌ OIDC client id not found at secret/keycloak-client-id-drools-kie-server"
                exit 1
              fi
              echo "✅ OIDC client id loaded for drools-kie-server"
              echo "export OIDC_KIE_SERVER_CLIENT_ID=\"$KIE_OIDC_ID\"" >> "$OIDC_ENV_FILE"

              KIE_OIDC_SECRET_JSON="$(vault kv get -format=json secret/keycloak-client-secret-drools-kie-server 2>/dev/null || true)"
              KIE_OIDC_SECRET="$(printf '%s' "$KIE_OIDC_SECRET_JSON" | jq -r '.data.data.value // .data.data.secret // empty')"
              if [ -z "${KIE_OIDC_SECRET:-}" ]; then
                echo "❌ OIDC client secret not found at secret/keycloak-client-secret-drools-kie-server"
                exit 1
              fi
              echo "export OIDC_KIE_SERVER_CLIENT_SECRET=\"$KIE_OIDC_SECRET\"" >> "$OIDC_ENV_FILE"
              echo "✅ OIDC client secret loaded for drools-kie-server"

              # Seed Workbench local users for Basic auth (controller sync)
              ADMIN_JSON="$(vault kv get -format=json secret/drools/admin 2>/dev/null || true)"
              ADMIN_USER="$(printf '%s' "$ADMIN_JSON" | jq -r '.data.data.username // empty')"
              ADMIN_PASS="$(printf '%s' "$ADMIN_JSON" | jq -r '.data.data.password // empty')"
              KIE_USER_JSON="$(vault kv get -format=json secret/drools/kie-user 2>/dev/null || true)"
              KIE_USER="$(printf '%s' "$KIE_USER_JSON" | jq -r '.data.data.username // empty')"
              KIE_PASS="$(printf '%s' "$KIE_USER_JSON" | jq -r '.data.data.password // empty')"
              if [ -z "${ADMIN_USER:-}" ] || [ -z "${ADMIN_PASS:-}" ] || [ -z "${KIE_USER:-}" ] || [ -z "${KIE_PASS:-}" ]; then
                echo "❌ Missing drools admin/kie-user creds in Vault"
                exit 1
              fi
              REALM="ApplicationRealm"
              ADMIN_HASH="$(printf '%s:%s:%s' "$ADMIN_USER" "$REALM" "$ADMIN_PASS" | md5sum | awk '{print $1}')"
              KIE_HASH="$(printf '%s:%s:%s' "$KIE_USER" "$REALM" "$KIE_PASS" | md5sum | awk '{print $1}')"
              USERS_FILE="/shared/application-users.properties"
              ROLES_FILE="/shared/application-roles.properties"
              printf '%s=%s\n' "$ADMIN_USER" "$ADMIN_HASH" > "$USERS_FILE"
              printf '%s=%s\n' "$KIE_USER" "$KIE_HASH" >> "$USERS_FILE"
              printf '%s=%s\n' "$ADMIN_USER" "admin,rest-all,developer,analyst,manager,user,kie-server" > "$ROLES_FILE"
              printf '%s=%s\n' "$KIE_USER" "kie-server,rest-all" >> "$ROLES_FILE"
              echo "✅ Workbench application users/roles seeded"
          volumeMounts:
            - name: vault-secrets
              mountPath: /shared
        - name: configure-root-redirect
          image: quay.io/kiegroup/business-central-workbench-showcase:latest
          command: ["/bin/sh","-c"]
          args: ["/redirect/run-cli.sh"]
          volumeMounts:
            - { name: workbench-config, mountPath: /config }
            - { name: redirect-cli,     mountPath: /redirect }
            - { name: vault-secrets,    mountPath: /shared }
        - name: copy-wildfly-modules
          image: quay.io/kiegroup/business-central-workbench-showcase:latest
          command: ["/bin/sh","-c"]
          args:
            - |
              set -euo pipefail
              cp -R /opt/jboss/wildfly/modules/. /target/
              echo "✅ WildFly modules copied"
          volumeMounts:
            - { name: wildfly-modules, mountPath: /target }
        - name: install-keycloak-adapter
          image: alpine:3.20
          command: ["/bin/sh","-c"]
          env:
            - name: KEYCLOAK_ADAPTER_URL
              value: "https://repo1.maven.org/maven2/org/keycloak/keycloak-wildfly-adapter-dist/24.0.5/keycloak-wildfly-adapter-dist-24.0.5.zip"
          args:
            - |
              set -euo pipefail
              apk add --no-cache curl unzip
              WORK="/tmp/keycloak"
              mkdir -p "$WORK"
              echo "⬇️  Downloading Keycloak WildFly adapter..."
              curl -fsSL "$KEYCLOAK_ADAPTER_URL" -o "$WORK/adapter.zip"
              unzip -q "$WORK/adapter.zip" -d "$WORK"
              ADAPTER_DIR="$(find "$WORK" -maxdepth 1 -type d -name "keycloak-wildfly-adapter-dist*" | head -n1)"
              if [ -z "$ADAPTER_DIR" ] || [ ! -d "$ADAPTER_DIR/modules" ]; then
                if [ -d "$WORK/modules" ]; then
                  ADAPTER_DIR="$WORK"
                else
                  echo "❌ Keycloak adapter modules not found in distribution."
                  find "$WORK" -maxdepth 2 -type d -name "modules" -print || true
                  exit 1
                fi
              fi
              cp -R "$ADAPTER_DIR/modules/." /target/
              if [ -d /target/system/add-ons/keycloak/org/keycloak ]; then
                mkdir -p /target/system/layers/base/org
                cp -R /target/system/add-ons/keycloak/org/keycloak /target/system/layers/base/org/
              fi
              echo "✅ Keycloak adapter modules installed"
          volumeMounts:
            - { name: wildfly-modules, mountPath: /target }
        - name: configure-oidc
          image: quay.io/kiegroup/business-central-workbench-showcase:latest
          command: ["/bin/sh","-c"]
          args:
            - |
              set -e
              sh /oidc/configure-oidc.sh
          env:
            - { name: OIDC_ENABLE, value: "true" }
          volumeMounts:
            - { name: workbench-config, mountPath: /opt/jboss/wildfly/standalone/configuration }
            - { name: wildfly-oidc, mountPath: /oidc }
            - { name: vault-secrets, mountPath: /vault-secrets }
            - { name: wildfly-modules, mountPath: /opt/jboss/wildfly/modules }
        - name: setup-redirect-fallback
          image: quay.io/kiegroup/business-central-workbench-showcase:latest
          command: ["/bin/sh", "-c"]
          args:
            - |
              rm -rf /opt/jboss/wildfly/welcome-content/*
              cat > /opt/jboss/wildfly/welcome-content/index.html << 'EOF'
              <!DOCTYPE html><meta http-equiv="refresh" content="0; url=/business-central/">
              <title>Redirecting…</title><a href="/business-central/">Continue</a>
              EOF
          volumeMounts:
            - { name: welcome-content, mountPath: /opt/jboss/wildfly/welcome-content }
      containers:
        - name: kie-workbench
          image: quay.io/kiegroup/business-central-workbench-showcase:latest
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -e
              echo "🔑 Loading database credentials from Vault..."
              if [ -f /vault-secrets/db-env.sh ]; then
                source /vault-secrets/db-env.sh
                echo "✅ Database credentials loaded for user: $KIE_CONNECTION_USERNAME"
                export KIE_CONNECTION_USERNAME
                export KIE_CONNECTION_PASSWORD
              else
                echo "❌ Database credentials not found!"
                exit 1
              fi

              if [ -f /vault-secrets/oidc-env.sh ]; then
                # shellcheck disable=SC1091
                . /vault-secrets/oidc-env.sh
              fi

              if [ -f /vault-secrets/kie-users-env.sh ]; then
                # shellcheck disable=SC1091
                . /vault-secrets/kie-users-env.sh
                if [ -n "${KIE_SERVER_USER:-}" ] && [ -n "${KIE_SERVER_PWD:-}" ]; then
                  JAVA_OPTS="$JAVA_OPTS -Dorg.kie.server.user=${KIE_SERVER_USER} -Dorg.kie.server.pwd=${KIE_SERVER_PWD}"
                  export JAVA_OPTS
                fi
              fi
              
              echo "🚀 Starting KIE Workbench..."
              exec /opt/jboss/wildfly/bin/standalone.sh -b 0.0.0.0 -bmanagement 0.0.0.0
          ports:
            - { name: http,  containerPort: 8080 }
            - { name: debug, containerPort: 8001 }
            - { name: git,   containerPort: 9418 }
          env:
            - name: JAVA_OPTS
              value: >-
                -Xms512m -Xmx2048m -Dorg.kie.workbench.profile=FULL
                -Dorg.uberfire.nio.git.daemon.host=0.0.0.0
                -Djboss.bind.address=0.0.0.0
                -Djboss.bind.address.management=0.0.0.0
                -Dorg.kie.server.location=https://workbench-drools.teleport.app.suncoast.systems/business-central/
                -Djboss.http.proxy.scheme=https
                -Djboss.http.proxy.port=443
                -Djboss.http.proxy.proxyName=workbench-drools.teleport.app.suncoast.systems
                -Dorg.jboss.as.logging.per-deployment=false
                -Dorg.kie.security.useSSO=true
                -Dorg.uberfire.ext.security.management.keycloak.enabled=true
                -Dorg.uberfire.ext.security.management.keycloak.authServer=https://auth.suncoast.systems
                -Dorg.uberfire.ext.security.management.keycloak.use-resource-role-mappings=true
            - name: JAVA_OPTS_APPEND
              value: >-
                -Djboss.logging.level.org.keycloak.adapters=DEBUG
                -Djboss.logging.level.org.keycloak.adapters.OAuthRequestAuthenticator=DEBUG
                -Djboss.logging.level.org.keycloak=DEBUG
            - name: KIE_CONNECTION_URL
              value: "jdbc:postgresql://yb-tserver-service.yugabyte.svc.cluster.local:5433/drools?currentSchema=drools"
            - name: KIE_CONNECTION_DRIVER_CLASS
              value: "org.postgresql.Driver"
            - name: PROXY_ADDRESS_FORWARDING
              value: "true"
            - name: KEYCLOAK_FRONTEND_URL
              value: "https://auth.suncoast.systems"
            - name: KEYCLOAK_REDIRECT_HOSTNAME
              value: "workbench-drools.teleport.app.suncoast.systems"
            - name: KEYCLOAK_REDIRECT_PORT
              value: "443"
            - name: KEYCLOAK_REDIRECT_PATH
              value: "/business-central"
            - name: KEYCLOAK_REDIRECT_PATH_KIE_SERVER
              value: "/business-central/rest/controller/server/kie-server"
          volumeMounts:
            - { name: workbench-config,  mountPath: /opt/jboss/wildfly/standalone/configuration }
            - { name: welcome-content,   mountPath: /opt/jboss/wildfly/welcome-content }
            - { name: vault-secrets,     mountPath: /vault-secrets }
            - { name: wildfly-modules,   mountPath: /opt/jboss/wildfly/modules }
          readinessProbe:
            tcpSocket: { port: 8080 }
            initialDelaySeconds: 180
            periodSeconds: 30
            timeoutSeconds: 30
            failureThreshold: 10
          livenessProbe:
            tcpSocket: { port: 8080 }
            initialDelaySeconds: 300
            periodSeconds: 60
            timeoutSeconds: 30
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: kie-workbench
  namespace: drools
  annotations:
    teleport.dev/name: "drools-workbench"
    teleport.dev/protocol: "http"
    teleport.dev/public-addr: "workbench-drools.teleport.app.suncoast.systems"
    teleport.dev/description: "KIE Workbench - Business rules authoring and management interface"
    teleport.dev/port: "8080"
  labels:
    app.kubernetes.io/name: kie-workbench
    app.kubernetes.io/component: authoring
    teleport.dev/app: "drools-workbench"
    teleport.dev/enroll: "true"
spec:
  selector:
    app: kie-workbench
  ports:
    - { name: http, port: 8080, targetPort: 8080, protocol: TCP }
    - { name: git,  port: 9418, targetPort: 9418, protocol: TCP }
  type: ClusterIP

# =========================
# KIE Server – Showcase image + redirect
# =========================
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kie-server
  namespace: drools
  labels: { app: kie-server }
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 2
  selector:
    matchLabels: { app: kie-server }
  template:
    metadata:
      labels: { app: kie-server }
    spec:
      serviceAccountName: drools-kie-server
      volumes:
        - name: kieserver-config
          emptyDir: {}
        - name: redirect-cli
          configMap:
            name: kieserver-redirect-cli
            items:
              - { key: enable-redirect.cli, path: enable-redirect.cli, mode: 0444 }
              - { key: run-cli.sh,        path: run-cli.sh,        mode: 0555 }
        - name: welcome-content
          emptyDir: {}
        - name: vault-secrets
          emptyDir: {}
        - name: wildfly-oidc
          configMap:
            name: wildfly-oidc-config-kieserver
            items:
              - { key: enable-oidc.cli,    path: enable-oidc.cli,    mode: 0444 }
              - { key: configure-oidc.sh,  path: configure-oidc.sh,  mode: 0555 }
        - name: wildfly-modules
          emptyDir: {}
      initContainers:
        - name: wait-for-config-job
          image: alpine/k8s:1.31.4
          command: ["/bin/sh","-lc"]
          args:
            - |
              echo "Waiting for Job vault/drools-yugabyte-config to complete..."
              while true; do
                if ! kubectl -n vault get job drools-yugabyte-config >/dev/null 2>&1; then
                  echo "  └─ job not found yet..."; sleep 5; continue
                fi
                SUCC="$(kubectl -n vault get job drools-yugabyte-config -o jsonpath='{.status.succeeded}' 2>/dev/null || true)"; SUCC="${SUCC:-0}"
                [ "$SUCC" -ge 1 ] && break
                sleep 5
              done
        - name: vault-kie-users
          image: hashicorp/vault:1.15.4
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              export VAULT_ADDR="http://vault.vault.svc.cluster.local:8200"
              apk add --no-cache jq curl
              VAULT_TOKEN=$(vault write -field=token auth/kubernetes/login \
                role=drools \
                jwt=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token))
              export VAULT_TOKEN

              OIDC_ENV_FILE="/shared/oidc-env.sh"
              : > "$OIDC_ENV_FILE"
              OIDC_AUTH_URL="https://auth.suncoast.systems"
              OIDC_REALM="internal"
              echo "export OIDC_AUTH_URL=\"$OIDC_AUTH_URL\"" >> "$OIDC_ENV_FILE"
              echo "export OIDC_REALM=\"$OIDC_REALM\"" >> "$OIDC_ENV_FILE"
              echo 'export OIDC_ENABLE_BASIC_AUTH="true"' >> "$OIDC_ENV_FILE"
              echo 'export OIDC_BEARER_ONLY="false"' >> "$OIDC_ENV_FILE"
              echo "export OIDC_KIE_SERVER_AUTH_URL=\"$OIDC_AUTH_URL\"" >> "$OIDC_ENV_FILE"
              echo "export OIDC_KIE_SERVER_REALM=\"$OIDC_REALM\"" >> "$OIDC_ENV_FILE"
              echo 'export OIDC_KIE_SERVER_ENABLE_BASIC_AUTH="true"' >> "$OIDC_ENV_FILE"
              echo 'export OIDC_KIE_SERVER_BEARER_ONLY="false"' >> "$OIDC_ENV_FILE"

              REALM_JSON="$(curl -fsSL "$OIDC_AUTH_URL/realms/$OIDC_REALM")"
              OIDC_PUBLIC_KEY="$(printf '%s' "$REALM_JSON" | jq -r '.public_key // empty')"
              if [ -z "${OIDC_PUBLIC_KEY:-}" ]; then
                echo "❌ Keycloak realm public key not found"
                exit 1
              fi
              OIDC_PUBLIC_KEY_PEM="$(printf '-----BEGIN PUBLIC KEY-----\n%s\n-----END PUBLIC KEY-----' "$OIDC_PUBLIC_KEY")"
              printf 'export OIDC_JWT_PUBLIC_KEY="%s"\n' "$OIDC_PUBLIC_KEY_PEM" >> "$OIDC_ENV_FILE"

              WB_ID_JSON="$(vault kv get -format=json secret/keycloak-client-id-drools-workbench 2>/dev/null || true)"
              WB_ID="$(printf '%s' "$WB_ID_JSON" | jq -r '.data.data.value // .data.data.id // empty')"
              if [ -z "${WB_ID:-}" ]; then
                echo "❌ OIDC client id not found at secret/keycloak-client-id-drools-workbench"
                exit 1
              fi
              echo "export OIDC_CLIENT_ID=\"$WB_ID\"" >> "$OIDC_ENV_FILE"

              WB_SECRET_JSON="$(vault kv get -format=json secret/keycloak-client-secret-drools-workbench 2>/dev/null || true)"
              WB_SECRET="$(printf '%s' "$WB_SECRET_JSON" | jq -r '.data.data.value // .data.data.secret // empty')"
              if [ -z "${WB_SECRET:-}" ]; then
                echo "❌ OIDC client secret not found at secret/keycloak-client-secret-drools-workbench"
                exit 1
              fi
              echo "export OIDC_CLIENT_SECRET=\"$WB_SECRET\"" >> "$OIDC_ENV_FILE"

              KIE_OIDC_ID_JSON="$(vault kv get -format=json secret/keycloak-client-id-drools-kie-server 2>/dev/null || true)"
              KIE_OIDC_ID="$(printf '%s' "$KIE_OIDC_ID_JSON" | jq -r '.data.data.value // .data.data.id // empty')"
              if [ -z "${KIE_OIDC_ID:-}" ]; then
                echo "❌ OIDC client id not found at secret/keycloak-client-id-drools-kie-server"
                exit 1
              fi
              echo "export OIDC_KIE_SERVER_CLIENT_ID=\"$KIE_OIDC_ID\"" >> "$OIDC_ENV_FILE"

              KIE_OIDC_SECRET_JSON="$(vault kv get -format=json secret/keycloak-client-secret-drools-kie-server 2>/dev/null || true)"
              KIE_OIDC_SECRET="$(printf '%s' "$KIE_OIDC_SECRET_JSON" | jq -r '.data.data.value // .data.data.secret // empty')"
              if [ -z "${KIE_OIDC_SECRET:-}" ]; then
                echo "❌ OIDC client secret not found at secret/keycloak-client-secret-drools-kie-server"
                exit 1
              fi
              echo "export OIDC_KIE_SERVER_CLIENT_SECRET=\"$KIE_OIDC_SECRET\"" >> "$OIDC_ENV_FILE"

              KIE_ENV_FILE="/shared/kie-users-env.sh"
              : > "$KIE_ENV_FILE"
              ADMIN_JSON="$(vault kv get -format=json secret/drools/admin 2>/dev/null || true)"
              ADMIN_USER="$(printf '%s' "$ADMIN_JSON" | jq -r '.data.data.username // empty')"
              ADMIN_PASS="$(printf '%s' "$ADMIN_JSON" | jq -r '.data.data.password // empty')"
              KIE_USER_JSON="$(vault kv get -format=json secret/drools/kie-user 2>/dev/null || true)"
              KIE_USER="$(printf '%s' "$KIE_USER_JSON" | jq -r '.data.data.username // empty')"
              KIE_PASS="$(printf '%s' "$KIE_USER_JSON" | jq -r '.data.data.password // empty')"
              if [ -z "${ADMIN_USER:-}" ] || [ -z "${ADMIN_PASS:-}" ] || [ -z "${KIE_USER:-}" ] || [ -z "${KIE_PASS:-}" ]; then
                echo "Missing drools admin/kie-user creds in Vault"
                exit 1
              fi
              {
                echo "export KIE_SERVER_CONTROLLER_USER=\"$ADMIN_USER\""
                echo "export KIE_SERVER_CONTROLLER_PWD=\"$ADMIN_PASS\""
                echo "export KIE_SERVER_USER=\"$KIE_USER\""
                echo "export KIE_SERVER_PWD=\"$KIE_PASS\""
              } > "$KIE_ENV_FILE"
          volumeMounts:
            - name: vault-secrets
              mountPath: /shared
        - name: configure-root-redirect
          image: quay.io/kiegroup/kie-server-showcase:latest
          command: ["/bin/sh","-c"]
          args: ["/redirect/run-cli.sh"]
          volumeMounts:
            - { name: kieserver-config, mountPath: /config }
            - { name: redirect-cli,     mountPath: /redirect }
        - name: copy-wildfly-modules
          image: quay.io/kiegroup/kie-server-showcase:latest
          command: ["/bin/sh","-c"]
          args:
            - |
              set -euo pipefail
              cp -R /opt/jboss/wildfly/modules/. /target/
              echo "✅ WildFly modules copied"
          volumeMounts:
            - { name: wildfly-modules, mountPath: /target }
        - name: install-keycloak-adapter
          image: alpine:3.20
          command: ["/bin/sh","-c"]
          env:
            - name: KEYCLOAK_ADAPTER_URL
              value: "https://repo1.maven.org/maven2/org/keycloak/keycloak-wildfly-adapter-dist/16.1.1/keycloak-wildfly-adapter-dist-16.1.1.zip"
          args:
            - |
              set -euo pipefail
              apk add --no-cache curl unzip
              WORK="/tmp/keycloak"
              mkdir -p "$WORK"
              echo "⬇️  Downloading Keycloak WildFly adapter..."
              curl -fsSL "$KEYCLOAK_ADAPTER_URL" -o "$WORK/adapter.zip"
              unzip -q "$WORK/adapter.zip" -d "$WORK"
              ADAPTER_DIR="$(find "$WORK" -maxdepth 1 -type d -name "keycloak-wildfly-adapter-dist*" | head -n1)"
              if [ -z "$ADAPTER_DIR" ] || [ ! -d "$ADAPTER_DIR/modules" ]; then
                if [ -d "$WORK/modules" ]; then
                  ADAPTER_DIR="$WORK"
                else
                  echo "❌ Keycloak adapter modules not found in distribution."
                  find "$WORK" -maxdepth 2 -type d -name "modules" -print || true
                  exit 1
                fi
              fi
              cp -R "$ADAPTER_DIR/modules/." /target/
              if [ -d /target/system/add-ons/keycloak/org/keycloak ]; then
                mkdir -p /target/system/layers/base/org
                cp -R /target/system/add-ons/keycloak/org/keycloak /target/system/layers/base/org/
              fi
              echo "✅ Keycloak adapter modules installed"
          volumeMounts:
            - { name: wildfly-modules, mountPath: /target }
        - name: configure-oidc
          image: quay.io/kiegroup/kie-server-showcase:latest
          command: ["/bin/sh","-c"]
          args:
            - |
              set -e
              sh /oidc/configure-oidc.sh
          env:
            - { name: OIDC_ENABLE,           value: "true" }
            - { name: WILDFLY_SERVER_CONFIG, value: "standalone-full-kie-server.xml" }
          volumeMounts:
            - { name: kieserver-config, mountPath: /opt/jboss/wildfly/standalone/configuration }
            - { name: wildfly-oidc, mountPath: /oidc }
            - { name: vault-secrets, mountPath: /vault-secrets }
            - { name: wildfly-modules, mountPath: /opt/jboss/wildfly/modules }
        - name: setup-redirect-fallback
          image: quay.io/kiegroup/kie-server-showcase:latest
          command: ["/bin/sh", "-c"]
          args:
            - |
              rm -rf /opt/jboss/wildfly/welcome-content/*
              cat > /opt/jboss/wildfly/welcome-content/index.html << 'EOF'
              <!DOCTYPE html><meta http-equiv="refresh" content="0; url=/kie-server/services/rest/server">
              <title>Redirecting…</title><a href="/kie-server/services/rest/server">Continue</a>
              EOF
          volumeMounts:
            - { name: welcome-content, mountPath: /opt/jboss/wildfly/welcome-content }
      containers:
        - name: kie-server
          image: quay.io/kiegroup/kie-server-showcase:latest
          command: ["/bin/sh", "-c"]
          args:
            - |
              if [ -f /vault-secrets/kie-users-env.sh ]; then
                # shellcheck disable=SC1091
                . /vault-secrets/kie-users-env.sh
              else
                echo "KIE server credentials file not found at /vault-secrets/kie-users-env.sh"
                exit 1
              fi
              if [ -f /vault-secrets/oidc-env.sh ]; then
                # shellcheck disable=SC1091
                . /vault-secrets/oidc-env.sh
              fi
              exec /opt/jboss/wildfly/bin/standalone.sh -b 0.0.0.0 \
                -Dorg.kie.server.id="${KIE_SERVER_ID}" \
                -Dorg.kie.server.user="${KIE_SERVER_USER}" \
                -Dorg.kie.server.pwd="${KIE_SERVER_PWD}" \
                -Dorg.kie.server.location="${KIE_SERVER_LOCATION}" \
                -Dorg.kie.server.controller="${KIE_SERVER_CONTROLLER}" \
                -Dorg.kie.server.controller.user="${KIE_SERVER_CONTROLLER_USER}" \
                -Dorg.kie.server.controller.pwd="${KIE_SERVER_CONTROLLER_PWD}" \
                -c standalone-full-kie-server.xml
          ports:
            - { containerPort: 8080 }
          env:
            - { name: JAVA_OPTS,           value: "-Xms256m -Xmx1024m -Djboss.bind.address=0.0.0.0 -Djboss.bind.address.management=0.0.0.0" }
            - { name: KIE_SERVER_ID,       value: "kie-server" }
            - { name: KIE_SERVER_LOCATION, value: "http://kie-server.drools.svc.cluster.local:8080/kie-server/services/rest/server" }
            - { name: KIE_SERVER_CONTROLLER, value: "http://kie-workbench.drools.svc.cluster.local:8080/business-central/rest/controller" }
            - { name: KIE_MAVEN_REPO,     value: "http://kie-workbench.drools.svc.cluster.local:8080/business-central/maven2" }
            - { name: KIE_SERVER_EXTENSIONS, value: "BRM,DMN,BPM,CaseMgmt,Planner" }
          volumeMounts:
            - { name: kieserver-config,  mountPath: /opt/jboss/wildfly/standalone/configuration }
            - { name: welcome-content,   mountPath: /opt/jboss/wildfly/welcome-content }
            - { name: vault-secrets,     mountPath: /vault-secrets }
            - { name: wildfly-modules,   mountPath: /opt/jboss/wildfly/modules }
          readinessProbe:
            tcpSocket: { port: 8080 }
            initialDelaySeconds: 120
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket: { port: 8080 }
            initialDelaySeconds: 180
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5

