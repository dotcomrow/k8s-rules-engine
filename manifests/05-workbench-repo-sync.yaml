---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: workbench-repo-sync
  namespace: drools
spec:
  schedule: "*/10 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels: { app: workbench-repo-sync }
          annotations:
            linkerd.io/inject: disabled
        spec:
          serviceAccountName: drools-workbench
          restartPolicy: Never
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app: kie-workbench
                  topologyKey: kubernetes.io/hostname
          containers:
            - name: sync-niogit
              image: alpine/git:2.47.2
              command: ["/bin/sh","-c"]
              env:
                - name: VAULT_ADDR
                  value: "http://vault.vault.svc.cluster.local:8200"
                - name: REPOS_ROOT
                  value: "/niogit/.niogit"
                - name: SPACES
                  value: "rules"
                - name: SYNC_BRANCH
                  value: "prod"
              args:
                - |
                  set -euo pipefail
                  apk add --no-cache curl jq ca-certificates >/dev/null

                  SA_JWT="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
                  LOGIN_PAYLOAD="$(printf '{"role":"drools","jwt":"%s"}' "$SA_JWT")"
                  VAULT_TOKEN="$(curl -fsSL -H 'Content-Type: application/json' --data "$LOGIN_PAYLOAD" \
                    "$VAULT_ADDR/v1/auth/kubernetes/login" | jq -r '.auth.client_token')"
                  if [ -z "${VAULT_TOKEN:-}" ] || [ "$VAULT_TOKEN" = "null" ]; then
                    echo "Vault login failed"
                    exit 1
                  fi

                  GH_USER="$(curl -fsSL -H "X-Vault-Token: $VAULT_TOKEN" \
                    "$VAULT_ADDR/v1/secret/data/k8s-rules-engine-github-packages-username" | jq -r '.data.data.value // empty')"
                  GH_TOKEN="$(curl -fsSL -H "X-Vault-Token: $VAULT_TOKEN" \
                    "$VAULT_ADDR/v1/secret/data/k8s-rules-engine-github-packages-token" | jq -r '.data.data.value // empty')"
                  if [ -z "${GH_USER:-}" ] || [ -z "${GH_TOKEN:-}" ]; then
                    echo "Missing GitHub credentials in Vault"
                    exit 1
                  fi
                  AUTH_HEADER="$(printf '%s:%s' "$GH_USER" "$GH_TOKEN" | base64 | tr -d '\n')"

                  REPOS_ROOT="${REPOS_ROOT:-/niogit/.niogit}"
                  SPACES="${SPACES:-rules}"
                  SYNC_BRANCH="${SYNC_BRANCH:-prod}"

                  if [ ! -d "$REPOS_ROOT" ]; then
                    echo "Repo root not found: $REPOS_ROOT"
                    exit 0
                  fi

                  fail=0
                  for space in $SPACES; do
                    space_dir="${REPOS_ROOT}/${space}"
                    if [ ! -d "$space_dir" ]; then
                      echo "Space not found: $space_dir"
                      continue
                    fi
                    for repo in "$space_dir"/*.git; do
                      [ -d "$repo" ] || continue
                      url="$(git --git-dir="$repo" config --get remote.origin.url || true)"
                      if [ -z "$url" ]; then
                        echo "Skipping $(basename "$repo"): no origin remote"
                        continue
                      fi
                      echo "Syncing $(basename "$repo") -> $url"
                      if ! git -c http.extraheader="AUTHORIZATION: basic $AUTH_HEADER" \
                        --git-dir="$repo" fetch --prune origin "+refs/heads/*:refs/remotes/origin/*"; then
                        echo "ERROR: fetch failed for $repo"
                        fail=1
                        continue
                      fi

                      target=""
                      for branch in "$SYNC_BRANCH" main master; do
                        if git --git-dir="$repo" show-ref --quiet "refs/remotes/origin/$branch"; then
                          target="$branch"
                          break
                        fi
                      done
                      if [ -z "$target" ]; then
                        echo "WARN: no prod/main/master branch found for $repo"
                        continue
                      fi

                      git --git-dir="$repo" update-ref "refs/heads/$target" "refs/remotes/origin/$target"
                      git --git-dir="$repo" symbolic-ref HEAD "refs/heads/$target"
                      short="$(git --git-dir="$repo" rev-parse --short "refs/heads/$target")"
                      echo "Updated $(basename "$repo") to $target @ $short"
                    done
                  done
                  exit "$fail"
              volumeMounts:
                - { name: workbench-niogit, mountPath: /niogit }
          volumes:
            - name: workbench-niogit
              persistentVolumeClaim:
                claimName: kie-workbench-niogit
