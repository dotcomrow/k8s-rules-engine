apiVersion: batch/v1
kind: Job
metadata:
  name: kie-server-controller-ensure-capabilities
  namespace: drools
  annotations:
    argocd.argoproj.io/sync-wave: "9"
    argocd.argoproj.io/sync-options: Replace=true,Force=true
spec:
  backoffLimit: 3
  template:
    metadata:
      annotations:
        linkerd.io/inject: disabled
    spec:
      restartPolicy: Never
      serviceAccountName: drools-kie-server
      containers:
        - name: ensure-capabilities
          image: hashicorp/vault:1.15.4
          command: ["/bin/sh","-c"]
          args:
            - |
              set -euo pipefail
              apk add --no-cache curl jq >/dev/null 2>&1
              export VAULT_ADDR="http://vault.vault.svc.cluster.local:8200"

              VAULT_TOKEN="$(vault write -field=token auth/kubernetes/login \
                role=drools \
                jwt=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token))"
              export VAULT_TOKEN

              resolve_host() {
                local host="$1"
                if [ -z "${host:-}" ]; then
                  return 1
                fi
                if command -v getent >/dev/null 2>&1; then
                  getent hosts "$host" >/dev/null 2>&1
                  return $?
                fi
                if command -v nslookup >/dev/null 2>&1; then
                  nslookup "$host" >/dev/null 2>&1
                  return $?
                fi
                return 1
              }

              WORKBENCH_CONTROLLER_URL="${WORKBENCH_CONTROLLER_URL:-http://kie-workbench.drools.svc.cluster.local:8080/business-central/rest/controller}"
              KIE_SERVER_ID_PREFIX="${KIE_SERVER_ID_PREFIX:-kie-server-}"

              KEYCLOAK_INTERNAL_URL="${KEYCLOAK_INTERNAL_URL:-http://keycloak.keycloak.svc.cluster.local:8080}"
              KEYCLOAK_EXTERNAL_URL="${KEYCLOAK_EXTERNAL_URL:-https://auth.suncoast.systems}"
              KEYCLOAK_BASE_URL="$KEYCLOAK_INTERNAL_URL"
              KC_HOST="$(printf '%s' "$KEYCLOAK_INTERNAL_URL" | sed -E 's#^[a-zA-Z]+://([^/:]+).*#\1#')"
              if ! resolve_host "$KC_HOST"; then
                KEYCLOAK_BASE_URL="$KEYCLOAK_EXTERNAL_URL"
              fi
              KEYCLOAK_TOKEN_URL="${KEYCLOAK_TOKEN_URL:-${KEYCLOAK_BASE_URL}/realms/internal/protocol/openid-connect/token}"

              KC_CLIENT_ID_JSON="$(vault kv get -format=json secret/keycloak-client-id-drools-workbench)"
              KC_CLIENT_ID="$(printf '%s' "$KC_CLIENT_ID_JSON" | jq -r '.data.data.value // .data.data.id // .data.data.client_id // empty')"
              KC_CLIENT_SECRET_JSON="$(vault kv get -format=json secret/keycloak-client-secret-drools-workbench)"
              KC_CLIENT_SECRET="$(printf '%s' "$KC_CLIENT_SECRET_JSON" | jq -r '.data.data.value // .data.data.secret // .data.data.password // empty')"
              if [ -z "${KC_CLIENT_ID:-}" ] || [ -z "${KC_CLIENT_SECRET:-}" ]; then
                echo "ERROR: Missing Workbench Keycloak client credentials in Vault"
                exit 1
              fi

              TOKEN_RESPONSE="$(curl -sS -w '\n%{http_code}' \
                -H "Content-Type: application/x-www-form-urlencoded" \
                --data-urlencode "grant_type=client_credentials" \
                --data-urlencode "client_id=${KC_CLIENT_ID}" \
                --data-urlencode "client_secret=${KC_CLIENT_SECRET}" \
                "$KEYCLOAK_TOKEN_URL" || true)"
              TOKEN_BODY="$(printf '%s' "$TOKEN_RESPONSE" | sed '$d')"
              TOKEN_CODE="$(printf '%s' "$TOKEN_RESPONSE" | tail -n 1)"
              if [ "$TOKEN_CODE" != "200" ]; then
                echo "ERROR: Keycloak token request failed (HTTP ${TOKEN_CODE})"
                exit 1
              fi
              TOKEN="$(printf '%s' "$TOKEN_BODY" | jq -r '.access_token // empty')"
              if [ -z "${TOKEN:-}" ]; then
                echo "ERROR: Keycloak token missing in response"
                exit 1
              fi
              AUTH_HEADER="Authorization: Bearer ${TOKEN}"

              echo "Waiting for controller server templates..."
              SERVERS_JSON=""
              for _ in $(seq 1 60); do
                SERVERS_JSON="$(curl -fsS -H "$AUTH_HEADER" -H "Accept: application/json" \
                  "${WORKBENCH_CONTROLLER_URL}/management/servers" 2>/dev/null || true)"
                if [ -n "${SERVERS_JSON:-}" ] && printf '%s' "$SERVERS_JSON" | jq -e '.["server-template"] | type=="array"' >/dev/null 2>&1; then
                  break
                fi
                sleep 5
              done
              if [ -z "${SERVERS_JSON:-}" ]; then
                echo "ERROR: Controller server list is empty/unavailable"
                exit 1
              fi

              TEMPLATE_IDS="$(printf '%s' "$SERVERS_JSON" | jq -r --arg prefix "$KIE_SERVER_ID_PREFIX" '
                .["server-template"][]?
                | .["server-id"]
                | select(type=="string" and startswith($prefix))
              ' | tr '\n' ' ')"
              if [ -z "${TEMPLATE_IDS:-}" ]; then
                echo "No matching server templates found (prefix=${KIE_SERVER_ID_PREFIX}); nothing to do."
                exit 0
              fi
              echo "Found server templates: ${TEMPLATE_IDS}"

              # These capabilities are required for Task/Process screens to work (jBPM).
              # The controller sometimes persists only RULE/PLANNING after an initial partial startup.
              ADD_CAPS='["PROCESS","CASE","DMN"]'

              for id in $TEMPLATE_IDS; do
                tmpl="$(curl -fsS -H "$AUTH_HEADER" -H "Accept: application/json" \
                  "${WORKBENCH_CONTROLLER_URL}/management/servers/${id}")"

                missing="$(printf '%s' "$tmpl" | jq -r --argjson add "$ADD_CAPS" '
                  (.capabilities // []) as $caps
                  | [ $add[] | select(. as $c | ($caps | index($c)) == null) ]
                  | length
                ')"
                if [ "${missing:-0}" = "0" ]; then
                  echo "OK: ${id} capabilities already include PROCESS/CASE/DMN"
                  continue
                fi

                updated="$(printf '%s' "$tmpl" | jq --argjson add "$ADD_CAPS" '
                  .capabilities = (.capabilities // [])
                  | reduce $add[] as $c (.;
                      if ((.capabilities | index($c)) != null) then .
                      else .capabilities += [$c]
                      end
                    )
                ')"

                code="$(curl -s -o /dev/null -w "%{http_code}" \
                  -H "$AUTH_HEADER" \
                  -H "Content-Type: application/json" \
                  -X PUT "${WORKBENCH_CONTROLLER_URL}/management/servers/${id}" \
                  -d "$updated")"
                case "$code" in
                  200|201) echo "Updated ${id} capabilities (HTTP ${code})" ;;
                  *) echo "ERROR: Failed to update ${id} capabilities (HTTP ${code})"; exit 1 ;;
                esac
              done
