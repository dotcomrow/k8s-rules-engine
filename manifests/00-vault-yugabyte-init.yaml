# =========================
# Vault and YugabyteDB Initialization Jobs
# =========================
apiVersion: batch/v1
kind: Job
metadata:
  name: copy-drools-vault-root-token
  namespace: vault
  annotations:
    argocd.argoproj.io/sync-options: Replace=true,Force=true
spec:
  backoffLimit: 0
  template:
    spec:
      serviceAccountName: default
      restartPolicy: Never
      containers:
        - name: copy-secret
          image: alpine/k8s:1.31.4
          command: ["/bin/sh","-c"]
          args:
            - |
              echo "🔁 Copying 'vault-root-token' from vault → drools..."
              kubectl get secret vault-root-token -n vault -o yaml | \
                sed 's/namespace: vault/namespace: drools/' | \
                kubectl apply -f -
              echo "✅ Secret copied successfully."
---
apiVersion: batch/v1
kind: Job
metadata:
  name: drools-yugabyte-config
  namespace: vault
  annotations:
    argocd.argoproj.io/sync-options: Replace=true,Force=true
spec:
  backoffLimit: 0
  template:
    metadata:
      annotations:
        linkerd.io/inject: "disabled"
    spec:
      restartPolicy: Never
      serviceAccountName: default
      volumes:
        - name: root-token
          secret:
            secretName: vault-root-token
        - name: vault-bin
          emptyDir: {}
      initContainers:
        - name: vault-cli
          image: hashicorp/vault:1.15.4
          command: ["/bin/sh","-c"]
          args:
            - |
              cp /bin/vault /vault-bin/vault
              chmod +x /vault-bin/vault
          volumeMounts:
            - name: vault-bin
              mountPath: /vault-bin
      containers:
        - name: setup-role
          image: postgres:15.6-alpine
          env:
            - name: RESET_SCHEMAS
              value: "false"
            - name: YSQL_SU_KV_PATH
              value: "secret/yugabyte-su"
            - name: DDL_RETRY_ATTEMPTS
              value: "5"
            - name: DDL_RETRY_SLEEP
              value: "3"
          command: ["/bin/sh","-c"]
          args:
            - |
              set -euo pipefail
              PGHOST="yb-tserver-service.yugabyte.svc.cluster.local"
              PGPORT="5433"
              ADMIN_DB="yugabyte"
              APP_DB="drools"
              VAULTADMIN_USER="vaultadmin"
              VAULTADMIN_KV_PATH="secret/vaultadmin"
              USER_ADMIN="drools_admin"
              USER_RO="drools_ro"
              SCHEMAS="drools kie_server"
              VAULT_ADDR="http://vault.vault.svc.cluster.local:8200"
              AUTH_PATH="kubernetes"
              DB_MOUNT="yugabyte-db"
              DB_NAME_IN_VAULT="yugabyte"
              ROLE_STATIC_ADMIN="drools-yb-admin"
              ROLE_STATIC_RO="drools-yb-ro"
              DDL_RETRY_ATTEMPTS="${DDL_RETRY_ATTEMPTS:-5}"
              DDL_RETRY_SLEEP="${DDL_RETRY_SLEEP:-3}"

              run_psql_with_retry() {
                desc="$1"; shift
                attempt=1
                while [ "$attempt" -le "$DDL_RETRY_ATTEMPTS" ]; do
                  set +e
                  output="$("$@" 2>&1)"
                  status=$?
                  set -e
                  if [ "$status" -eq 0 ]; then
                    [ -n "$output" ] && printf "%s\n" "$output"
                    return 0
                  fi
                  printf "%s\n" "$output" >&2
                  if printf '%s' "$output" | grep -q "Restarting a DDL transaction not supported" && [ "$attempt" -lt "$DDL_RETRY_ATTEMPTS" ]; then
                    echo "🔁 ${desc} hit Yugabyte DDL restart; retrying in ${DDL_RETRY_SLEEP}s (attempt ${attempt}/${DDL_RETRY_ATTEMPTS})"
                    sleep "$DDL_RETRY_SLEEP"
                    attempt=$((attempt + 1))
                    continue
                  fi
                  echo "❌ ${desc} failed after ${attempt} attempt(s)"
                  return "$status"
                done
              }

              export PATH="/vault-bin:$PATH"
              export VAULT_ADDR

              until [ -s /vault-token/VAULT_TOKEN ]; do echo "🔁 waiting for /vault-token/VAULT_TOKEN..."; sleep 2; done
              export VAULT_TOKEN="$(cat /vault-token/VAULT_TOKEN)"

              gen_pass() {
                # Use URL-safe characters to avoid Keycloak form decoding errors.
                tr -dc 'A-Za-z0-9._~-' </dev/urandom | head -c 32
              }

              is_urlsafe_pass() {
                printf '%s' "$1" | grep -Eq '^[A-Za-z0-9._~-]+$'
              }

              echo "🧩 Ensuring KV v2 at 'secret/'..."
              if ! vault secrets list -format=json 2>/dev/null | grep -q '"secret/"'; then
                vault secrets enable -path=secret -version=2 kv || true
              fi

              echo "🔐 Seeding drools admin + kie-user (if missing)..."
              ADMIN_PASS="$(vault kv get -field=password secret/drools/admin 2>/dev/null || true)"
              if [ -z "${ADMIN_PASS:-}" ] || ! is_urlsafe_pass "$ADMIN_PASS"; then
                echo "⚠️  drools/admin password missing or URL-unsafe; rotating"
                PASS="$(gen_pass)"
                vault kv put secret/drools/admin username=admin password="$PASS"
              fi
              KIE_PASS="$(vault kv get -field=password secret/drools/kie-user 2>/dev/null || true)"
              if [ -z "${KIE_PASS:-}" ] || ! is_urlsafe_pass "$KIE_PASS"; then
                echo "⚠️  drools/kie-user password missing or URL-unsafe; rotating"
                PASS="$(gen_pass)"
                vault kv put secret/drools/kie-user username=kieserver password="$PASS"
              fi

              until pg_isready -h "$PGHOST" -p "$PGPORT" >/dev/null 2>&1; do
                echo "⏳ waiting for DB $PGHOST:$PGPORT..."
                sleep 3
              done
              echo "✅ Yugabyte reachable"

              while true; do
                echo "🔐 Fetching ${VAULTADMIN_KV_PATH}..."
                VAULTADMIN_PASS="$(vault kv get -field=password "${VAULTADMIN_KV_PATH}" 2>/dev/null || true)"
                if [ -z "${VAULTADMIN_PASS:-}" ]; then
                  VAULTADMIN_PASS="$(vault kv get -field=value "${VAULTADMIN_KV_PATH}" 2>/dev/null || true)"
                fi
                if [ -n "${VAULTADMIN_PASS:-}" ]; then
                  break
                fi
                echo "⏳ ${VAULTADMIN_KV_PATH} not ready; retrying in 5s"
                sleep 5
              done

              export PGPASSWORD="$VAULTADMIN_PASS"

              while true; do
                ROLE_EXISTS="$(psql -h "$PGHOST" -p "$PGPORT" -U "$VAULTADMIN_USER" -d "$ADMIN_DB" -Atc "SELECT 1 FROM pg_roles WHERE rolname='${VAULTADMIN_USER}'" 2>/dev/null || true)"
                if [ "${ROLE_EXISTS}" = "1" ]; then
                  echo "✅ Role ${VAULTADMIN_USER} exists; continuing"
                  break
                fi
                echo "⏳ Waiting for role ${VAULTADMIN_USER} to exist before continuing..."
                sleep 5
              done

              DB_EXISTS="$(psql -h "$PGHOST" -p "$PGPORT" -U "$VAULTADMIN_USER" -d "$ADMIN_DB" -Atc "SELECT 1 FROM pg_database WHERE datname='${APP_DB}'" || true)"
              if [ "${DB_EXISTS}" != "1" ]; then
                echo "📦 Creating DB '${APP_DB}' owned by ${VAULTADMIN_USER}…"
                run_psql_with_retry "create database ${APP_DB}" \
                  createdb -h "$PGHOST" -p "$PGPORT" -U "$VAULTADMIN_USER" -O "$VAULTADMIN_USER" "$APP_DB"
              else
                echo "✅ DB '${APP_DB}' exists"
              fi

              if [ "${RESET_SCHEMAS}" = "true" ]; then
                echo "⚠️  RESET_SCHEMAS=true -> dropping schemas ${SCHEMAS}"
                for schema in $SCHEMAS; do
                  run_psql_with_retry "drop schema ${schema}" \
                    psql -h "$PGHOST" -p "$PGPORT" -U "$VAULTADMIN_USER" -d "$APP_DB" -v ON_ERROR_STOP=0 -c "DROP SCHEMA IF EXISTS ${schema} CASCADE;"
                done
              fi

              ADMIN_ROLE_EXISTS="$(psql -h "$PGHOST" -p "$PGPORT" -U "$VAULTADMIN_USER" -d "$APP_DB" -Atc "SELECT 1 FROM pg_roles WHERE rolname='${USER_ADMIN}'" || true)"
              if [ "${ADMIN_ROLE_EXISTS:-}" != "1" ]; then
                echo "➕ Creating role ${USER_ADMIN}"
                run_psql_with_retry "create role ${USER_ADMIN}" \
                  psql -h "$PGHOST" -p "$PGPORT" -U "$VAULTADMIN_USER" -d "$APP_DB" -v ON_ERROR_STOP=1 \
                    -c "CREATE ROLE ${USER_ADMIN} LOGIN PASSWORD 'temp-initial';"
              else
                echo "✅ Role ${USER_ADMIN} exists"
              fi

              RO_ROLE_EXISTS="$(psql -h "$PGHOST" -p "$PGPORT" -U "$VAULTADMIN_USER" -d "$APP_DB" -Atc "SELECT 1 FROM pg_roles WHERE rolname='${USER_RO}'" || true)"
              if [ "${RO_ROLE_EXISTS:-}" != "1" ]; then
                echo "➕ Creating role ${USER_RO}"
                run_psql_with_retry "create role ${USER_RO}" \
                  psql -h "$PGHOST" -p "$PGPORT" -U "$VAULTADMIN_USER" -d "$APP_DB" -v ON_ERROR_STOP=1 \
                    -c "CREATE ROLE ${USER_RO} LOGIN PASSWORD 'temp-initial';"
              else
                echo "✅ Role ${USER_RO} exists"
              fi

              run_psql_with_retry "grant ${USER_ADMIN} to ${VAULTADMIN_USER}" \
                psql -h "$PGHOST" -p "$PGPORT" -U "$VAULTADMIN_USER" -d "$APP_DB" -v ON_ERROR_STOP=1 \
                  -c "GRANT ${USER_ADMIN} TO ${VAULTADMIN_USER} WITH ADMIN OPTION;"
              run_psql_with_retry "grant ${USER_RO} to ${VAULTADMIN_USER}" \
                psql -h "$PGHOST" -p "$PGPORT" -U "$VAULTADMIN_USER" -d "$APP_DB" -v ON_ERROR_STOP=1 \
                  -c "GRANT ${USER_RO} TO ${VAULTADMIN_USER} WITH ADMIN OPTION;"

              run_psql_with_retry "grant DB privileges" \
                psql -h "$PGHOST" -p "$PGPORT" -U "$VAULTADMIN_USER" -d "$APP_DB" -v ON_ERROR_STOP=1 \
                  -c "GRANT ALL PRIVILEGES ON DATABASE ${APP_DB} TO ${VAULTADMIN_USER}, ${USER_ADMIN}, ${USER_RO};"

              for schema in $SCHEMAS; do
                run_psql_with_retry "create schema ${schema}" \
                  psql -h "$PGHOST" -p "$PGPORT" -U "$VAULTADMIN_USER" -d "$APP_DB" -v ON_ERROR_STOP=1 \
                    -c "CREATE SCHEMA IF NOT EXISTS ${schema} AUTHORIZATION ${VAULTADMIN_USER};"
                run_psql_with_retry "grant schema ${schema}" \
                  psql -h "$PGHOST" -p "$PGPORT" -U "$VAULTADMIN_USER" -d "$APP_DB" -v ON_ERROR_STOP=1 \
                    -c "GRANT USAGE, CREATE ON SCHEMA ${schema} TO ${VAULTADMIN_USER}, ${USER_ADMIN}, ${USER_RO};"
                run_psql_with_retry "grant tables ${schema}" \
                  psql -h "$PGHOST" -p "$PGPORT" -U "$VAULTADMIN_USER" -d "$APP_DB" -v ON_ERROR_STOP=0 \
                    -c "GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA ${schema} TO ${VAULTADMIN_USER}, ${USER_ADMIN}, ${USER_RO};" || true
                run_psql_with_retry "grant sequences ${schema}" \
                  psql -h "$PGHOST" -p "$PGPORT" -U "$VAULTADMIN_USER" -d "$APP_DB" -v ON_ERROR_STOP=0 \
                    -c "GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA ${schema} TO ${VAULTADMIN_USER}, ${USER_ADMIN}, ${USER_RO};" || true

                run_psql_with_retry "default privs admin ${schema}" \
                  psql -h "$PGHOST" -p "$PGPORT" -U "$VAULTADMIN_USER" -d "$APP_DB" -v ON_ERROR_STOP=1 \
                    -c "ALTER DEFAULT PRIVILEGES FOR ROLE ${VAULTADMIN_USER} IN SCHEMA ${schema} GRANT ALL PRIVILEGES ON TABLES TO ${VAULTADMIN_USER}, ${USER_ADMIN}, ${USER_RO};"
                run_psql_with_retry "default privs admin seq ${schema}" \
                  psql -h "$PGHOST" -p "$PGPORT" -U "$VAULTADMIN_USER" -d "$APP_DB" -v ON_ERROR_STOP=1 \
                    -c "ALTER DEFAULT PRIVILEGES FOR ROLE ${VAULTADMIN_USER} IN SCHEMA ${schema} GRANT USAGE, SELECT, UPDATE ON SEQUENCES TO ${VAULTADMIN_USER}, ${USER_ADMIN}, ${USER_RO};"

                run_psql_with_retry "default privs ${USER_ADMIN} ${schema}" \
                  psql -h "$PGHOST" -p "$PGPORT" -U "$VAULTADMIN_USER" -d "$APP_DB" -v ON_ERROR_STOP=1 \
                    -c "ALTER DEFAULT PRIVILEGES FOR ROLE ${USER_ADMIN} IN SCHEMA ${schema} GRANT ALL PRIVILEGES ON TABLES TO ${VAULTADMIN_USER}, ${USER_ADMIN}, ${USER_RO};"
                run_psql_with_retry "default privs ${USER_ADMIN} seq ${schema}" \
                  psql -h "$PGHOST" -p "$PGPORT" -U "$VAULTADMIN_USER" -d "$APP_DB" -v ON_ERROR_STOP=1 \
                    -c "ALTER DEFAULT PRIVILEGES FOR ROLE ${USER_ADMIN} IN SCHEMA ${schema} GRANT USAGE, SELECT, UPDATE ON SEQUENCES TO ${VAULTADMIN_USER}, ${USER_ADMIN}, ${USER_RO};"

                run_psql_with_retry "default privs ${USER_RO} ${schema}" \
                  psql -h "$PGHOST" -p "$PGPORT" -U "$VAULTADMIN_USER" -d "$APP_DB" -v ON_ERROR_STOP=1 \
                    -c "ALTER DEFAULT PRIVILEGES FOR ROLE ${USER_RO} IN SCHEMA ${schema} GRANT ALL PRIVILEGES ON TABLES TO ${VAULTADMIN_USER}, ${USER_ADMIN}, ${USER_RO};"
                run_psql_with_retry "default privs ${USER_RO} seq ${schema}" \
                  psql -h "$PGHOST" -p "$PGPORT" -U "$VAULTADMIN_USER" -d "$APP_DB" -v ON_ERROR_STOP=1 \
                    -c "ALTER DEFAULT PRIVILEGES FOR ROLE ${USER_RO} IN SCHEMA ${schema} GRANT USAGE, SELECT, UPDATE ON SEQUENCES TO ${VAULTADMIN_USER}, ${USER_ADMIN}, ${USER_RO};"
              done

              run_psql_with_retry "set search_path ${USER_ADMIN}" \
                psql -h "$PGHOST" -p "$PGPORT" -U "$VAULTADMIN_USER" -d "$APP_DB" -v ON_ERROR_STOP=1 \
                  -c "ALTER ROLE ${USER_ADMIN} SET search_path = drools,kie_server,public;"
              run_psql_with_retry "set search_path ${USER_RO}" \
                psql -h "$PGHOST" -p "$PGPORT" -U "$VAULTADMIN_USER" -d "$APP_DB" -v ON_ERROR_STOP=1 \
                  -c "ALTER ROLE ${USER_RO} SET search_path = drools,kie_server,public;"

              if vault kv get -format=json "${YSQL_SU_KV_PATH}" >/dev/null 2>&1; then
                echo "🔧 Superuser takeover enabled via ${YSQL_SU_KV_PATH}"
                SU_USER="$(vault kv get -field=username "${YSQL_SU_KV_PATH}" 2>/dev/null || true)"
                [ -n "${SU_USER:-}" ] || SU_USER="yugabyte"
                SU_PASS="$(vault kv get -field=password "${YSQL_SU_KV_PATH}" 2>/dev/null || true)"
                if [ -z "${SU_PASS:-}" ]; then
                  SU_PASS="$(vault kv get -field=value "${YSQL_SU_KV_PATH}" 2>/dev/null || true)"
                fi
                export PGPASSWORD="$SU_PASS"
                SCHEMA_IN="'drools','kie_server'"

                TABLE_OWNER_SQL="$(psql -h "$PGHOST" -p "$PGPORT" -U "$SU_USER" -d "$APP_DB" -Atc \
                  "SELECT 'ALTER TABLE '||quote_ident(schemaname)||'.'||quote_ident(tablename)||' OWNER TO ${USER_ADMIN};'
                     FROM pg_catalog.pg_tables
                    WHERE schemaname IN (${SCHEMA_IN});")"
                if [ -n "${TABLE_OWNER_SQL}" ]; then
                  printf "%s\n" "${TABLE_OWNER_SQL}" > /tmp/drools_table_owner.sql
                  run_psql_with_retry "reassign table ownership" \
                    psql -h "$PGHOST" -p "$PGPORT" -U "$SU_USER" -d "$APP_DB" -v ON_ERROR_STOP=1 -f /tmp/drools_table_owner.sql
                fi

                SEQ_OWNER_SQL="$(psql -h "$PGHOST" -p "$PGPORT" -U "$SU_USER" -d "$APP_DB" -Atc \
                  "SELECT 'ALTER SEQUENCE '||quote_ident(sequence_schema)||'.'||quote_ident(sequence_name)||' OWNER TO ${USER_ADMIN};'
                     FROM information_schema.sequences
                    WHERE sequence_schema IN (${SCHEMA_IN});")"
                if [ -n "${SEQ_OWNER_SQL}" ]; then
                  printf "%s\n" "${SEQ_OWNER_SQL}" > /tmp/drools_seq_owner.sql
                  run_psql_with_retry "reassign sequence ownership" \
                    psql -h "$PGHOST" -p "$PGPORT" -U "$SU_USER" -d "$APP_DB" -v ON_ERROR_STOP=1 -f /tmp/drools_seq_owner.sql
                fi

                echo "✅ Ownership set to ${USER_ADMIN}"
                export PGPASSWORD="$VAULTADMIN_PASS"
              else
                echo "ℹ️ Superuser KV not found; skipping ownership takeover."
              fi

              if ! vault secrets list -format=json 2>/dev/null | grep -q "\"${DB_MOUNT}/\""; then
                vault secrets enable -path="${DB_MOUNT}" database
              fi

              vault write "${DB_MOUNT}/static-roles/${ROLE_STATIC_ADMIN}" \
                db_name="${DB_NAME_IN_VAULT}" \
                username="${USER_ADMIN}" \
                rotation_period="24h" \
                rotation_statements="ALTER ROLE \"${USER_ADMIN}\" WITH PASSWORD '{{password}}';"

              vault write "${DB_MOUNT}/static-roles/${ROLE_STATIC_RO}" \
                db_name="${DB_NAME_IN_VAULT}" \
                username="${USER_RO}" \
                rotation_period="24h" \
                rotation_statements="ALTER ROLE \"${USER_RO}\" WITH PASSWORD '{{password}}';"

              vault write -f "${DB_MOUNT}/rotate-role/${ROLE_STATIC_ADMIN}" >/dev/null
              vault write -f "${DB_MOUNT}/rotate-role/${ROLE_STATIC_RO}" >/dev/null

              vault policy write "${ROLE_STATIC_ADMIN}" - <<EOF
              path "${DB_MOUNT}/static-creds/${ROLE_STATIC_ADMIN}" { capabilities = ["read"] }
              EOF
              vault policy write "${ROLE_STATIC_RO}" - <<EOF
              path "${DB_MOUNT}/static-creds/${ROLE_STATIC_RO}" { capabilities = ["read"] }
              EOF

              vault policy write "drools" - <<'EOF'
              path "secret/data/drools/admin"                        { capabilities = ["read"] }
              path "secret/data/drools/kie-user"                     { capabilities = ["read"] }
              path "secret/data/keycloak-client-id-drools-workbench" { capabilities = ["read"] }
              path "secret/data/keycloak-client-secret-drools-workbench" { capabilities = ["read"] }
              path "secret/data/keycloak-client-id-drools-kie-server" { capabilities = ["read"] }
              path "secret/data/keycloak-client-secret-drools-kie-server" { capabilities = ["read"] }
              path "secret/data/keycloak-client-id-drools-kie-server-service" { capabilities = ["read"] }
              path "secret/data/keycloak-client-secret-drools-kie-server-service" { capabilities = ["read"] }
              path "secret/data/k8s-rules-engine-github-packages-username" { capabilities = ["read"] }
              path "secret/data/k8s-rules-engine-github-packages-token" { capabilities = ["read"] }
              path "secret/data/vaultadmin"                          { capabilities = ["read"] }
              EOF

              vault policy write "keycloak-admin-job" - <<'EOF'
              path "secret/data/keycloak/admin"                      { capabilities = ["read"] }
              path "secret/data/keycloak-configurator-client-secret" { capabilities = ["read"] }
              path "secret/data/keycloak-client-id-drools-workbench"  { capabilities = ["read"] }
              path "secret/data/keycloak-client-id-drools-kie-server" { capabilities = ["read"] }
              path "secret/data/keycloak-client-secret-drools-kie-server" { capabilities = ["read"] }
              path "secret/data/keycloak-client-id-drools-kie-server-service" { capabilities = ["read"] }
              path "secret/data/keycloak-client-secret-drools-kie-server-service" { capabilities = ["read"] }
              path "secret/data/drools/admin"                        { capabilities = ["read"] }
              path "secret/data/drools/kie-user"                     { capabilities = ["read"] }
              EOF

              vault write auth/${AUTH_PATH}/role/drools \
                bound_service_account_names="drools-workbench,drools-kie-server,drools-rules-service" \
                bound_service_account_namespaces="drools" \
                policies="drools,${ROLE_STATIC_ADMIN}" \
                ttl="48h"

              vault write auth/${AUTH_PATH}/role/keycloak-admin-job \
                bound_service_account_names="keycloak-admin-job" \
                bound_service_account_namespaces="drools" \
                policies="keycloak-admin-job" \
                ttl="1h"

              DB_USER="$(vault read -field=username ${DB_MOUNT}/static-creds/${ROLE_STATIC_ADMIN})"
              DB_PASS="$(vault read -field=password ${DB_MOUNT}/static-creds/${ROLE_STATIC_ADMIN})"
              export PGPASSWORD="$DB_PASS"
              echo "🔎 Sanity check as $DB_USER"
              psql -h "$PGHOST" -p "$PGPORT" -U "$DB_USER" -d "$APP_DB" -c "SELECT current_user, current_schema();"
          volumeMounts:
            - name: root-token
              mountPath: /vault-token
              readOnly: true
            - name: vault-bin
              mountPath: /vault-bin
              readOnly: true

---
# RBAC for initialization jobs
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: job-status-reader-drools
  namespace: vault
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: job-status-reader-for-drools
  namespace: vault
subjects:
  - kind: ServiceAccount
    name: drools-workbench
    namespace: drools
  - kind: ServiceAccount
    name: drools-kie-server
    namespace: drools
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: job-status-reader-drools
---
---
# RBAC for ArgoCD PostSync hook (rollout + import)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: drools-workbench-rollout
  namespace: drools
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    resourceNames: ["kie-workbench", "kie-server"]
    verbs: ["get", "watch", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: drools-workbench-rollout
  namespace: drools
subjects:
  - kind: ServiceAccount
    name: drools-workbench
    namespace: drools
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: drools-workbench-rollout
---

apiVersion: v1
kind: Namespace
metadata:
  name: drools
  labels:
    name: drools-rules-engine
  annotations:
    linkerd.io/inject: enabled
    field.cattle.io/projectId: local:applications
---
# Service Accounts
apiVersion: v1
kind: ServiceAccount
metadata:
  name: drools-workbench
  namespace: drools
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: drools-kie-server
  namespace: drools
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: drools-rules-service
  namespace: drools
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kie-server-openapi
  namespace: drools
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: keycloak-admin-job
  namespace: drools
