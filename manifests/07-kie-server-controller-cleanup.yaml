apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kie-server-controller-cleanup
  namespace: drools
  annotations:
    argocd.argoproj.io/sync-wave: "7"
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kie-server-controller-cleanup
  namespace: drools
  annotations:
    argocd.argoproj.io/sync-wave: "7"
subjects:
  - kind: ServiceAccount
    name: drools-kie-server
    namespace: drools
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kie-server-controller-cleanup
---
apiVersion: batch/v1
kind: Job
metadata:
  name: kie-server-controller-cleanup
  namespace: drools
  annotations:
    argocd.argoproj.io/sync-wave: "8"
    argocd.argoproj.io/sync-options: Replace=true,Force=true
spec:
  backoffLimit: 1
  template:
    metadata:
      annotations:
        linkerd.io/inject: disabled
    spec:
      restartPolicy: OnFailure
      serviceAccountName: drools-kie-server
      containers:
        - name: cleanup
          image: hashicorp/vault:1.15.4
          command: ["/bin/sh","-c"]
          args:
            - |
              set -euo pipefail
              apk add --no-cache curl jq
              export VAULT_ADDR="http://vault.vault.svc.cluster.local:8200"

              VAULT_TOKEN=$(vault write -field=token auth/kubernetes/login \
                role=drools \
                jwt=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token))
              export VAULT_TOKEN

              resolve_host() {
                local host="$1"
                if [ -z "${host:-}" ]; then
                  return 1
                fi
                if command -v getent >/dev/null 2>&1; then
                  getent hosts "$host" >/dev/null 2>&1
                  return $?
                fi
                if command -v nslookup >/dev/null 2>&1; then
                  nslookup "$host" >/dev/null 2>&1
                  return $?
                fi
                return 1
              }
              WORKBENCH_CONTROLLER_URL="${WORKBENCH_CONTROLLER_URL:-http://kie-workbench.drools.svc.cluster.local:8080/business-central/rest/controller}"
              KEYCLOAK_INTERNAL_URL="${KEYCLOAK_INTERNAL_URL:-http://keycloak.keycloak.svc.cluster.local:8080}"
              KEYCLOAK_EXTERNAL_URL="${KEYCLOAK_EXTERNAL_URL:-https://auth.suncoast.systems}"
              KEYCLOAK_BASE_URL="$KEYCLOAK_INTERNAL_URL"
              KC_HOST="$(printf '%s' "$KEYCLOAK_INTERNAL_URL" | sed -E 's#^[a-zA-Z]+://([^/:]+).*#\1#')"
              if ! resolve_host "$KC_HOST"; then
                KEYCLOAK_BASE_URL="$KEYCLOAK_EXTERNAL_URL"
              fi
              KEYCLOAK_TOKEN_URL="${KEYCLOAK_TOKEN_URL:-${KEYCLOAK_BASE_URL}/realms/internal/protocol/openid-connect/token}"
              KIE_SERVER_ID_PREFIX="${KIE_SERVER_ID_PREFIX:-kie-server-}"
              DRY_RUN="${DRY_RUN:-false}"
              WAIT_FOR_PODS_SECONDS="${WAIT_FOR_PODS_SECONDS:-300}"
              WAIT_FOR_PODS_INTERVAL="${WAIT_FOR_PODS_INTERVAL:-5}"

              KC_CLIENT_ID_JSON="$(vault kv get -format=json secret/keycloak-client-id-drools-workbench)"
              KC_CLIENT_ID="$(printf '%s' "$KC_CLIENT_ID_JSON" | jq -r '.data.data.value // .data.data.id // .data.data.client_id // empty')"
              KC_CLIENT_SECRET_JSON="$(vault kv get -format=json secret/keycloak-client-secret-drools-workbench)"
              KC_CLIENT_SECRET="$(printf '%s' "$KC_CLIENT_SECRET_JSON" | jq -r '.data.data.value // .data.data.secret // .data.data.password // empty')"
              if [ -z "$KC_CLIENT_ID" ] || [ -z "$KC_CLIENT_SECRET" ]; then
                echo "ERROR: Missing Workbench Keycloak client credentials in Vault"
                exit 1
              fi

              TOKEN=""
              TOKEN_EXPIRES_AT=""
              TOKEN_REFRESH_SKEW="${TOKEN_REFRESH_SKEW:-30}"
              fetch_token() {
                TOKEN_RESPONSE="$(curl -sS -w '\n%{http_code}' \
                  -H "Content-Type: application/x-www-form-urlencoded" \
                  --data-urlencode "grant_type=client_credentials" \
                  --data-urlencode "client_id=${KC_CLIENT_ID}" \
                  --data-urlencode "client_secret=${KC_CLIENT_SECRET}" \
                  "$KEYCLOAK_TOKEN_URL" || true)"
                TOKEN_BODY="$(printf '%s' "$TOKEN_RESPONSE" | sed '$d')"
                TOKEN_CODE="$(printf '%s' "$TOKEN_RESPONSE" | tail -n 1)"
                if [ "$TOKEN_CODE" = "200" ]; then
                  TOKEN="$(printf '%s' "$TOKEN_BODY" | jq -r '.access_token // empty')"
                  EXPIRES_IN="$(printf '%s' "$TOKEN_BODY" | jq -r '.expires_in // empty')"
                  if [ -z "${EXPIRES_IN:-}" ] || ! printf '%s' "$EXPIRES_IN" | grep -q '^[0-9][0-9]*$'; then
                    EXPIRES_IN="300"
                  fi
                  now="$(date +%s)"
                  TOKEN_EXPIRES_AT=$((now + EXPIRES_IN - TOKEN_REFRESH_SKEW))
                  if [ "$TOKEN_EXPIRES_AT" -le "$now" ]; then
                    TOKEN_EXPIRES_AT=$((now + EXPIRES_IN))
                  fi
                fi
                if [ -z "${TOKEN:-}" ]; then
                  echo "ERROR: Could not obtain Keycloak token"
                  exit 1
                fi
              }
              ensure_token() {
                now="$(date +%s)"
                if [ -z "${TOKEN:-}" ] || [ -z "${TOKEN_EXPIRES_AT:-}" ] || [ "$now" -ge "$TOKEN_EXPIRES_AT" ]; then
                  fetch_token
                fi
              }
              fetch_token

              echo "Waiting for KIE server pods..."
              K8S_API="https://kubernetes.default.svc"
              SA_TOKEN="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
              CA_CERT="/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
              START="$(date +%s)"
              ACTIVE_IDS=""
              while true; do
                PODS_JSON="$(curl -fsS --cacert "$CA_CERT" -H "Authorization: Bearer $SA_TOKEN" \
                  "$K8S_API/api/v1/namespaces/drools/pods?labelSelector=app%3Dkie-server" || true)"
                ACTIVE_IDS="$(printf '%s' "$PODS_JSON" | jq -r '.items[] | select(.status.phase=="Running") | .metadata.name' | tr '\n' ' ' || true)"
                if [ -n "${ACTIVE_IDS:-}" ]; then
                  break
                fi
                now="$(date +%s)"
                if [ $((now - START)) -ge "$WAIT_FOR_PODS_SECONDS" ]; then
                  echo "ERROR: No running kie-server pods found after ${WAIT_FOR_PODS_SECONDS}s"
                  exit 1
                fi
                sleep "$WAIT_FOR_PODS_INTERVAL"
              done
              echo "Active KIE server pods: ${ACTIVE_IDS}"

              ensure_token
              SERVERS_JSON="$(curl -fsS -H "Authorization: Bearer ${TOKEN}" -H "Accept: application/json" \
                "${WORKBENCH_CONTROLLER_URL}/management/servers")"
              CANDIDATES="$(printf '%s' "$SERVERS_JSON" | jq -r --arg prefix "$KIE_SERVER_ID_PREFIX" '
                def templates:
                  if type=="object" then
                    (.servers // .items // .result // .serverTemplate // .serverTemplates // .["server-template"] // [])
                  else [] end;
                templates[]
                | . as $t
                | ($t."server-id" // $t.serverId // $t.id // $t."server_id") as $id
                | ($t."server-instances" // $t.serverInstances // $t."server-instance" // []) as $inst
                | ([$inst[]? | select(.online == true)] | length) as $online
                | select($id != null)
                | select(($id | tostring) | startswith($prefix))
                | select($online == 0)
                | $id
              ' | tr '\n' ' ')"

              if [ -z "${CANDIDATES:-}" ]; then
                echo "No stale server templates found."
                exit 0
              fi

              for id in $CANDIDATES; do
                case " $ACTIVE_IDS " in
                  *" $id "*) echo "Keeping active server template: $id"; continue ;;
                esac
                if [ "$DRY_RUN" = "true" ]; then
                  echo "DRY RUN: would delete server template $id"
                  continue
                fi
                ensure_token
                code="$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer ${TOKEN}" \
                  -X DELETE "${WORKBENCH_CONTROLLER_URL}/management/servers/${id}")"
                case "$code" in
                  200|204|404) echo "Deleted server template $id (HTTP $code)" ;;
                  401) echo "Token rejected deleting $id; retrying once" >&2
                       fetch_token
                       code="$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer ${TOKEN}" \
                         -X DELETE "${WORKBENCH_CONTROLLER_URL}/management/servers/${id}")"
                       case "$code" in
                         200|204|404) echo "Deleted server template $id (HTTP $code)" ;;
                         *) echo "ERROR: delete $id failed (HTTP $code)"; exit 1 ;;
                       esac
                       ;;
                  *) echo "ERROR: delete $id failed (HTTP $code)"; exit 1 ;;
                esac
              done
