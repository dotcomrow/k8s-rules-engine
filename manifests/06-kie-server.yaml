    gravitee.io/definition-pages: '{"swagger":{"type":"SWAGGER","name":"openapi","published":true,"visibility":"PUBLIC","homepage":false,"source":{"type":"http-fetcher","configuration":{"url":"http://kie-server-auth-proxy.drools.svc.cluster.local:8080/kie-server/services/rest/server/swagger.json","autoFetch":true,"fetchCron":"0 */5 * * * *","useSystemProxy":false}}}}'
    gravitee.io/definition-plans: '{"bearer-internal":{"name":"Bearer Token","description":"Bearer token (validated by JWT policy)","security":{"type":"KEY_LESS"},"status":"PUBLISHED","validation":"AUTO","type":"API","selectionRule":"{#request.headers[\"authorization\"] != null && #request.headers[\"authorization\"].size() > 0 && #request.headers[\"authorization\"][0].startsWith(\"Bearer \")}"}}'
    gravitee.io/definition-flows: '[{"name":"token-exchange","enabled":true,"request":[{"name":"mark-flow","policy":"transform-headers","enabled":true,"messageCondition":"{#request.headers[\"authorization\"] != null && #request.headers[\"authorization\"].size() > 0 && #request.headers[\"authorization\"][0].startsWith(\"Bearer \") && #context.attributes[\"service_token\"] == null}","configuration":{"addHeaders":[{"name":"X-Policy-Matched","value":"token-exchange"}]}},{"name":"keycloak-token-exchange","policy":"policy-http-callout","enabled":true,"description":"Exchange token to internal realm","messageCondition":"{#request.headers[\"authorization\"] != null && #request.headers[\"authorization\"].size() > 0 && #request.headers[\"authorization\"][0].startsWith(\"Bearer \") && #context.attributes[\"service_token\"] == null}","configuration":{"url":"{#properties[\"token_exchange_url\"]}","method":"POST","headers":[{"name":"Content-Type","value":"application/x-www-form-urlencoded"}],"body":"grant_type=urn:ietf:params:oauth:grant-type:token-exchange&client_id={#properties[\"token_exchange_client_id\"]}&client_secret={#properties[\"token_exchange_client_secret\"]}&subject_token={#request.headers[\"authorization\"][0].substring(7)}","exitOnError":false,"variables":[{"name":"exchanged_token","value":"{#calloutResponse != null && #calloutResponse.status == 200 ? #jsonPath(#calloutResponse.content, \"$.access_token\") : null}"},{"name":"exchange_callout_status","value":"{#calloutResponse != null ? #calloutResponse.status : -1}"}]}},{"name":"strip-auth-header","policy":"transform-headers","enabled":true,"messageCondition":"{#context.attributes[\"exchanged_token\"] != null && #context.attributes[\"exchanged_token\"].length() > 0}","configuration":{"removeHeaders":["Authorization","authorization"]}},{"name":"mark-token","policy":"transform-headers","enabled":true,"messageCondition":"{#context.attributes[\"exchanged_token\"] != null && #context.attributes[\"exchanged_token\"].length() > 0}","configuration":{"addHeaders":[{"name":"X-Exchanged-Token-Present","value":"true"}]}},{"name":"apply-exchanged-token","policy":"transform-headers","enabled":true,"messageCondition":"{#context.attributes[\"exchanged_token\"] != null && #context.attributes[\"exchanged_token\"].length() > 0}","configuration":{"addHeaders":[{"name":"Authorization","value":"Bearer {#context.attributes[\"exchanged_token\"]}"}]}},{"name":"validate-jwt","policy":"jwt","enabled":true,"messageCondition":"{#request.headers[\"authorization\"] != null && #request.headers[\"authorization\"].size() > 0 && #request.headers[\"authorization\"][0].startsWith(\"Bearer \")}","configuration":{"signature":"RSA_RS256","publicKeyResolver":"JWKS_URL","resolverParameter":"https://auth.suncoast.systems/realms/internal/protocol/openid-connect/certs","extractClaims":true,"userClaim":"preferred_username","propagateAuthHeader":true}}],"response":[{"name":"debug-token-exchange-callout","policy":"transform-headers","enabled":true,"messageCondition":"{#context.attributes[\"exchange_callout_status\"] != null}","configuration":{"addHeaders":[{"name":"X-Keycloak-Exchange-Callout-Status","value":"{#context.attributes[\"exchange_callout_status\"]}"}]}}]}]'
