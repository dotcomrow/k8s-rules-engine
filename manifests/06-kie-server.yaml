# =========================
# KIE Server – Showcase image + redirect
# =========================
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kie-server-jpa-overrides
  namespace: drools
  annotations:
    argocd.argoproj.io/sync-wave: "2"
data:
  persistence.xml: |
    <?xml version="1.0" encoding="UTF-8"?>
    <!-- ~ Copyright 2012 Red Hat, Inc. and/or its affiliates ~ ~ Licensed under the Apache License, Version
      2.0 (the "License"); ~ you may not use this file except in compliance with
      the License. ~ You may obtain a copy of the License at ~ ~ http://www.apache.org/licenses/LICENSE-2.0
      ~ ~ Unless required by applicable law or agreed to in writing, software ~
      distributed under the License is distributed on an "AS IS" BASIS, ~ WITHOUT
      WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied. ~ See the
      License for the specific language governing permissions and ~ limitations
      under the License. -->

    <persistence version="2.1"
                 xmlns="http://xmlns.jcp.org/xml/ns/persistence"
                 xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                 xsi:schemaLocation="http://xmlns.jcp.org/xml/ns/persistence http://xmlns.jcp.org/xml/ns/persistence/persistence_2_1.xsd">

      <persistence-unit name="org.jbpm.domain" transaction-type="JTA">
        <provider>org.hibernate.jpa.HibernatePersistenceProvider</provider>
        <jta-data-source>java:jboss/datasources/KieServerDS</jta-data-source>
        <mapping-file>META-INF/Taskorm.xml</mapping-file>
        <mapping-file>META-INF/JBPMorm.xml</mapping-file>
        <mapping-file>META-INF/Servicesorm.xml</mapping-file>
        <mapping-file>META-INF/TaskAuditorm.xml</mapping-file>
        <mapping-file>META-INF/Executor-orm.xml</mapping-file>
        <mapping-file>META-INF/CaseMgmtorm.xml</mapping-file>
        <mapping-file>META-INF/QueryDefinitionOverride.orm.xml</mapping-file>

        <!-- executor service -->
        <class>org.jbpm.executor.entities.ErrorInfo</class>
        <class>org.jbpm.executor.entities.RequestInfo</class>

        <!-- task service -->
        <class>org.jbpm.services.task.impl.model.AttachmentImpl</class>
        <class>org.jbpm.services.task.impl.model.ContentImpl</class>
        <class>org.jbpm.services.task.impl.model.BooleanExpressionImpl</class>
        <class>org.jbpm.services.task.impl.model.CommentImpl</class>
        <class>org.jbpm.services.task.impl.model.DeadlineImpl</class>
        <class>org.jbpm.services.task.impl.model.CommentImpl</class>
        <class>org.jbpm.services.task.impl.model.DeadlineImpl</class>
        <class>org.jbpm.services.task.impl.model.DelegationImpl</class>
        <class>org.jbpm.services.task.impl.model.EscalationImpl</class>
        <class>org.jbpm.services.task.impl.model.GroupImpl</class>
        <class>org.jbpm.services.task.impl.model.I18NTextImpl</class>
        <class>org.jbpm.services.task.impl.model.NotificationImpl</class>
        <class>org.jbpm.services.task.impl.model.EmailNotificationImpl</class>
        <class>org.jbpm.services.task.impl.model.EmailNotificationHeaderImpl</class>
        <class>org.jbpm.services.task.impl.model.PeopleAssignmentsImpl</class>
        <class>org.jbpm.services.task.impl.model.ReassignmentImpl</class>
        <class>org.jbpm.services.task.impl.model.TaskImpl</class>
        <class>org.jbpm.services.task.impl.model.TaskDefImpl</class>
        <class>org.jbpm.services.task.impl.model.TaskDataImpl</class>
        <class>org.jbpm.services.task.impl.model.UserImpl</class>
        <class>org.jbpm.services.task.impl.model.EmailImpl</class>
        <!-- Event Classes -->
        <class>org.jbpm.services.task.audit.impl.model.TaskEventImpl</class>

        <!-- Task Audit Classes -->
        <class>org.jbpm.services.task.audit.impl.model.AuditTaskImpl</class>
        <class>org.jbpm.services.task.audit.impl.model.TaskVariableImpl</class>

        <!--BAM for task service -->
        <class>org.jbpm.services.task.audit.impl.model.BAMTaskSummaryImpl</class>

        <!-- engine -->
        <class>org.drools.persistence.info.SessionInfo</class>
        <class>org.jbpm.persistence.processinstance.ProcessInstanceInfo</class>
        <class>org.drools.persistence.info.WorkItemInfo</class>
        <class>org.jbpm.persistence.correlation.CorrelationKeyInfo</class>
        <class>org.jbpm.persistence.correlation.CorrelationPropertyInfo</class>
        <!-- manager -->
        <class>org.jbpm.runtime.manager.impl.jpa.ContextMappingInfo</class>
        <class>org.jbpm.runtime.manager.impl.jpa.TimerMappingInfo</class>

        <!-- bam -->
        <class>org.jbpm.process.audit.ProcessInstanceLog</class>
        <class>org.jbpm.process.audit.NodeInstanceLog</class>
        <class>org.jbpm.process.audit.VariableInstanceLog</class>

        <!-- deployment store -->
        <class>org.jbpm.kie.services.impl.store.DeploymentStoreEntry</class>
        <!--  query service storage -->
        <class>org.jbpm.kie.services.impl.query.persistence.QueryDefinitionEntity</class>

        <!-- case id generation -->
        <class>org.jbpm.casemgmt.impl.generator.CaseIdInfo</class>
        <class>org.jbpm.casemgmt.impl.audit.CaseRoleAssignmentLog</class>
        <class>org.jbpm.casemgmt.impl.audit.CaseFileDataLog</class>

        <!-- error handling -->
        <class>org.jbpm.runtime.manager.impl.jpa.ExecutionErrorInfo</class>

        <properties>
          <property name="hibernate.dialect" value="org.hibernate.dialect.PostgreSQLDialect" />

          <property name="hibernate.max_fetch_depth" value="3" />
          <property name="hibernate.hbm2ddl.auto" value="validate" />
          <property name="hibernate.show_sql" value="false" />

          <!-- BZ 841786: AS7/EAP 6/Hib 4 uses new (sequence) generators which seem to cause problems -->
          <property name="hibernate.id.new_generator_mappings" value="false" />
          <property name="hibernate.transaction.jta.platform" value="JBossAS" />
        </properties>
      </persistence-unit>

    </persistence>
  query-definition-override.orm.xml: |
    <?xml version="1.0" encoding="UTF-8"?>
    <entity-mappings xmlns="http://xmlns.jcp.org/xml/ns/persistence/orm"
                     xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                     xsi:schemaLocation="http://xmlns.jcp.org/xml/ns/persistence/orm http://xmlns.jcp.org/xml/ns/persistence/orm_2_1.xsd"
                     version="2.1">
      <entity class="org.jbpm.kie.services.impl.query.persistence.QueryDefinitionEntity" access="FIELD">
        <attributes>
          <basic name="expression">
            <column name="qExpression" length="65535" column-definition="text"/>
          </basic>
        </attributes>
      </entity>
    </entity-mappings>
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kie-server-default-queries
  namespace: drools
  annotations:
    argocd.argoproj.io/sync-wave: "2"
data:
  queries.json: |
    [
      {
        "query-name": "jbpmExecutionErrorList",
        "query-source": "${org.kie.server.persistence.ds}",
        "query-expression": "select eri.ERROR_ACK, eri.ERROR_ACK_BY, eri.ERROR_ACK_AT, eri.ACTIVITY_ID, eri.ACTIVITY_NAME, eri.DEPLOYMENT_ID, eri.ERROR_DATE, eri.ERROR_ID, eri.ERROR_MSG, eri.JOB_ID, eri.PROCESS_ID, eri.PROCESS_INST_ID, eri.ERROR_TYPE from ExecutionErrorInfo eri",
        "query-target": "CUSTOM",
        "query-columns": {
          "error_ack": "NUMBER",
          "error_ack_by": "LABEL",
          "error_ack_at": "DATE",
          "activity_id": "LABEL",
          "activity_name": "LABEL",
          "deployment_id": "LABEL",
          "error_date": "DATE",
          "error_id": "LABEL",
          "error_msg": "LABEL",
          "job_id": "NUMBER",
          "process_id": "LABEL",
          "process_inst_id": "NUMBER",
          "error_type": "LABEL"
        }
      },
      {
        "query-name": "jbpmHumanTasks",
        "query-source": "${org.kie.server.persistence.ds}",
        "query-expression": "select t.activationTime, t.actualOwner, t.createdBy, t.createdOn, t.deploymentId, t.description, t.dueDate, t.name, t.parentId, t.priority, t.processId, t.processInstanceId, t.processSessionId, t.status, t.taskId, t.workItemId, t.lastModificationDate, pil.correlationKey, pil.processInstanceDescription, nil.sla_due_date, nil.slaCompliance from AuditTaskImpl t left join ProcessInstanceLog pil on pil.processInstanceId=t.processInstanceId left join NodeInstanceLog nil on nil.workItemId=t.workItemId",
        "query-target": "CUSTOM",
        "query-columns": {
          "activationtime": "DATE",
          "actualowner": "LABEL",
          "createdby": "LABEL",
          "createdon": "DATE",
          "deploymentid": "LABEL",
          "description": "LABEL",
          "duedate": "DATE",
          "name": "LABEL",
          "parentid": "NUMBER",
          "priority": "NUMBER",
          "processid": "LABEL",
          "processinstanceid": "NUMBER",
          "processsessionid": "NUMBER",
          "status": "LABEL",
          "taskid": "NUMBER",
          "workitemid": "NUMBER",
          "lastmodificationdate": "DATE",
          "correlationkey": "LABEL",
          "processinstancedescription": "LABEL",
          "sla_due_date": "DATE",
          "slacompliance": "NUMBER"
        }
      },
      {
        "query-name": "jbpmHumanTasksWithAdmin",
        "query-source": "${org.kie.server.persistence.ds}",
        "query-expression": "select t.activationTime, t.actualOwner, t.createdBy, t.createdOn, t.deploymentId, t.description, t.dueDate, t.name, t.parentId, t.priority, t.processId, t.processInstanceId, t.processSessionId, t.status, t.taskId, t.workItemId, t.lastModificationDate, pil.correlationKey, pil.processInstanceDescription ,oe.id, nil.sla_due_date, nil.slaCompliance, (select COUNT(errInfo.id) from ExecutionErrorInfo errInfo where errInfo.ACTIVITY_ID = t.taskId and errInfo.PROCESS_INST_ID = pil.processInstanceId and errInfo.ERROR_ACK = 0 and errInfo.ERROR_TYPE = 'Task') as errorCount from AuditTaskImpl t  left join ProcessInstanceLog pil on pil.processInstanceId = t.processInstanceId left join PeopleAssignments_BAs ba on t.taskId = ba.task_id left join OrganizationalEntity oe on ba.entity_id = oe.id left join NodeInstanceLog nil on nil.workItemId=t.workItemId",
        "query-target": "FILTERED_BA_TASK",
        "query-columns": {
          "slacompliance": "NUMBER",
          "sla_due_date": "DATE",
          "processsessionid": "NUMBER",
          "processinstancedescription": "LABEL",
          "description": "LABEL",
          "priority": "NUMBER",
          "activationtime": "DATE",
          "createdon": "DATE",
          "parentid": "NUMBER",
          "workitemid": "NUMBER",
          "actualowner": "LABEL",
          "processinstanceid": "NUMBER",
          "createdby": "LABEL",
          "processid": "LABEL",
          "duedate": "DATE",
          "deploymentid": "LABEL",
          "name": "LABEL",
          "id": "LABEL",
          "lastmodificationdate": "DATE",
          "taskid": "NUMBER",
          "status": "LABEL",
          "correlationkey": "LABEL",
          "errorcount": "NUMBER"
        }
      },
      {
        "query-name": "jbpmHumanTasksWithUser",
        "query-source": "${org.kie.server.persistence.ds}",
        "query-expression": "select t.activationTime, t.actualOwner, t.createdBy, t.createdOn, t.deploymentId, t.description, t.dueDate, t.name, t.parentId, t.priority, t.processId, t.processInstanceId, t.processSessionId, t.status, t.taskId, t.workItemId, t.lastModificationDate, pil.correlationKey, pil.processInstanceDescription , oe.id, eo.entity_id, nil.sla_due_date, nil.slaCompliance from AuditTaskImpl t left join PeopleAssignments_PotOwners po on t.taskId=po.task_id left join OrganizationalEntity oe on po.entity_id=oe.id left join ProcessInstanceLog pil on pil.processInstanceId=t.processInstanceId left join PeopleAssignments_ExclOwners eo on t.taskId=eo.task_id left join NodeInstanceLog nil on nil.workItemId=t.workItemId",
        "query-target": "FILTERED_PO_TASK",
        "query-columns": {
          "activationtime": "DATE",
          "actualowner": "LABEL",
          "createdby": "LABEL",
          "createdon": "DATE",
          "deploymentid": "LABEL",
          "description": "LABEL",
          "duedate": "DATE",
          "name": "LABEL",
          "parentid": "NUMBER",
          "priority": "NUMBER",
          "processid": "LABEL",
          "processinstanceid": "NUMBER",
          "processsessionid": "NUMBER",
          "status": "LABEL",
          "taskid": "NUMBER",
          "workitemid": "NUMBER",
          "lastmodificationdate": "DATE",
          "correlationkey": "LABEL",
          "processinstancedescription": "LABEL",
          "id": "LABEL",
          "entity_id": "LABEL",
          "sla_due_date": "DATE",
          "slacompliance": "NUMBER"
        }
      },
      {
        "query-name": "jbpmHumanTasksWithVariables",
        "query-source": "${org.kie.server.persistence.ds}",
        "query-expression": "select tvi.taskId, tvi.name, tvi.value from TaskVariableImpl tvi",
        "query-target": "CUSTOM",
        "query-columns": {
          "taskid": "NUMBER",
          "name": "LABEL",
          "value": "LABEL"
        }
      },
      {
        "query-name": "jbpmProcessInstanceLogs",
        "query-source": "${org.kie.server.persistence.ds}",
        "query-expression": "select log.id, log.nodeId, log.nodeName, log.nodeType, log.externalId, log.processInstanceId, log.log_date, log.connection, log.type, log.workItemId, log.referenceId, log.nodeContainerId, log.sla_due_date, log.slaCompliance from NodeInstanceLog log ",
        "query-target": "CUSTOM",
        "query-columns": {
          "id": "NUMBER",
          "nodeid": "LABEL",
          "nodename": "LABEL",
          "nodetype": "LABEL",
          "externalid": "LABEL",
          "processinstanceid": "NUMBER",
          "log_date": "DATE",
          "connection": "LABEL",
          "type": "NUMBER",
          "workitemid": "NUMBER",
          "referenceid": "NUMBER",
          "nodecontainerid": "LABEL",
          "sla_due_date": "DATE",
          "slacompliance": "NUMBER"
        }
      },
      {
        "query-name": "jbpmProcessInstances",
        "query-source": "${org.kie.server.persistence.ds}",
        "query-expression": "SELECT LOG.PROCESSINSTANCEID, LOG.PROCESSID, LOG.START_DATE, LOG.END_DATE, LOG.STATUS, LOG.PARENTPROCESSINSTANCEID, LOG.OUTCOME, LOG.DURATION, LOG.USER_IDENTITY, LOG.PROCESSVERSION, LOG.PROCESSNAME, LOG.CORRELATIONKEY, LOG.EXTERNALID, LOG.PROCESSINSTANCEDESCRIPTION, LOG.SLA_DUE_DATE, LOG.SLACOMPLIANCE, COALESCE ( INFO.LASTMODIFICATIONDATE, LOG.END_DATE ) AS LASTMODIFICATIONDATE, COUNT( ERRINFO.ID ) ERRORCOUNT FROM ProcessInstanceLog LOG LEFT JOIN ExecutionErrorInfo ERRINFO ON ERRINFO.PROCESS_INST_ID=LOG.PROCESSINSTANCEID AND ERRINFO.ERROR_ACK=0 LEFT JOIN ProcessInstanceInfo INFO ON INFO.INSTANCEID=LOG.PROCESSINSTANCEID GROUP BY LOG.PROCESSINSTANCEID, LOG.PROCESSID, LOG.START_DATE, LOG.END_DATE, LOG.STATUS, LOG.PARENTPROCESSINSTANCEID, LOG.OUTCOME, LOG.DURATION, LOG.USER_IDENTITY, LOG.PROCESSVERSION, LOG.PROCESSNAME, LOG.CORRELATIONKEY, LOG.EXTERNALID, LOG.PROCESSINSTANCEDESCRIPTION, LOG.SLA_DUE_DATE, LOG.SLACOMPLIANCE, COALESCE ( INFO.LASTMODIFICATIONDATE, LOG.END_DATE )",
        "query-target": "CUSTOM",
        "query-columns": {
          "processinstanceid": "NUMBER",
          "processid": "LABEL",
          "start_date": "DATE",
          "end_date": "DATE",
          "status": "NUMBER",
          "parentprocessinstanceid": "NUMBER",
          "outcome": "LABEL",
          "duration": "NUMBER",
          "user_identity": "LABEL",
          "processversion": "LABEL",
          "processname": "LABEL",
          "correlationkey": "LABEL",
          "externalid": "LABEL",
          "processinstancedescription": "LABEL",
          "sla_due_date": "DATE",
          "slacompliance": "NUMBER",
          "lastmodificationdate": "DATE",
          "errorcount": "NUMBER"
        }
      },
      {
        "query-name": "jbpmProcessInstancesWithVariables",
        "query-source": "${org.kie.server.persistence.ds}",
        "query-expression": "select vil.processInstanceId, vil.processId, vil.id, vil.variableId, vil.value from VariableInstanceLog vil left join VariableInstanceLog vil2 on vil.processInstanceId = vil2.processInstanceId and vil.variableId = vil2.variableId and vil.id < vil2.id where vil2.id is null",
        "query-target": "CUSTOM",
        "query-columns": {
          "processinstanceid": "NUMBER",
          "processid": "LABEL",
          "id": "NUMBER",
          "variableid": "LABEL",
          "value": "LABEL"
        }
      },
      {
        "query-name": "jbpmRequestList",
        "query-source": "${org.kie.server.persistence.ds}",
        "query-expression": "select ri.id, ri.timestamp, ri.status, ri.commandName, ri.message, ri.businessKey, ri.retries, ri.executions, pil.processName, pil.processInstanceId, pil.processInstanceDescription, ri.deploymentId from RequestInfo ri left join ProcessInstanceLog pil on pil.processInstanceId=ri.processInstanceId",
        "query-target": "CUSTOM",
        "query-columns": {
          "id": "NUMBER",
          "timestamp": "DATE",
          "status": "NUMBER",
          "commandname": "LABEL",
          "message": "LABEL",
          "businesskey": "LABEL",
          "retries": "NUMBER",
          "executions": "NUMBER",
          "processname": "LABEL",
          "processinstanceid": "NUMBER",
          "processinstancedescription": "LABEL",
          "deploymentid": "LABEL"
        }
      },
      {
        "query-name": "processesMonitoring",
        "query-source": "${org.kie.server.persistence.ds}",
        "query-expression": "select log.processInstanceId, log.processId, log.start_date, log.end_date, log.status, log.duration, log.user_identity, log.processVersion, log.processName, log.externalId from ProcessInstanceLog log",
        "query-target": "CUSTOM",
        "query-columns": {
          "processinstanceid": "NUMBER",
          "processid": "LABEL",
          "start_date": "DATE",
          "end_date": "DATE",
          "status": "NUMBER",
          "duration": "NUMBER",
          "user_identity": "LABEL",
          "processversion": "LABEL",
          "processname": "LABEL",
          "externalid": "LABEL"
        }
      },
      {
        "query-name": "tasksMonitoring",
        "query-source": "${org.kie.server.persistence.ds}",
        "query-expression": "select p.processName, p.externalId, t.taskId, t.taskName, t.status, t.createdDate, t.startDate, t.endDate, t.processInstanceId, t.userId, t.duration from ProcessInstanceLog p inner join BAMTaskSummary t on (t.processInstanceId = p.processInstanceId) inner join (select min(pk) as pk from BAMTaskSummary group by taskId) d on t.pk = d.pk",
        "query-target": "CUSTOM",
        "query-columns": {
          "processname": "LABEL",
          "externalid": "LABEL",
          "taskid": "NUMBER",
          "taskname": "LABEL",
          "status": "LABEL",
          "createddate": "DATE",
          "startdate": "DATE",
          "enddate": "DATE",
          "processinstanceid": "NUMBER",
          "userid": "LABEL",
          "duration": "NUMBER"
        }
      }
    ]
---
apiVersion: batch/v1
kind: Job
metadata:
  name: kie-server-schema-init
  namespace: drools
  annotations:
    argocd.argoproj.io/sync-options: Replace=true,Force=true
    argocd.argoproj.io/sync-wave: "3"
spec:
  backoffLimit: 1
  template:
    metadata:
      labels: { app: kie-server-schema-init }
      annotations:
        linkerd.io/inject: disabled
    spec:
      restartPolicy: Never
      serviceAccountName: drools-kie-server
      volumes:
        - name: vault-secrets
          emptyDir: {}
        - name: kieserver-config
          emptyDir: {}
        - name: wildfly-modules
          emptyDir: {}
        - name: kie-server-classes
          emptyDir: {}
        - name: kie-server-jpa-overrides
          configMap:
            name: kie-server-jpa-overrides
            items:
              - { key: persistence.xml, path: persistence.xml, mode: 0444 }
              - { key: query-definition-override.orm.xml, path: query-definition-override.orm.xml, mode: 0444 }
      initContainers:
        - name: wait-for-config-job
          image: alpine/k8s:1.31.4
          command: ["/bin/sh","-lc"]
          args:
            - |
              echo "Waiting for Job vault/drools-yugabyte-config to complete..."
              while true; do
                if ! kubectl -n vault get job drools-yugabyte-config >/dev/null 2>&1; then
                  echo "  └─ job not found yet..."; sleep 5; continue
                fi
                SUCC="$(kubectl -n vault get job drools-yugabyte-config -o jsonpath='{.status.succeeded}' 2>/dev/null || true)"; SUCC="${SUCC:-0}"
                [ "$SUCC" -ge 1 ] && break
                sleep 5
              done
        - name: vault-schema-creds
          image: hashicorp/vault:1.15.4
          command: ["/bin/sh","-c"]
          args:
            - |
              set -eu
              set -o pipefail 2>/dev/null || true
              export VAULT_ADDR="http://vault.vault.svc.cluster.local:8200"
              VAULT_TOKEN=$(vault write -field=token auth/kubernetes/login \
                role=drools \
                jwt=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token))
              export VAULT_TOKEN

              DB_HOST="yb-tserver-service.yugabyte.svc.cluster.local"
              DB_PORT="5433"
              DB_NAME="drools"
              DB_SCHEMA="kie_server"

              DB_USERNAME="$(vault read -field=username yugabyte-db/static-creds/drools-yb-admin 2>/dev/null || true)"
              DB_PASSWORD="$(vault read -field=password yugabyte-db/static-creds/drools-yb-admin 2>/dev/null || true)"
              if [ -z "${DB_USERNAME:-}" ] || [ -z "${DB_PASSWORD:-}" ]; then
                echo "ERROR: Missing Yugabyte credentials in Vault"
                exit 1
              fi

              DB_URL="jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?currentSchema=${DB_SCHEMA}&sslmode=disable"
              {
                echo "export KIE_SERVER_DB_HOST=\"$DB_HOST\""
                echo "export KIE_SERVER_DB_PORT=\"$DB_PORT\""
                echo "export KIE_SERVER_DB_NAME=\"$DB_NAME\""
                echo "export KIE_SERVER_DB_SCHEMA=\"$DB_SCHEMA\""
                echo "export KIE_SERVER_DB_USERNAME=\"$DB_USERNAME\""
                echo "export KIE_SERVER_DB_PASSWORD=\"$DB_PASSWORD\""
                echo "export KIE_SERVER_DB_URL=\"$DB_URL\""
              } > /vault-secrets/db-env.sh

              ADMIN_USER="$(vault kv get -field=username secret/drools/admin 2>/dev/null || true)"
              ADMIN_PASS="$(vault kv get -field=password secret/drools/admin 2>/dev/null || true)"
              if [ -z "${ADMIN_USER:-}" ] || [ -z "${ADMIN_PASS:-}" ]; then
                echo "ERROR: Missing drools admin creds in Vault"
                exit 1
              fi
              {
                echo "export KIE_SERVER_USER=\"$ADMIN_USER\""
                echo "export KIE_SERVER_PWD=\"$ADMIN_PASS\""
              } > /vault-secrets/kie-users-env.sh
              echo "OK: Schema init credentials ready"
          volumeMounts:
            - name: vault-secrets
              mountPath: /vault-secrets
        - name: check-schema
          image: postgres:16-alpine
          command: ["/bin/sh","-c"]
          args:
            - |
              set -euo pipefail
              if [ ! -f /vault-secrets/db-env.sh ]; then
                echo "ERROR: DB credentials file not found at /vault-secrets/db-env.sh"
                exit 1
              fi
              # shellcheck disable=SC1091
              . /vault-secrets/db-env.sh
              export PGPASSWORD="$KIE_SERVER_DB_PASSWORD"
              until pg_isready -h "$KIE_SERVER_DB_HOST" -p "$KIE_SERVER_DB_PORT" -U "$KIE_SERVER_DB_USERNAME" -d "$KIE_SERVER_DB_NAME" >/dev/null 2>&1; do
                echo "Waiting for DB..."
                sleep 5
              done
              # If we ever skip schema init on a partial schema, jBPM will fail to boot (no QueryDefinition API)
              # and the register-default-queries job will have to skip/fail. Check a full, version-pinned set
              # of expected tables + sequences so we don't get a false "schema is ready".
              REQUIRED_TABLES="'attachment','audittaskimpl','bamtasksummary','booleanexpression','casefiledatalog','caseidinfo','caseroleassignmentlog','content','contextmappinginfo','correlationkeyinfo','correlationpropertyinfo','deadline','delegation_delegates','deploymentstore','email_header','errorinfo','escalation','eventtypes','executionerrorinfo','i18ntext','nodeinstancelog','notification','notification_bas','notification_email_header','notification_recipients','organizationalentity','peopleassignments_bas','peopleassignments_exclowners','peopleassignments_potowners','peopleassignments_recipients','peopleassignments_stakeholders','processinstanceinfo','processinstancelog','querydefinitionstore','reassignment','reassignment_potentialowners','requestinfo','sessioninfo','task','task_comment','taskdef','taskevent','taskvariableimpl','timermappinginfo','variableinstancelog','workiteminfo'"
              REQUIRED_SEQS="'attachment_id_seq','audit_id_seq','bam_task_id_seq','booleanexpr_id_seq','case_file_data_log_id_seq','case_id_info_id_seq','case_role_assign_log_id_seq','comment_id_seq','content_id_seq','context_mapping_info_id_seq','correlation_key_id_seq','correlation_prop_id_seq','deadline_id_seq','deploy_store_id_seq','emailnotifhead_id_seq','error_info_id_seq','escalation_id_seq','exec_error_info_id_seq','i18ntext_id_seq','node_inst_log_id_seq','notification_id_seq','proc_inst_log_id_seq','process_instance_info_id_seq','query_def_id_seq','reassignment_id_seq','request_info_id_seq','sessioninfo_id_seq','task_def_id_seq','task_event_id_seq','task_id_seq','task_var_id_seq','timer_mapping_info_id_seq','var_inst_log_id_seq','workiteminfo_id_seq'"

              MISSING_TABLES_SQL="WITH req(name) AS (SELECT unnest(ARRAY[${REQUIRED_TABLES}]::text[])) SELECT count(*) FROM req LEFT JOIN information_schema.tables t ON t.table_schema='${KIE_SERVER_DB_SCHEMA}' AND t.table_name=req.name WHERE t.table_name IS NULL;"
              MISSING_SEQS_SQL="WITH req(name) AS (SELECT unnest(ARRAY[${REQUIRED_SEQS}]::text[])) SELECT count(*) FROM req LEFT JOIN information_schema.sequences s ON s.sequence_schema='${KIE_SERVER_DB_SCHEMA}' AND s.sequence_name=req.name WHERE s.sequence_name IS NULL;"
              MISSING_TABLES="$(psql -h "$KIE_SERVER_DB_HOST" -p "$KIE_SERVER_DB_PORT" -U "$KIE_SERVER_DB_USERNAME" -d "$KIE_SERVER_DB_NAME" -Atc "$MISSING_TABLES_SQL")"
              MISSING_SEQS="$(psql -h "$KIE_SERVER_DB_HOST" -p "$KIE_SERVER_DB_PORT" -U "$KIE_SERVER_DB_USERNAME" -d "$KIE_SERVER_DB_NAME" -Atc "$MISSING_SEQS_SQL")"
              if [ "$MISSING_TABLES" = "0" ] && [ "$MISSING_SEQS" = "0" ]; then
                echo "OK: Schema already initialized"
                echo "ready" > /vault-secrets/schema-ready
              else
                echo "Schema incomplete; will initialize"
                echo "  └─ missing tables: ${MISSING_TABLES}, missing sequences: ${MISSING_SEQS}"
                if [ "$MISSING_TABLES" != "0" ]; then
                  echo "Missing tables:"
                  psql -h "$KIE_SERVER_DB_HOST" -p "$KIE_SERVER_DB_PORT" -U "$KIE_SERVER_DB_USERNAME" -d "$KIE_SERVER_DB_NAME" -Atc "WITH req(name) AS (SELECT unnest(ARRAY[${REQUIRED_TABLES}]::text[])) SELECT req.name FROM req LEFT JOIN information_schema.tables t ON t.table_schema='${KIE_SERVER_DB_SCHEMA}' AND t.table_name=req.name WHERE t.table_name IS NULL ORDER BY req.name;" | sed 's/^/  - /'
                fi
                if [ "$MISSING_SEQS" != "0" ]; then
                  echo "Missing sequences:"
                  psql -h "$KIE_SERVER_DB_HOST" -p "$KIE_SERVER_DB_PORT" -U "$KIE_SERVER_DB_USERNAME" -d "$KIE_SERVER_DB_NAME" -Atc "WITH req(name) AS (SELECT unnest(ARRAY[${REQUIRED_SEQS}]::text[])) SELECT req.name FROM req LEFT JOIN information_schema.sequences s ON s.sequence_schema='${KIE_SERVER_DB_SCHEMA}' AND s.sequence_name=req.name WHERE s.sequence_name IS NULL ORDER BY req.name;" | sed 's/^/  - /'
                fi
              fi
          volumeMounts:
            - { name: vault-secrets, mountPath: /vault-secrets }
        - name: copy-standalone-config
          image: quay.io/kiegroup/kie-server-showcase:7.74.1.Final
          command: ["/bin/sh","-c"]
          args:
            - |
              set -euo pipefail
              if [ -f /vault-secrets/schema-ready ]; then
                echo "Schema already present; skipping config copy"
                exit 0
              fi
              cp -a /opt/jboss/wildfly/standalone/configuration/* /config/
          volumeMounts:
            - { name: kieserver-config, mountPath: /config }
            - { name: vault-secrets, mountPath: /vault-secrets }
        - name: apply-jpa-overrides
          image: quay.io/kiegroup/kie-server-showcase:7.74.1.Final
          command: ["/bin/sh","-c"]
          args:
            - |
              set -euo pipefail
              cp -R /opt/jboss/wildfly/standalone/deployments/kie-server.war/WEB-INF/classes/. /target/
              mkdir -p /target/jpa/META-INF /target/META-INF
              cp /override/persistence.xml /target/jpa/META-INF/persistence.xml
              cp /override/query-definition-override.orm.xml /target/META-INF/QueryDefinitionOverride.orm.xml
              echo "OK: JPA overrides applied"
          volumeMounts:
            - { name: kie-server-classes, mountPath: /target }
            - { name: kie-server-jpa-overrides, mountPath: /override }
        - name: copy-wildfly-modules
          image: quay.io/kiegroup/kie-server-showcase:7.74.1.Final
          command: ["/bin/sh","-c"]
          args:
            - |
              set -euo pipefail
              if [ -f /vault-secrets/schema-ready ]; then
                echo "Schema already present; skipping module copy"
                exit 0
              fi
              cp -R /opt/jboss/wildfly/modules/. /target/
              echo "OK: WildFly modules copied"
          volumeMounts:
            - { name: wildfly-modules, mountPath: /target }
            - { name: vault-secrets, mountPath: /vault-secrets }
        - name: install-postgresql-driver
          image: alpine:3.20
          command: ["/bin/sh","-c"]
          env:
            - name: POSTGRESQL_DRIVER_VERSION
              value: "42.7.4"
          args:
            - |
              set -euo pipefail
              if [ -f /vault-secrets/schema-ready ]; then
                echo "Schema already present; skipping JDBC driver install"
                exit 0
              fi
              apk add --no-cache curl
              DEST="/target/system/layers/base/org/postgresql/main"
              mkdir -p "$DEST"
              JAR="postgresql-${POSTGRESQL_DRIVER_VERSION}.jar"
              URL="https://repo1.maven.org/maven2/org/postgresql/postgresql/${POSTGRESQL_DRIVER_VERSION}/${JAR}"
              echo "Downloading PostgreSQL JDBC driver..."
              curl -fsSL "$URL" -o "$DEST/$JAR"
              cat > "$DEST/module.xml" <<EOF
              <module name="org.postgresql" xmlns="urn:jboss:module:1.3">
                <resources>
                  <resource-root path="${JAR}"/>
                </resources>
                <dependencies>
                  <module name="javax.api"/>
                  <module name="javax.transaction.api"/>
                </dependencies>
              </module>
              EOF
              echo "OK: PostgreSQL driver module installed"
          volumeMounts:
            - { name: wildfly-modules, mountPath: /target }
            - { name: vault-secrets, mountPath: /vault-secrets }
        - name: configure-datasource
          image: quay.io/kiegroup/kie-server-showcase:7.74.1.Final
          command: ["/bin/sh","-c"]
          args:
            - |
              set -euo pipefail
              if [ -f /vault-secrets/schema-ready ]; then
                echo "Schema already present; skipping datasource config"
                exit 0
              fi
              if [ ! -f /vault-secrets/db-env.sh ]; then
                echo "ERROR: DB credentials file not found at /vault-secrets/db-env.sh"
                exit 1
              fi
              # shellcheck disable=SC1091
              . /vault-secrets/db-env.sh
              CLI="/tmp/configure-datasource.cli"
              cat > "$CLI" <<EOF
              embed-server --std-out=echo --server-config=standalone-full-kie-server.xml
              if (outcome != success) of /subsystem=datasources/jdbc-driver=postgresql:read-resource
                /subsystem=datasources/jdbc-driver=postgresql:add(driver-name=postgresql, driver-module-name=org.postgresql, driver-class-name=org.postgresql.Driver)
              end-if
              if (outcome != success) of /subsystem=datasources/data-source=KieServerDS:read-resource
                /subsystem=datasources/data-source=KieServerDS:add(jndi-name="java:jboss/datasources/KieServerDS", driver-name="postgresql", connection-url="${KIE_SERVER_DB_URL}", user-name="${KIE_SERVER_DB_USERNAME}", password="${KIE_SERVER_DB_PASSWORD}", min-pool-size=5, max-pool-size=20, enabled=true)
              end-if
              stop-embedded-server
              EOF
              /opt/jboss/wildfly/bin/jboss-cli.sh --file="$CLI"
          volumeMounts:
            - { name: kieserver-config, mountPath: /opt/jboss/wildfly/standalone/configuration }
            - { name: wildfly-modules, mountPath: /opt/jboss/wildfly/modules }
            - { name: vault-secrets, mountPath: /vault-secrets }
      containers:
        - name: schema-init
          image: quay.io/kiegroup/kie-server-showcase:7.74.1.Final
          command: ["/bin/sh","-c"]
          args:
            - |
              set -euo pipefail
              if [ -f /vault-secrets/schema-ready ]; then
                echo "Schema already present; skipping init"
                exit 0
              fi
              if [ ! -f /vault-secrets/db-env.sh ]; then
                echo "ERROR: DB credentials file not found at /vault-secrets/db-env.sh"
                exit 1
              fi
              # shellcheck disable=SC1091
              . /vault-secrets/db-env.sh
              if [ -f /vault-secrets/kie-users-env.sh ]; then
                # shellcheck disable=SC1091
                . /vault-secrets/kie-users-env.sh
              fi
              if [ -n "${KIE_SERVER_USER:-}" ] && [ -n "${KIE_SERVER_PWD:-}" ]; then
                /opt/jboss/wildfly/bin/add-user.sh -a \
                  -u "$KIE_SERVER_USER" \
                  -p "$KIE_SERVER_PWD" \
                  -g "kie-server,rest-all" \
                  -s >/dev/null 2>&1 || true
              fi
              if [ -n "${JAVA_OPTS_APPEND:-}" ]; then
                JAVA_OPTS="$JAVA_OPTS $JAVA_OPTS_APPEND"
                export JAVA_OPTS
              fi

              # The JPA overrides ConfigMap pins hbm2ddl.auto=validate (good for runtime).
              # For the one-off schema init run we need Hibernate to create missing jBPM tables,
              # so patch the copied persistence.xml to use a non-destructive mode.
              PERSISTENCE_XML="/opt/jboss/wildfly/standalone/deployments/kie-server.war/WEB-INF/classes/jpa/META-INF/persistence.xml"
              if [ -f "$PERSISTENCE_XML" ]; then
                tmp="$(mktemp)"
                sed 's/name="hibernate.hbm2ddl.auto" value="validate"/name="hibernate.hbm2ddl.auto" value="update"/' "$PERSISTENCE_XML" > "$tmp"
                mv "$tmp" "$PERSISTENCE_XML"
              fi

              KIE_SERVER_USER="${KIE_SERVER_USER:-kieserver}"
              KIE_SERVER_PWD="${KIE_SERVER_PWD:-kieserver1!}"
              /opt/jboss/wildfly/bin/standalone.sh -b 0.0.0.0 -c standalone-full-kie-server.xml \
                -Dorg.kie.server.id="kie-server-schema-init" \
                -Dorg.kie.server.user="${KIE_SERVER_USER}" \
                -Dorg.kie.server.pwd="${KIE_SERVER_PWD}" &
              PID="$!"

              # Fresh schema creation can keep WildFly booting for more than 10 minutes.
              # Give Hibernate enough time to finish before the job decides startup failed.
              READINESS_TIMEOUT_SECONDS=1200
              READINESS_START="$(date +%s)"
              while true; do
                if ! kill -0 "$PID" >/dev/null 2>&1; then
                  echo "ERROR: WildFly exited before reaching running state"
                  wait "$PID" || true
                  exit 1
                fi
                # During bootstrap jboss-cli can take ~20s+ to connect; short timeouts can false-fail the schema job.
                if timeout 30 /opt/jboss/wildfly/bin/jboss-cli.sh --connect --command=':read-attribute(name=server-state)' 2>/dev/null | grep -q running; then
                  break
                fi
                NOW="$(date +%s)"
                if [ $((NOW - READINESS_START)) -ge "$READINESS_TIMEOUT_SECONDS" ]; then
                  echo "ERROR: WildFly did not reach running state"
                  kill "$PID" >/dev/null 2>&1 || true
                  wait "$PID" || true
                  exit 1
                fi
                sleep 5
              done

              echo "Waiting for jBPM schema creation..."
              sleep 60
              if kill -0 "$PID" >/dev/null 2>&1; then
                timeout 30 /opt/jboss/wildfly/bin/jboss-cli.sh --connect --command=':shutdown' >/dev/null 2>&1 || kill "$PID" >/dev/null 2>&1 || true
              fi
              wait "$PID" || true
              echo "Schema init complete"
          env:
            - { name: JAVA_OPTS,           value: "-Xms256m -Xmx1024m -Djboss.bind.address=0.0.0.0 -Djboss.bind.address.management=0.0.0.0 -Djboss.as.management.blocking.timeout=1200 -Dorg.drools.server.filter.classes=true -Dorg.kie.server.persistence.ds=java:jboss/datasources/KieServerDS -Dorg.kie.server.persistence.dialect=org.hibernate.dialect.PostgreSQLDialect -Dorg.jbpm.persistence.jpa.properties.hibernate.hbm2ddl.auto=update -Dorg.jbpm.query.jpa.properties.hibernate.hbm2ddl.auto=update -Dorg.jbpm.persistence.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true -Dorg.jbpm.query.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true -Dhibernate.jdbc.lob.non_contextual_creation=true" }
            - { name: KIE_SERVER_EXTENSIONS, value: "BRM,DMN,BPM,CaseMgmt,Planner" }
          volumeMounts:
            - { name: kieserver-config, mountPath: /opt/jboss/wildfly/standalone/configuration }
            - { name: wildfly-modules, mountPath: /opt/jboss/wildfly/modules }
            - { name: vault-secrets, mountPath: /vault-secrets }
            - { name: kie-server-classes, mountPath: /opt/jboss/wildfly/standalone/deployments/kie-server.war/WEB-INF/classes }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kie-server-register-queries
  namespace: drools
  annotations:
    argocd.argoproj.io/sync-wave: "1"
rules:
  - apiGroups: [""]
    resources: ["endpoints"]
    resourceNames: ["kie-server"]
    verbs: ["get"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kie-server-register-queries
  namespace: drools
  annotations:
    argocd.argoproj.io/sync-wave: "1"
subjects:
  - kind: ServiceAccount
    name: drools-kie-server
    namespace: drools
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kie-server-register-queries
---
apiVersion: batch/v1
kind: Job
metadata:
  name: kie-server-register-default-queries
  namespace: drools
  annotations:
    argocd.argoproj.io/sync-options: Replace=true,Force=true
    argocd.argoproj.io/sync-wave: "6"
spec:
  backoffLimit: 1
  template:
    metadata:
      annotations:
        config.linkerd.io/proxy-env: "LINKERD2_PROXY_SHUTDOWN_ENDPOINT_ENABLED=true"
        config.linkerd.io/proxy-shutdown-endpoint-enabled: "true"
        linkerd.io/inject: enabled
    spec:
      shareProcessNamespace: true
      restartPolicy: OnFailure
      serviceAccountName: drools-kie-server
      volumes:
        - name: vault-secrets
          emptyDir: {}
        - name: default-queries
          configMap:
            name: kie-server-default-queries
            items:
              - { key: queries.json, path: queries.json, mode: 0444 }
      initContainers:
        - name: wait-for-keycloak-job
          image: alpine/k8s:1.31.4
          command: ["/bin/sh","-lc"]
          args:
            - |
              echo "Waiting for Job drools/keycloak-workbench-roles-claim to complete..."
              KEYCLOAK_JOB_WAIT_INTERVAL="${KEYCLOAK_JOB_WAIT_INTERVAL:-5}"
              while true; do
                if kubectl -n drools get job keycloak-workbench-roles-claim >/dev/null 2>&1; then
                  SUCC="$(kubectl -n drools get job keycloak-workbench-roles-claim -o jsonpath='{.status.succeeded}' 2>/dev/null || true)"; SUCC="${SUCC:-0}"
                  FAIL="$(kubectl -n drools get job keycloak-workbench-roles-claim -o jsonpath='{.status.failed}' 2>/dev/null || true)"; FAIL="${FAIL:-0}"
                  if [ "$SUCC" -ge 1 ]; then
                    break
                  fi
                  if [ "$FAIL" -ge 1 ]; then
                    echo "ERROR: keycloak-workbench-roles-claim job failed"
                    exit 1
                  fi
                else
                  echo "  └─ job not found yet..."
                fi
                sleep "$KEYCLOAK_JOB_WAIT_INTERVAL"
              done
        - name: vault-kie-user
          image: hashicorp/vault:1.15.4
          command: ["/bin/sh","-c"]
          args:
            - |
              set -euo pipefail
              export VAULT_ADDR="http://vault.vault.svc.cluster.local:8200"
              VAULT_TOKEN=$(vault write -field=token auth/kubernetes/login \
                role=drools \
                jwt=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token))
              export VAULT_TOKEN

              apk add --no-cache jq curl >/dev/null 2>&1

              ADMIN_USER="$(vault kv get -field=username secret/drools/admin 2>/dev/null || true)"
              ADMIN_PASS="$(vault kv get -field=password secret/drools/admin 2>/dev/null || true)"
              KIE_USER="$(vault kv get -field=username secret/drools/kie-user 2>/dev/null || true)"
              KIE_PASS="$(vault kv get -field=password secret/drools/kie-user 2>/dev/null || true)"
              if [ -z "${ADMIN_USER:-}" ] || [ -z "${ADMIN_PASS:-}" ]; then
                echo "ERROR: Missing drools admin creds in Vault"
                exit 1
              fi
              if [ -z "${KIE_USER:-}" ] || [ -z "${KIE_PASS:-}" ]; then
                echo "WARN: Missing drools kie-user creds in Vault"
              fi

              KIE_SERVICE_CLIENT_JSON="$(vault kv get -format=json secret/keycloak-client-id-drools-kie-server-service 2>/dev/null || true)"
              KIE_SERVICE_CLIENT_ID="$(printf '%s' "$KIE_SERVICE_CLIENT_JSON" | jq -r '.data.data.value // .data.data.id // empty')"
              KIE_SERVICE_CLIENT_SECRET_JSON="$(vault kv get -format=json secret/keycloak-client-secret-drools-kie-server-service 2>/dev/null || true)"
              KIE_SERVICE_CLIENT_SECRET="$(printf '%s' "$KIE_SERVICE_CLIENT_SECRET_JSON" | jq -r '.data.data.value // .data.data.secret // empty')"

              KIE_CLIENT_JSON="$(vault kv get -format=json secret/keycloak-client-id-drools-kie-server 2>/dev/null || true)"
              KIE_CLIENT_ID="$(printf '%s' "$KIE_CLIENT_JSON" | jq -r '.data.data.value // .data.data.id // empty')"
              KIE_CLIENT_SECRET_JSON="$(vault kv get -format=json secret/keycloak-client-secret-drools-kie-server 2>/dev/null || true)"
              KIE_CLIENT_SECRET="$(printf '%s' "$KIE_CLIENT_SECRET_JSON" | jq -r '.data.data.value // .data.data.secret // empty')"

              resolve_host() {
                local host="$1"
                if [ -z "${host:-}" ]; then
                  return 1
                fi
                if command -v getent >/dev/null 2>&1; then
                  getent hosts "$host" >/dev/null 2>&1
                  return $?
                fi
                if command -v nslookup >/dev/null 2>&1; then
                  nslookup "$host" >/dev/null 2>&1
                  return $?
                fi
                return 1
              }
              KEYCLOAK_INTERNAL_URL="${KEYCLOAK_INTERNAL_URL:-http://keycloak.keycloak.svc.cluster.local:8080}"
              KEYCLOAK_EXTERNAL_URL="${KEYCLOAK_EXTERNAL_URL:-https://auth.suncoast.systems}"
              if [ -z "${OIDC_AUTH_URL:-}" ]; then
                OIDC_AUTH_URL="$KEYCLOAK_INTERNAL_URL"
                OIDC_HOST="$(printf '%s' "$KEYCLOAK_INTERNAL_URL" | sed -E 's#^[a-zA-Z]+://([^/:]+).*#\1#')"
                if ! resolve_host "$OIDC_HOST"; then
                  OIDC_AUTH_URL="$KEYCLOAK_EXTERNAL_URL"
                fi
              fi
              OIDC_REALM="${OIDC_REALM:-internal}"

              TOKEN_GRANT=""
              TOKEN_CLIENT_ID=""
              TOKEN_CLIENT_SECRET=""
              if [ -n "${KIE_SERVICE_CLIENT_ID:-}" ] && [ -n "${KIE_SERVICE_CLIENT_SECRET:-}" ]; then
                TOKEN_GRANT="client_credentials"
                TOKEN_CLIENT_ID="$KIE_SERVICE_CLIENT_ID"
                TOKEN_CLIENT_SECRET="$KIE_SERVICE_CLIENT_SECRET"
              else
                echo "ERROR: Missing Keycloak service client credentials in Vault"
                exit 1
              fi

              {
                echo "export KIE_TOKEN_GRANT=\"$TOKEN_GRANT\""
                echo "export KIE_TOKEN_CLIENT_ID=\"$TOKEN_CLIENT_ID\""
                echo "export KIE_TOKEN_CLIENT_SECRET=\"$TOKEN_CLIENT_SECRET\""
                echo "export KIE_SERVER_USER=\"$ADMIN_USER\""
                echo "export KIE_SERVER_PWD=\"$ADMIN_PASS\""
                echo "export OIDC_AUTH_URL=\"$OIDC_AUTH_URL\""
                echo "export OIDC_REALM=\"$OIDC_REALM\""
              } > /vault-secrets/kie-users-env.sh
              echo "OK: KIE query auth ready (${TOKEN_GRANT})"
          volumeMounts:
            - { name: vault-secrets, mountPath: /vault-secrets }
      containers:
        - name: register-queries
          image: curlimages/curl:8.12.1
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
          command: ["/bin/sh","-c"]
          args:
            - |
              set -euo pipefail
              cleanup_proxy() {
                admin_url="http://127.0.0.1:4191"
                linkerd_pid=""
                for comm in /proc/[0-9]*/comm; do
                  name="$(cat "$comm" 2>/dev/null || true)"
                  case "$name" in
                    linkerd-proxy|linkerd2-proxy)
                      linkerd_pid="${comm#/proc/}"
                      linkerd_pid="${linkerd_pid%/comm}"
                      break
                      ;;
                  esac
                done
                code="$(curl -s -o /dev/null -w "%{http_code}" --max-time 2 -X POST "${admin_url}/shutdown" || true)"
                # Linkerd edge builds sometimes return 404 on /shutdown even when configured; that's not fatal.
                if [ -n "${code:-}" ] && [ "$code" != "200" ] && [ "$code" != "202" ] && [ "$code" != "404" ] && [ "$code" != "000" ]; then
                  echo "WARN: linkerd shutdown returned HTTP ${code}"
                fi
                if [ -n "${linkerd_pid}" ]; then
                  if [ "${code:-}" = "404" ]; then
                    kill -TERM "${linkerd_pid}" >/dev/null 2>&1 || true
                  fi
                  for _ in $(seq 1 20); do
                    if [ ! -e "/proc/${linkerd_pid}" ]; then
                      return 0
                    fi
                    sleep 1
                  done
                  echo "WARN: linkerd-proxy still running after shutdown"
                fi
                return 0
              }
              trap cleanup_proxy EXIT
              if [ ! -f /vault-secrets/kie-users-env.sh ]; then
                echo "ERROR: KIE credentials not found"
                exit 1
              fi
              # shellcheck disable=SC1091
              . /vault-secrets/kie-users-env.sh
              OIDC_AUTH_URL="${OIDC_AUTH_URL:-http://keycloak.keycloak.svc.cluster.local:8080}"
              OIDC_REALM="${OIDC_REALM:-internal}"
              if [ -z "${OIDC_AUTH_URL:-}" ] || [ -z "${OIDC_REALM:-}" ] || [ -z "${KIE_TOKEN_GRANT:-}" ] || [ -z "${KIE_TOKEN_CLIENT_ID:-}" ] || [ -z "${KIE_TOKEN_CLIENT_SECRET:-}" ]; then
                echo "ERROR: Missing OIDC client settings in /vault-secrets/kie-users-env.sh"
                exit 1
              fi
              DNS_WAIT_SECONDS="${DNS_WAIT_SECONDS:-120}"
              DNS_WAIT_INTERVAL="${DNS_WAIT_INTERVAL:-3}"
              HAS_RESOLVER="false"
              if command -v getent >/dev/null 2>&1 || command -v nslookup >/dev/null 2>&1; then
                HAS_RESOLVER="true"
              fi
              resolve_host() {
                local host="$1"
                if [ -z "${host:-}" ]; then
                  return 1
                fi
                if command -v getent >/dev/null 2>&1; then
                  getent hosts "$host" >/dev/null 2>&1
                  return $?
                fi
                if command -v nslookup >/dev/null 2>&1; then
                  nslookup "$host" >/dev/null 2>&1
                  return $?
                fi
                return 1
              }
              OIDC_HOST="${OIDC_AUTH_URL#*://}"
              OIDC_HOST="${OIDC_HOST%%/*}"
              OIDC_HOST="${OIDC_HOST%%:*}"
              if [ "$HAS_RESOLVER" = "true" ] && [ -n "${OIDC_HOST:-}" ] && ! resolve_host "$OIDC_HOST"; then
                start="$(date +%s)"
                while true; do
                  if resolve_host "$OIDC_HOST"; then
                    break
                  fi
                  now="$(date +%s)"
                  if [ $((now - start)) -ge "$DNS_WAIT_SECONDS" ]; then
                    echo "ERROR: DNS lookup failed for $OIDC_HOST after ${DNS_WAIT_SECONDS}s"
                    exit 1
                  fi
                  echo "Waiting for DNS to resolve $OIDC_HOST..."
                  sleep "$DNS_WAIT_INTERVAL"
                done
              fi

              TOKEN_WAIT_SECONDS="${TOKEN_WAIT_SECONDS:-300}"
              TOKEN_WAIT_INTERVAL="${TOKEN_WAIT_INTERVAL:-5}"
              fetch_token() {
                local token start now resp body code
                start="$(date +%s)"
                while true; do
                  resp="$(curl -sS -w '\n%{http_code}' -X POST "${OIDC_AUTH_URL}/realms/${OIDC_REALM}/protocol/openid-connect/token" \
                    -H "Content-Type: application/x-www-form-urlencoded" \
                    --data-urlencode "grant_type=client_credentials" \
                    --data-urlencode "client_id=${KIE_TOKEN_CLIENT_ID}" \
                    --data-urlencode "client_secret=${KIE_TOKEN_CLIENT_SECRET}" \
                    || true)"
                  body="$(printf '%s' "$resp" | sed '$d')"
                  code="$(printf '%s' "$resp" | tail -n 1)"
                  # Extract access_token from the JSON response (POSIX BRE capture group is \(...\)).
                  token="$(printf '%s' "$body" | sed -n 's/.*"access_token":"\([^"]*\)".*/\1/p')"
                  if [ -n "${token:-}" ]; then
                    KIE_TOKEN="$token"
                    return 0
                  fi
                  if [ -n "${code:-}" ] && [ "$code" != "200" ]; then
                    echo "Token request failed (HTTP $code)"
                    if [ -n "${body:-}" ]; then
                      printf '%s\n' "$body" | head -c 400
                      echo
                    fi
                  fi
                  now="$(date +%s)"
                  if [ $((now - start)) -ge "$TOKEN_WAIT_SECONDS" ]; then
                    return 1
                  fi
                  echo "Waiting for Keycloak token..."
                  sleep "$TOKEN_WAIT_INTERVAL"
                done
              }

              KIE_QUERY_FALLBACK_BASIC="${KIE_QUERY_FALLBACK_BASIC:-true}"
              BASIC_AUTH_HEADER=""
              if [ -n "${KIE_SERVER_USER:-}" ] && [ -n "${KIE_SERVER_PWD:-}" ]; then
                BASIC_AUTH_HEADER="Authorization: Basic $(printf '%s:%s' "$KIE_SERVER_USER" "$KIE_SERVER_PWD" | base64)"
              fi

              AUTH_MODE="token"
              if fetch_token; then
                AUTH_HEADER="Authorization: Bearer ${KIE_TOKEN}"
              else
                if [ "$KIE_QUERY_FALLBACK_BASIC" = "true" ] && [ -n "${BASIC_AUTH_HEADER:-}" ]; then
                  AUTH_MODE="basic"
                  AUTH_HEADER="$BASIC_AUTH_HEADER"
                else
                  echo "ERROR: Unable to obtain Keycloak token"
                  exit 1
                fi
              fi
              KIE_HOSTS="kie-server.drools.svc.cluster.local"
              KIE_READY_WAIT_SECONDS="${KIE_READY_WAIT_SECONDS:-900}"
              KIE_READY_WAIT_INTERVAL="${KIE_READY_WAIT_INTERVAL:-5}"

              # The query-definition REST API is provided by the jBPM KIE Server extension.
              # If it's missing, either the extension isn't enabled or it failed to initialize (often DB schema/sequences).
              # You can explicitly allow skipping this job with ALLOW_MISSING_QUERY_API=true.
              set -- $KIE_HOSTS
              if [ -z "${1:-}" ]; then
                echo "ERROR: KIE_HOSTS is empty"
                exit 1
              fi
              KIE_PROBE_HOST="$1"
              KIE_SERVER_BASE="http://${KIE_PROBE_HOST}:8080/kie-server/services/rest/server"
              start="$(date +%s)"
              while true; do
                code=$(curl -s -o /dev/null -w "%{http_code}" -H "$AUTH_HEADER" "$KIE_SERVER_BASE")
                if [ "$code" = "401" ] || [ "$code" = "403" ]; then
                  if [ "$AUTH_MODE" = "token" ]; then
                    if fetch_token; then
                      AUTH_HEADER="Authorization: Bearer ${KIE_TOKEN}"
                      code=$(curl -s -o /dev/null -w "%{http_code}" -H "$AUTH_HEADER" "$KIE_SERVER_BASE")
                    fi
                    if [ "$code" = "401" ] || [ "$code" = "403" ]; then
                      if [ "$KIE_QUERY_FALLBACK_BASIC" = "true" ] && [ -n "${BASIC_AUTH_HEADER:-}" ]; then
                        AUTH_MODE="basic"
                        AUTH_HEADER="$BASIC_AUTH_HEADER"
                        code=$(curl -s -o /dev/null -w "%{http_code}" -H "$AUTH_HEADER" "$KIE_SERVER_BASE")
                      fi
                    fi
                  fi
                fi
                if [ "$code" = "200" ]; then
                  break
                fi
                now="$(date +%s)"
                if [ $((now - start)) -ge "$KIE_READY_WAIT_SECONDS" ]; then
                  echo "ERROR: KIE server ${KIE_PROBE_HOST} not ready"
                  exit 1
                fi
                echo "Waiting for KIE server ${KIE_PROBE_HOST}... (HTTP $code)"
                sleep "$KIE_READY_WAIT_INTERVAL"
              done

              ALLOW_MISSING_QUERY_API="${ALLOW_MISSING_QUERY_API:-false}"
              query_api_code="$(curl -s -o /dev/null -w "%{http_code}" -H "$AUTH_HEADER" "$KIE_SERVER_BASE/queries/definitions" || true)"
              if [ "$query_api_code" = "404" ]; then
                if [ "$ALLOW_MISSING_QUERY_API" = "true" ]; then
                  echo "WARN: KIE server does not expose query definition API; skipping default query registration"
                  exit 0
                fi
                echo "ERROR: KIE server query definition API not found (HTTP 404)."
                echo "  This usually means the jBPM KIE Server extension did not initialize (check for missing DB schema/sequences)."
                exit 1
              fi

              parse_queries() {
                # Emit each JSON object as a single line to keep /bin/sh compatibility (no read -d / $'...').
                awk '
                  BEGIN { depth=0; inobj=0; obj="" }
                  {
                    line=$0
                    if (!inobj) {
                      stripped=line
                      gsub(/[[:space:]]/, "", stripped)
                      if (stripped == "[" || stripped == "]" || stripped == "") {
                        next
                      }
                    }
                    for (i = 1; i <= length(line); i++) {
                      ch = substr(line, i, 1)
                      if (ch == "{") {
                        if (depth == 0) {
                          inobj = 1
                          obj = ""
                        }
                        depth++
                      } else if (ch == "}") {
                        depth--
                      }
                    }
                    if (inobj) {
                      if (depth == 0) {
                        sub(/,[[:space:]]*$/, "", line)
                      }
                      obj = obj line
                      if (depth == 0) {
                        print obj
                        obj=""
                        inobj=0
                      }
                    }
                  }
                ' /queries/queries.json
              }

              parse_queries | while IFS= read -r item; do
                name="$(printf '%s' "$item" | sed -n 's/.*"query-name"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')"
                if [ -z "${name:-}" ]; then
                  echo "ERROR: Unable to parse query-name from queries.json object"
                  printf '%s\n' "$item" | head -c 400 || true
                  echo
                  exit 1
                fi
                for host in $KIE_HOSTS; do
                  KIE_SERVER_BASE="http://${host}:8080/kie-server/services/rest/server"
                  start="$(date +%s)"
                  while true; do
                    code=$(curl -s -o /dev/null -w "%{http_code}" -H "$AUTH_HEADER" "$KIE_SERVER_BASE")
                    if [ "$code" = "401" ] || [ "$code" = "403" ]; then
                      if [ "$AUTH_MODE" = "token" ]; then
                        if fetch_token; then
                          AUTH_HEADER="Authorization: Bearer ${KIE_TOKEN}"
                          code=$(curl -s -o /dev/null -w "%{http_code}" -H "$AUTH_HEADER" "$KIE_SERVER_BASE")
                        fi
                        if [ "$code" = "401" ] || [ "$code" = "403" ]; then
                          if [ "$KIE_QUERY_FALLBACK_BASIC" = "true" ] && [ -n "${BASIC_AUTH_HEADER:-}" ]; then
                            AUTH_MODE="basic"
                            AUTH_HEADER="$BASIC_AUTH_HEADER"
                            code=$(curl -s -o /dev/null -w "%{http_code}" -H "$AUTH_HEADER" "$KIE_SERVER_BASE")
                          fi
                        fi
                      fi
                    fi
                    if [ "$code" = "200" ]; then
                      break
                    fi
                    now="$(date +%s)"
                    if [ $((now - start)) -ge "$KIE_READY_WAIT_SECONDS" ]; then
                      echo "ERROR: KIE server ${host} not ready"
                      exit 1
                    fi
                    echo "Waiting for KIE server ${host}... (HTTP $code)"
                    sleep "$KIE_READY_WAIT_INTERVAL"
                  done
                  http=$(curl -s -o /dev/null -w "%{http_code}" -H "$AUTH_HEADER" \
                    -H "Content-Type: application/json" \
                    -H "X-KIE-ContentType: JSON" \
                    -X PUT "$KIE_SERVER_BASE/queries/definitions/$name" \
                    -d "$item")
                  if [ "$http" = "401" ] || [ "$http" = "403" ]; then
                    if [ "$AUTH_MODE" = "token" ]; then
                      if fetch_token; then
                        AUTH_HEADER="Authorization: Bearer ${KIE_TOKEN}"
                        http=$(curl -s -o /dev/null -w "%{http_code}" -H "$AUTH_HEADER" \
                          -H "Content-Type: application/json" \
                          -H "X-KIE-ContentType: JSON" \
                          -X PUT "$KIE_SERVER_BASE/queries/definitions/$name" \
                          -d "$item")
                      fi
                      if [ "$http" = "401" ] || [ "$http" = "403" ]; then
                        if [ "$KIE_QUERY_FALLBACK_BASIC" = "true" ] && [ -n "${BASIC_AUTH_HEADER:-}" ]; then
                          AUTH_MODE="basic"
                          AUTH_HEADER="$BASIC_AUTH_HEADER"
                          http=$(curl -s -o /dev/null -w "%{http_code}" -H "$AUTH_HEADER" \
                            -H "Content-Type: application/json" \
                            -H "X-KIE-ContentType: JSON" \
                            -X PUT "$KIE_SERVER_BASE/queries/definitions/$name" \
                            -d "$item")
                        fi
                      fi
                    fi
                  fi
                  if [ "$http" != "200" ] && [ "$http" != "201" ]; then
                    payload_file="/tmp/query-${name}.json"
                    resp_headers="/tmp/query-${name}-headers.txt"
                    resp_body="/tmp/query-${name}-body.txt"
                    printf "%s\n" "$item" > "$payload_file"
                    http=$(curl -s -w "%{http_code}" -o "$resp_body" -D "$resp_headers" -H "$AUTH_HEADER" \
                      -H "Content-Type: application/json" \
                      -H "X-KIE-ContentType: JSON" \
                      -X PUT "$KIE_SERVER_BASE/queries/definitions/$name" \
                      -d "$item")
                    echo "ERROR: Failed to register $name on ${host} (HTTP $http)"
                    echo "--- payload $payload_file ---"
                    cat "$payload_file" || true
                    echo "--- response headers $resp_headers ---"
                    cat "$resp_headers" || true
                    echo "--- response body $resp_body ---"
                    cat "$resp_body" || true
                    exit 1
                  fi
                  echo "Registered $name on ${host} (HTTP $http)"
                done
              done
              echo "All default queries registered on all KIE server pods"
              cleanup_proxy || true
              sleep 2
          volumeMounts:
            - { name: vault-secrets, mountPath: /vault-secrets }
            - { name: default-queries, mountPath: /queries }
---
apiVersion: v1
kind: Service
metadata:
  name: kie-server-headless
  namespace: drools
  labels:
    app: kie-server
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  clusterIP: None
  selector:
    app: kie-server
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kie-server
  namespace: drools
  labels:
    app: kie-server
  annotations:
    reloader.stakater.com/auto: "true"
    argocd.argoproj.io/sync-wave: "4"
spec:
  serviceName: kie-server-headless
  replicas: 2
  selector:
    matchLabels: { app: kie-server }
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: kie-server
    spec:
      serviceAccountName: drools-kie-server
      volumes:
        - name: kieserver-config
          emptyDir: {}
        - name: redirect-cli
          configMap:
            name: kieserver-redirect-cli
            items:
              - { key: enable-redirect.cli, path: enable-redirect.cli, mode: 0444 }
              - { key: run-cli.sh,        path: run-cli.sh,        mode: 0555 }
        - name: welcome-content
          emptyDir: {}
        - name: vault-secrets
          emptyDir: {}
        - name: kie-m2
          emptyDir: {}
        - name: wildfly-oidc
          configMap:
            name: wildfly-oidc-config-kieserver
            items:
              - { key: enable-oidc.cli,    path: enable-oidc.cli,    mode: 0444 }
              - { key: configure-oidc.sh,  path: configure-oidc.sh,  mode: 0555 }
        - name: wildfly-modules
          emptyDir: {}
        - name: kie-server-classes
          emptyDir: {}
        - name: kie-server-jpa-overrides
          configMap:
            name: kie-server-jpa-overrides
            items:
              - { key: persistence.xml, path: persistence.xml, mode: 0444 }
              - { key: query-definition-override.orm.xml, path: query-definition-override.orm.xml, mode: 0444 }
      initContainers:
        - name: wait-for-keycloak-job
          image: alpine/k8s:1.31.4
          command: ["/bin/sh","-lc"]
          args:
            - |
              echo "Waiting for Job drools/keycloak-workbench-roles-claim to complete..."
              KEYCLOAK_JOB_WAIT_INTERVAL="${KEYCLOAK_JOB_WAIT_INTERVAL:-5}"
              while true; do
                if kubectl -n drools get job keycloak-workbench-roles-claim >/dev/null 2>&1; then
                  SUCC="$(kubectl -n drools get job keycloak-workbench-roles-claim -o jsonpath='{.status.succeeded}' 2>/dev/null || true)"; SUCC="${SUCC:-0}"
                  FAIL="$(kubectl -n drools get job keycloak-workbench-roles-claim -o jsonpath='{.status.failed}' 2>/dev/null || true)"; FAIL="${FAIL:-0}"
                  if [ "$SUCC" -ge 1 ]; then
                    break
                  fi
                  if [ "$FAIL" -ge 1 ]; then
                    echo "ERROR: keycloak-workbench-roles-claim job failed"
                    exit 1
                  fi
                else
                  echo "  └─ job not found yet..."
                fi
                sleep "$KEYCLOAK_JOB_WAIT_INTERVAL"
              done
        - name: wait-for-config-job
          image: alpine/k8s:1.31.4
          command: ["/bin/sh","-lc"]
          args:
            - |
              echo "Waiting for Job vault/drools-yugabyte-config to complete..."
              while true; do
                if ! kubectl -n vault get job drools-yugabyte-config >/dev/null 2>&1; then
                  echo "  └─ job not found yet..."; sleep 5; continue
                fi
                SUCC="$(kubectl -n vault get job drools-yugabyte-config -o jsonpath='{.status.succeeded}' 2>/dev/null || true)"; SUCC="${SUCC:-0}"
                [ "$SUCC" -ge 1 ] && break
                sleep 5
              done
        - name: apply-jpa-overrides
          image: quay.io/kiegroup/kie-server-showcase:7.74.1.Final
          command: ["/bin/sh","-c"]
          args:
            - |
              set -euo pipefail
              cp -R /opt/jboss/wildfly/standalone/deployments/kie-server.war/WEB-INF/classes/. /target/
              mkdir -p /target/jpa/META-INF /target/META-INF
              cp /override/persistence.xml /target/jpa/META-INF/persistence.xml
              cp /override/query-definition-override.orm.xml /target/META-INF/QueryDefinitionOverride.orm.xml
              echo "✅ JPA overrides applied"
          volumeMounts:
            - { name: kie-server-classes, mountPath: /target }
            - { name: kie-server-jpa-overrides, mountPath: /override }
        - name: vault-kie-users
          image: hashicorp/vault:1.15.4
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              export VAULT_ADDR="http://vault.vault.svc.cluster.local:8200"
              apk add --no-cache jq curl
              VAULT_TOKEN=$(vault write -field=token auth/kubernetes/login \
                role=drools \
                jwt=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token))
              export VAULT_TOKEN

              OIDC_ENV_FILE="/shared/oidc-env.sh"
              : > "$OIDC_ENV_FILE"
              resolve_host() {
                local host="$1"
                if [ -z "${host:-}" ]; then
                  return 1
                fi
                if command -v getent >/dev/null 2>&1; then
                  getent hosts "$host" >/dev/null 2>&1
                  return $?
                fi
                if command -v nslookup >/dev/null 2>&1; then
                  nslookup "$host" >/dev/null 2>&1
                  return $?
                fi
                return 0
              }
              KEYCLOAK_INTERNAL_URL="${KEYCLOAK_INTERNAL_URL:-http://keycloak.keycloak.svc.cluster.local:8080}"
              KEYCLOAK_EXTERNAL_URL="${KEYCLOAK_EXTERNAL_URL:-https://auth.suncoast.systems}"
              OIDC_AUTH_URL="${OIDC_AUTH_URL:-$KEYCLOAK_EXTERNAL_URL}"
              OIDC_REALM="internal"
              OIDC_KIE_SERVER_AUTH_URL="${OIDC_KIE_SERVER_AUTH_URL:-$KEYCLOAK_INTERNAL_URL}"
              OIDC_INTERNAL_HOST="$(printf '%s' "$KEYCLOAK_INTERNAL_URL" | sed -E 's#^[a-zA-Z]+://([^/:]+).*#\1#')"
              if ! resolve_host "$OIDC_INTERNAL_HOST"; then
                OIDC_KIE_SERVER_AUTH_URL="$OIDC_AUTH_URL"
              fi
              echo "export OIDC_AUTH_URL=\"$OIDC_AUTH_URL\"" >> "$OIDC_ENV_FILE"
              echo "export OIDC_REALM=\"$OIDC_REALM\"" >> "$OIDC_ENV_FILE"
              echo 'export OIDC_ENABLE_BASIC_AUTH="false"' >> "$OIDC_ENV_FILE"
              echo 'export OIDC_BEARER_ONLY="false"' >> "$OIDC_ENV_FILE"
              echo "export OIDC_KIE_SERVER_AUTH_URL=\"$OIDC_KIE_SERVER_AUTH_URL\"" >> "$OIDC_ENV_FILE"
              echo "export OIDC_KIE_SERVER_REALM=\"$OIDC_REALM\"" >> "$OIDC_ENV_FILE"
              echo 'export OIDC_KIE_SERVER_ENABLE_BASIC_AUTH="false"' >> "$OIDC_ENV_FILE"
              echo 'export OIDC_KIE_SERVER_BEARER_ONLY="false"' >> "$OIDC_ENV_FILE"

              REALM_JSON="$(curl -fsSL "$OIDC_AUTH_URL/realms/$OIDC_REALM")"
              OIDC_PUBLIC_KEY="$(printf '%s' "$REALM_JSON" | jq -r '.public_key // empty')"
              if [ -z "${OIDC_PUBLIC_KEY:-}" ]; then
                echo "❌ Keycloak realm public key not found"
                exit 1
              fi
              OIDC_PUBLIC_KEY_PEM="$(printf '-----BEGIN PUBLIC KEY-----\n%s\n-----END PUBLIC KEY-----' "$OIDC_PUBLIC_KEY")"
              printf 'export OIDC_JWT_PUBLIC_KEY="%s"\n' "$OIDC_PUBLIC_KEY_PEM" >> "$OIDC_ENV_FILE"

              WB_ID_JSON="$(vault kv get -format=json secret/keycloak-client-id-drools-workbench 2>/dev/null || true)"
              WB_ID="$(printf '%s' "$WB_ID_JSON" | jq -r '.data.data.value // .data.data.id // empty')"
              if [ -z "${WB_ID:-}" ]; then
                echo "❌ OIDC client id not found at secret/keycloak-client-id-drools-workbench"
                exit 1
              fi
              echo "export OIDC_CLIENT_ID=\"$WB_ID\"" >> "$OIDC_ENV_FILE"

              WB_SECRET_JSON="$(vault kv get -format=json secret/keycloak-client-secret-drools-workbench 2>/dev/null || true)"
              WB_SECRET="$(printf '%s' "$WB_SECRET_JSON" | jq -r '.data.data.value // .data.data.secret // empty')"
              if [ -z "${WB_SECRET:-}" ]; then
                echo "❌ OIDC client secret not found at secret/keycloak-client-secret-drools-workbench"
                exit 1
              fi
              echo "export OIDC_CLIENT_SECRET=\"$WB_SECRET\"" >> "$OIDC_ENV_FILE"

              KIE_OIDC_ID_JSON="$(vault kv get -format=json secret/keycloak-client-id-drools-kie-server 2>/dev/null || true)"
              KIE_OIDC_ID="$(printf '%s' "$KIE_OIDC_ID_JSON" | jq -r '.data.data.value // .data.data.id // empty')"
              if [ -z "${KIE_OIDC_ID:-}" ]; then
                echo "❌ OIDC client id not found at secret/keycloak-client-id-drools-kie-server"
                exit 1
              fi
              echo "export OIDC_KIE_SERVER_CLIENT_ID=\"$KIE_OIDC_ID\"" >> "$OIDC_ENV_FILE"

              KIE_OIDC_SECRET_JSON="$(vault kv get -format=json secret/keycloak-client-secret-drools-kie-server 2>/dev/null || true)"
              KIE_OIDC_SECRET="$(printf '%s' "$KIE_OIDC_SECRET_JSON" | jq -r '.data.data.value // .data.data.secret // empty')"
              if [ -z "${KIE_OIDC_SECRET:-}" ]; then
                echo "❌ OIDC client secret not found at secret/keycloak-client-secret-drools-kie-server"
                exit 1
              fi
              echo "export OIDC_KIE_SERVER_CLIENT_SECRET=\"$KIE_OIDC_SECRET\"" >> "$OIDC_ENV_FILE"

              GH_USER_JSON="$(vault kv get -format=json secret/k8s-rules-engine-github-packages-username 2>/dev/null || true)"
              GH_USER="$(printf '%s' "$GH_USER_JSON" | jq -r '.data.data.value // empty')"
              GH_TOKEN_JSON="$(vault kv get -format=json secret/k8s-rules-engine-github-packages-token 2>/dev/null || true)"
              GH_TOKEN="$(printf '%s' "$GH_TOKEN_JSON" | jq -r '.data.data.value // empty')"
              if [ -z "${GH_USER:-}" ] || [ -z "${GH_TOKEN:-}" ]; then
                echo "❌ Missing GitHub Packages credentials in Vault"
                exit 1
              fi
              K8S_API="https://kubernetes.default.svc"
              SA_TOKEN="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
              CA_CERT="/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
              EXTRA_REPOS="$(curl -fsS --cacert "$CA_CERT" -H "Authorization: Bearer $SA_TOKEN" \
                "$K8S_API/api/v1/namespaces/drools/configmaps?labelSelector=rules.dotcomrow/maven-repo%3Dtrue" \
                | jq -r '.items[]? | select(.data["repo-id"] and .data["repo-url"]) | "\(.data["repo-id"])|\(.data["repo-url"])"' \
                | sort -u || true)"
              EXTRA_REPO_SERVERS=""
              EXTRA_REPO_BLOCKS=""
              EXTRA_PLUGIN_REPO_BLOCKS=""
              if [ -n "${EXTRA_REPOS:-}" ]; then
                IFS=$'\n'
                for entry in $EXTRA_REPOS; do
                  repo_id="${entry%%|*}"
                  repo_url="${entry#*|}"
                  case "$repo_id" in
                    github|central|guvnor-m2-repo|kie-server)
                      continue
                      ;;
                  esac
                  EXTRA_REPO_SERVERS="${EXTRA_REPO_SERVERS}
                  <server>
                    <id>${repo_id}</id>
                    <username>${GH_USER}</username>
                    <password>${GH_TOKEN}</password>
                  </server>"
                  EXTRA_REPO_BLOCKS="${EXTRA_REPO_BLOCKS}
                      <repository>
                        <id>${repo_id}</id>
                        <url>${repo_url}</url>
                        <releases><enabled>true</enabled></releases>
                        <snapshots><enabled>true</enabled></snapshots>
                      </repository>"
                  EXTRA_PLUGIN_REPO_BLOCKS="${EXTRA_PLUGIN_REPO_BLOCKS}
                      <pluginRepository>
                        <id>${repo_id}</id>
                        <url>${repo_url}</url>
                        <releases><enabled>true</enabled></releases>
                        <snapshots><enabled>true</enabled></snapshots>
                      </pluginRepository>"
                done
                unset IFS
              fi
              mkdir -p /kie-m2
              cat > /kie-m2/settings.xml <<EOF
              <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                        xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                        xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 https://maven.apache.org/xsd/settings-1.0.0.xsd">
                <servers>
                  <server>
                    <id>github</id>
                    <username>${GH_USER}</username>
                    <password>${GH_TOKEN}</password>
                  </server>
                  <server>
                    <id>guvnor-m2-repo</id>
                    <username>${GH_USER}</username>
                    <password>${GH_TOKEN}</password>
                  </server>
                  <server>
                    <id>kie-server</id>
                    <username>${GH_USER}</username>
                    <password>${GH_TOKEN}</password>
                  </server>
                  ${EXTRA_REPO_SERVERS}
                </servers>
                <profiles>
                  <profile>
                    <id>github</id>
                    <repositories>
                      ${EXTRA_REPO_BLOCKS}
                      <repository>
                        <id>central</id>
                        <url>https://repo1.maven.org/maven2/</url>
                        <releases><enabled>true</enabled></releases>
                        <snapshots><enabled>false</enabled></snapshots>
                      </repository>
                    </repositories>
                    <pluginRepositories>
                      ${EXTRA_PLUGIN_REPO_BLOCKS}
                      <pluginRepository>
                        <id>central</id>
                        <url>https://repo1.maven.org/maven2/</url>
                        <releases><enabled>true</enabled></releases>
                        <snapshots><enabled>false</enabled></snapshots>
                      </pluginRepository>
                    </pluginRepositories>
                  </profile>
                </profiles>
                <activeProfiles>
                  <activeProfile>github</activeProfile>
                </activeProfiles>
              </settings>
              EOF
              echo "✅ GitHub Packages Maven settings created"

              echo "🔑 Fetching database credentials from Vault..."
              vault read -format=json yugabyte-db/static-creds/drools-yb-admin > /shared/db-creds.json
              DB_USERNAME="$(jq -r '.data.username' /shared/db-creds.json)"
              DB_PASSWORD="$(jq -r '.data.password' /shared/db-creds.json)"
              if [ -z "${DB_USERNAME:-}" ] || [ -z "${DB_PASSWORD:-}" ]; then
                echo "❌ Missing Yugabyte credentials in Vault"
                exit 1
              fi
              DB_URL="jdbc:postgresql://yb-tserver-service.yugabyte.svc.cluster.local:5433/drools?currentSchema=kie_server&sslmode=disable"
              DB_ENV_FILE="/shared/db-env.sh"
              {
                echo "export KIE_SERVER_DB_USERNAME=\"$DB_USERNAME\""
                echo "export KIE_SERVER_DB_PASSWORD=\"$DB_PASSWORD\""
                echo "export KIE_SERVER_DB_URL=\"$DB_URL\""
              } > "$DB_ENV_FILE"
              echo "✅ Database credentials retrieved: user=$DB_USERNAME"

              # Optional: per-rules-app datasource credentials (server-managed datasource via JNDI).
              # This app uses Vault KV (static creds) so there is no rotation on the KIE server side.
              TOOL_USE_POLICY_JSON="$(vault kv get -format=json secret/tool-use-policy/db 2>/dev/null || true)"
              TOOL_USE_POLICY_DB_USERNAME="$(printf '%s' "${TOOL_USE_POLICY_JSON}" | jq -r '.data.data.username // empty' || true)"
              TOOL_USE_POLICY_DB_PASSWORD="$(printf '%s' "${TOOL_USE_POLICY_JSON}" | jq -r '.data.data.password // empty' || true)"
              if [ -n "${TOOL_USE_POLICY_DB_USERNAME:-}" ] && [ -n "${TOOL_USE_POLICY_DB_PASSWORD:-}" ]; then
                TOOL_USE_POLICY_DB_URL="jdbc:postgresql://yb-tserver-service.yugabyte.svc.cluster.local:5433/rules_tool_use?currentSchema=tool_use&sslmode=disable"
                {
                  echo "export TOOL_USE_POLICY_DB_USERNAME=\"$TOOL_USE_POLICY_DB_USERNAME\""
                  echo "export TOOL_USE_POLICY_DB_PASSWORD=\"$TOOL_USE_POLICY_DB_PASSWORD\""
                  echo "export TOOL_USE_POLICY_DB_URL=\"$TOOL_USE_POLICY_DB_URL\""
                } >> "$DB_ENV_FILE"
                echo "✅ Tool Use Policy DB credentials retrieved"
              else
                echo "ℹ️  Tool Use Policy DB creds not found; ToolUsePolicyDS will not be configured"
              fi

              KIE_ENV_FILE="/shared/kie-users-env.sh"
              : > "$KIE_ENV_FILE"
              ADMIN_JSON="$(vault kv get -format=json secret/drools/admin 2>/dev/null || true)"
              ADMIN_USER="$(printf '%s' "$ADMIN_JSON" | jq -r '.data.data.username // empty')"
              ADMIN_PASS="$(printf '%s' "$ADMIN_JSON" | jq -r '.data.data.password // empty')"
              KIE_USER_JSON="$(vault kv get -format=json secret/drools/kie-user 2>/dev/null || true)"
              KIE_USER="$(printf '%s' "$KIE_USER_JSON" | jq -r '.data.data.username // empty')"
              KIE_PASS="$(printf '%s' "$KIE_USER_JSON" | jq -r '.data.data.password // empty')"
              if [ -z "${ADMIN_USER:-}" ] || [ -z "${ADMIN_PASS:-}" ]; then
                echo "Missing drools admin creds in Vault"
                exit 1
              fi
              {
                echo "export KIE_SERVER_CONTROLLER_USER=\"$ADMIN_USER\""
                echo "export KIE_SERVER_CONTROLLER_PWD=\"$ADMIN_PASS\""
                echo "export KIE_SERVER_USER=\"$ADMIN_USER\""
                echo "export KIE_SERVER_PWD=\"$ADMIN_PASS\""
              } > "$KIE_ENV_FILE"
          volumeMounts:
            - name: vault-secrets
              mountPath: /shared
            - name: kie-m2
              mountPath: /kie-m2
        - name: configure-root-redirect
          image: quay.io/kiegroup/kie-server-showcase:7.74.1.Final
          command: ["/bin/sh","-c"]
          args: ["/redirect/run-cli.sh"]
          volumeMounts:
            - { name: kieserver-config, mountPath: /config }
            - { name: redirect-cli,     mountPath: /redirect }
        - name: copy-wildfly-modules
          image: quay.io/kiegroup/kie-server-showcase:7.74.1.Final
          command: ["/bin/sh","-c"]
          args:
            - |
              set -euo pipefail
              cp -R /opt/jboss/wildfly/modules/. /target/
              echo "✅ WildFly modules copied"
          volumeMounts:
            - { name: wildfly-modules, mountPath: /target }
        - name: install-keycloak-adapter
          image: alpine:3.20
          command: ["/bin/sh","-c"]
          env:
            - name: KEYCLOAK_ADAPTER_URL
              value: "https://repo1.maven.org/maven2/org/keycloak/keycloak-wildfly-adapter-dist/16.1.1/keycloak-wildfly-adapter-dist-16.1.1.zip"
          args:
            - |
              set -euo pipefail
              apk add --no-cache curl unzip
              WORK="/tmp/keycloak"
              mkdir -p "$WORK"
              echo "⬇️  Downloading Keycloak WildFly adapter..."
              curl -fsSL "$KEYCLOAK_ADAPTER_URL" -o "$WORK/adapter.zip"
              unzip -q "$WORK/adapter.zip" -d "$WORK"
              ADAPTER_DIR="$(find "$WORK" -maxdepth 1 -type d -name "keycloak-wildfly-adapter-dist*" | head -n1)"
              if [ -z "$ADAPTER_DIR" ] || [ ! -d "$ADAPTER_DIR/modules" ]; then
                if [ -d "$WORK/modules" ]; then
                  ADAPTER_DIR="$WORK"
                else
                  echo "❌ Keycloak adapter modules not found in distribution."
                  find "$WORK" -maxdepth 2 -type d -name "modules" -print || true
                  exit 1
                fi
              fi
              cp -R "$ADAPTER_DIR/modules/." /target/
              if [ -d /target/system/add-ons/keycloak/org/keycloak ]; then
                mkdir -p /target/system/layers/base/org
                cp -R /target/system/add-ons/keycloak/org/keycloak /target/system/layers/base/org/
              fi
              echo "✅ Keycloak adapter modules installed"
          volumeMounts:
            - { name: wildfly-modules, mountPath: /target }
        - name: install-postgresql-driver
          image: alpine:3.20
          command: ["/bin/sh","-c"]
          env:
            - name: POSTGRESQL_DRIVER_VERSION
              value: "42.7.4"
          args:
            - |
              set -euo pipefail
              apk add --no-cache curl
              DEST="/target/system/layers/base/org/postgresql/main"
              mkdir -p "$DEST"
              JAR="postgresql-${POSTGRESQL_DRIVER_VERSION}.jar"
              URL="https://repo1.maven.org/maven2/org/postgresql/postgresql/${POSTGRESQL_DRIVER_VERSION}/${JAR}"
              echo "⬇️  Downloading PostgreSQL JDBC driver..."
              curl -fsSL "$URL" -o "$DEST/$JAR"
              cat > "$DEST/module.xml" <<EOF
              <module name="org.postgresql" xmlns="urn:jboss:module:1.3">
                <resources>
                  <resource-root path="${JAR}"/>
                </resources>
                <dependencies>
                  <module name="javax.api"/>
                  <module name="javax.transaction.api"/>
                </dependencies>
              </module>
              EOF
              echo "✅ PostgreSQL driver module installed"
          volumeMounts:
            - { name: wildfly-modules, mountPath: /target }
        - name: configure-datasource
          image: quay.io/kiegroup/kie-server-showcase:7.74.1.Final
          command: ["/bin/sh","-c"]
          args:
            - |
              set -euo pipefail
              if [ ! -f /vault-secrets/db-env.sh ]; then
                echo "❌ DB credentials file not found at /vault-secrets/db-env.sh"
                exit 1
              fi
              # shellcheck disable=SC1091
              . /vault-secrets/db-env.sh
              CLI="/tmp/configure-datasource.cli"
              cat > "$CLI" <<EOF
              embed-server --std-out=echo --server-config=standalone-full-kie-server.xml
              if (outcome != success) of /subsystem=datasources/jdbc-driver=postgresql:read-resource
                /subsystem=datasources/jdbc-driver=postgresql:add(driver-name=postgresql, driver-module-name=org.postgresql, driver-class-name=org.postgresql.Driver)
              end-if
              if (outcome != success) of /subsystem=datasources/data-source=KieServerDS:read-resource
                /subsystem=datasources/data-source=KieServerDS:add(jndi-name="java:jboss/datasources/KieServerDS", driver-name="postgresql", connection-url="${KIE_SERVER_DB_URL}", user-name="${KIE_SERVER_DB_USERNAME}", password="${KIE_SERVER_DB_PASSWORD}", min-pool-size=5, max-pool-size=20, enabled=true)
              end-if
              EOF
              if [ -n "${TOOL_USE_POLICY_DB_URL:-}" ] && [ -n "${TOOL_USE_POLICY_DB_USERNAME:-}" ] && [ -n "${TOOL_USE_POLICY_DB_PASSWORD:-}" ]; then
              cat >> "$CLI" <<EOF
              if (outcome != success) of /subsystem=datasources/data-source=ToolUsePolicyDS:read-resource
                /subsystem=datasources/data-source=ToolUsePolicyDS:add(jndi-name="java:jboss/datasources/ToolUsePolicyDS", driver-name="postgresql", connection-url="${TOOL_USE_POLICY_DB_URL}", user-name="${TOOL_USE_POLICY_DB_USERNAME}", password="${TOOL_USE_POLICY_DB_PASSWORD}", min-pool-size=1, max-pool-size=5, enabled=true)
              end-if
              EOF
              fi
              cat >> "$CLI" <<EOF
              stop-embedded-server
              EOF
              /opt/jboss/wildfly/bin/jboss-cli.sh --file="$CLI"
          volumeMounts:
            - { name: kieserver-config, mountPath: /opt/jboss/wildfly/standalone/configuration }
            - { name: wildfly-modules, mountPath: /opt/jboss/wildfly/modules }
            - { name: vault-secrets, mountPath: /vault-secrets }
        - name: configure-oidc
          image: quay.io/kiegroup/kie-server-showcase:7.74.1.Final
          command: ["/bin/sh","-c"]
          args:
            - |
              set -e
              sh /oidc/configure-oidc.sh
          env:
            - { name: OIDC_ENABLE,           value: "true" }
            - { name: WILDFLY_SERVER_CONFIG, value: "standalone-full-kie-server.xml" }
          volumeMounts:
            - { name: kieserver-config, mountPath: /opt/jboss/wildfly/standalone/configuration }
            - { name: wildfly-oidc, mountPath: /oidc }
            - { name: vault-secrets, mountPath: /vault-secrets }
            - { name: wildfly-modules, mountPath: /opt/jboss/wildfly/modules }
        - name: setup-redirect-fallback
          image: quay.io/kiegroup/kie-server-showcase:7.74.1.Final
          command: ["/bin/sh", "-c"]
          args:
            - |
              rm -rf /opt/jboss/wildfly/welcome-content/*
              cat > /opt/jboss/wildfly/welcome-content/index.html << 'EOF'
              <!DOCTYPE html><meta http-equiv="refresh" content="0; url=/kie-server/services/rest/server">
              <title>Redirecting…</title><a href="/kie-server/services/rest/server">Continue</a>
              EOF
          volumeMounts:
            - { name: welcome-content, mountPath: /opt/jboss/wildfly/welcome-content }
      containers:
        - name: kie-server
          image: quay.io/kiegroup/kie-server-showcase:7.74.1.Final
          command: ["/bin/sh", "-c"]
          args:
            - |
              if [ -f /vault-secrets/kie-users-env.sh ]; then
                # shellcheck disable=SC1091
                . /vault-secrets/kie-users-env.sh
              else
                echo "KIE server credentials file not found at /vault-secrets/kie-users-env.sh"
                exit 1
              fi
              if [ -f /vault-secrets/oidc-env.sh ]; then
                # shellcheck disable=SC1091
                . /vault-secrets/oidc-env.sh
              fi
              if [ -n "${JAVA_OPTS_APPEND:-}" ]; then
                JAVA_OPTS="$JAVA_OPTS $JAVA_OPTS_APPEND"
                export JAVA_OPTS
              fi
              /opt/jboss/wildfly/bin/add-user.sh -a \
                -u "$KIE_SERVER_USER" \
                -p "$KIE_SERVER_PWD" \
                -g "kie-server,rest-all" \
                -s >/dev/null 2>&1 || true
              exec /opt/jboss/wildfly/bin/standalone.sh -b 0.0.0.0 \
                -Dorg.kie.server.id="${KIE_SERVER_ID}" \
                -Dorg.kie.server.user="${KIE_SERVER_USER}" \
                -Dorg.kie.server.pwd="${KIE_SERVER_PWD}" \
                -Dorg.kie.server.location="${KIE_SERVER_LOCATION}" \
                -Dorg.kie.server.controller="${KIE_SERVER_CONTROLLER}" \
                -Dorg.kie.server.controller.user="${KIE_SERVER_CONTROLLER_USER}" \
                -Dorg.kie.server.controller.pwd="${KIE_SERVER_CONTROLLER_PWD}" \
                -Dorg.kie.server.repo="${KIE_MAVEN_REPO}" \
                -Dorg.kie.maven.settings.custom="/opt/jboss/.m2/settings.xml" \
                -c standalone-full-kie-server.xml
          ports:
            - { containerPort: 8080 }
          env:
            - { name: JAVA_OPTS,           value: "-Xms256m -Xmx1024m -Djboss.bind.address=0.0.0.0 -Djboss.bind.address.management=0.0.0.0 -Djboss.as.management.blocking.timeout=1200 -Dorg.drools.server.filter.classes=true -Dorg.kie.server.persistence.ds=java:jboss/datasources/KieServerDS -Dorg.kie.server.persistence.dialect=org.hibernate.dialect.PostgreSQLDialect -Dorg.jbpm.persistence.jpa.properties.hibernate.hbm2ddl.auto=validate -Dorg.jbpm.persistence.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true -Dorg.jbpm.query.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true -Dhibernate.jdbc.lob.non_contextual_creation=true" }
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - { name: KIE_SERVER_ID,       value: "$(POD_NAME)" }
            - name: KIE_SERVER_LOCATION
              valueFrom:
                configMapKeyRef:
                  name: kie-server-location
                  key: KIE_SERVER_LOCATION
            - { name: KIE_SERVER_CONTROLLER, value: "http://workbench-controller-auth-proxy.drools.svc.cluster.local:8080/business-central/rest/controller" }
            - { name: KIE_MAVEN_REPO,     value: "/opt/jboss/.m2/repository" }
            - { name: KIE_SERVER_EXTENSIONS, value: "BRM,DMN,BPM,CaseMgmt,Planner" }
            - { name: JAEGER_DISABLED, value: "true" }
          volumeMounts:
            - { name: kieserver-config,  mountPath: /opt/jboss/wildfly/standalone/configuration }
            - { name: welcome-content,   mountPath: /opt/jboss/wildfly/welcome-content }
            - { name: vault-secrets,     mountPath: /vault-secrets }
            - { name: wildfly-modules,   mountPath: /opt/jboss/wildfly/modules }
            - { name: kie-server-classes, mountPath: /opt/jboss/wildfly/standalone/deployments/kie-server.war/WEB-INF/classes }
            - { name: kie-m2,            mountPath: /opt/jboss/.m2 }
          readinessProbe:
            tcpSocket: { port: 8080 }
            initialDelaySeconds: 120
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket: { port: 8080 }
            initialDelaySeconds: 180
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5

---
