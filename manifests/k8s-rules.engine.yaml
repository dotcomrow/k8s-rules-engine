# =========================
# Namespace
# =========================
apiVersion: v1
kind: Namespace
metadata:
  name: dmn

---
# =========================
# Camunda 7 "Run" (DMN engine + REST)
# Community/OSS image. Exposes /engine-rest.
# =========================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: camunda-run
  namespace: dmn
spec:
  replicas: 1
  selector:
    matchLabels: { app: camunda-run }
  template:
    metadata:
      labels: { app: camunda-run }
    spec:
      containers:
        - name: camunda
          image: camunda/camunda-bpm-platform:run-7.20.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            # Optional: bump heap if you like
            - name: JAVA_OPTS
              value: "-Xms256m -Xmx512m"
          readinessProbe:
            httpGet: 
              path: /engine-rest/engine
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: 
              path: /engine-rest/engine
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: camunda
  namespace: dmn
spec:
  selector: { app: camunda-run }
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  type: ClusterIP

---
# =========================
# NGINX reverse-proxy "publisher"
# Adds CORS and proxies /engine-rest to the engine
# so the browser GUI can deploy DMN directly.
# =========================
apiVersion: v1
kind: ConfigMap
metadata:
  name: publisher-nginx-conf
  namespace: dmn
data:
  nginx.conf: |
    worker_processes  1;
    events { worker_connections  1024; }
    http {
      client_max_body_size 20m;
      server {
        listen 8080;
        
        # CORS preflight handling
        location / {
          if ($request_method = OPTIONS) {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' '*' always;
            add_header 'Access-Control-Max-Age' 3600 always;
            return 204;
          }
          return 404;
        }
        
        location /engine-rest/ {
          # Handle CORS preflight for this location
          if ($request_method = OPTIONS) {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' '*' always;
            add_header 'Access-Control-Max-Age' 3600 always;
            return 204;
          }
          
          proxy_pass http://camunda.dmn.svc.cluster.local:8080/engine-rest/;
          proxy_http_version 1.1;
          proxy_set_header Connection "";
          add_header 'Access-Control-Allow-Origin' '*' always;
          add_header 'Access-Control-Expose-Headers' '*' always;
        }
        
        location = /healthz { 
          add_header Content-Type text/plain always;
          return 200 'ok'; 
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: publisher
  namespace: dmn
spec:
  replicas: 1
  selector:
    matchLabels: { app: publisher }
  template:
    metadata:
      labels: { app: publisher }
    spec:
      containers:
        - name: nginx
          image: nginx:1.25-alpine
          ports: [{ containerPort: 8080 }]
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 3
            periodSeconds: 5
      volumes:
        - name: conf
          configMap:
            name: publisher-nginx-conf
---
apiVersion: v1
kind: Service
metadata:
  name: publisher
  namespace: dmn
spec:
  selector: { app: publisher }
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  type: ClusterIP

---
# =========================
# Zeebe Play - Official Camunda 8 Web Modeler
# Full-featured OSS GUI with modeling, deployment, and monitoring
# =========================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zeebe-play
  namespace: dmn
spec:
  replicas: 1
  selector:
    matchLabels: { app: zeebe-play }
  template:
    metadata:
      labels: { app: zeebe-play }
    spec:
      containers:
        - name: zeebe-play
          image: camunda/zeebe-play:8.6.0
          ports:
            - containerPort: 8080
          env:
            # Camunda Platform 7 Integration
            - name: CAMUNDA_PLATFORM_URL
              value: "http://camunda.dmn.svc.cluster.local:8080"
            - name: CAMUNDA_PLATFORM_REST_URL
              value: "http://publisher.dmn.svc.cluster.local:8080/engine-rest"
            - name: CAMUNDA_PLATFORM_CLIENT_ID
              value: "demo"
            - name: CAMUNDA_PLATFORM_CLIENT_SECRET  
              value: "demo"
            # Enable all features
            - name: SPRING_PROFILES_ACTIVE
              value: "camunda-platform"
            - name: ZEEBE_PLAY_IMPORT_ENABLED
              value: "true"
            - name: ZEEBE_PLAY_EXPORT_ENABLED
              value: "true"
            - name: ZEEBE_PLAY_DMN_ENABLED
              value: "true"
            - name: ZEEBE_PLAY_FORMS_ENABLED
              value: "true"
            # Performance tuning
            - name: JAVA_OPTS
              value: "-Xms256m -Xmx768m -XX:+UseG1GC"
            - name: LOGGING_LEVEL_ORG_CAMUNDA
              value: "INFO"
          volumeMounts:
            - name: temp-storage
              mountPath: /tmp
            - name: models-storage
              mountPath: /opt/zeebe-play/models
          readinessProbe:
            httpGet: 
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 45
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              memory: "512Mi"
              cpu: "300m"
            limits:
              memory: "1.5Gi"
              cpu: "1000m"
      volumes:
        - name: temp-storage
          emptyDir: {}
        - name: models-storage
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: dmn-gui
  namespace: dmn
spec:
  selector: { app: zeebe-play }
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  type: ClusterIP

