# =========================
# Placeholder Drools Rules Service
# =========================
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: drools-service-config
  namespace: drools
data:
  application.yml: |
    server:
      port: 8080
    spring:
      application:
        name: drools-rules-service
    drools:
      kie-server:
        location: http://gravitee-gateway.k8s-api-gateway.svc.cluster.local:8082/kie-server/services/rest/server
        username: kieserver
        password: kieserver1!
      rules:
        refresh-interval: 30000
        cache-enabled: true
    management:
      endpoints:
        web:
          exposure:
            include: health,info,metrics
      endpoint:
        health:
          show-details: always

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: drools-rules-service
  namespace: drools
  labels: { app: drools-rules-service }
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 2
  selector:
    matchLabels: { app: drools-rules-service }
  template:
    metadata:
      labels: { app: drools-rules-service }
    spec:
      containers:
        - name: drools-service
          image: eclipse-temurin:11-jre
          command: ["sh","-c"]
          args:
            - |
              echo "Starting Drools Rules Service..."
              apt-get update && apt-get install -y netcat-openbsd >/dev/null 2>&1
              cat > /tmp/response.txt <<'EOF'
              HTTP/1.1 200 OK
              Content-Type: application/json
              Connection: close

              {"service":"Drools Rules Service","status":"running","message":"This is a placeholder service.","timestamp":"'"$(date -Iseconds)"'","endpoints":{"/health":"Health check","/":"Service info"}}
              EOF
              while true; do nc -l -p 8080 -q 1 < /tmp/response.txt || true; done
          ports: [{ containerPort: 8080 }]
          env:
            - { name: JAVA_OPTS, value: "-Xms128m -Xmx512m" }
            - { name: KIE_SERVER_URL, value: "http://gravitee-gateway.k8s-api-gateway.svc.cluster.local:8082/kie-server/services/rest/server" }
          volumeMounts:
            - { name: config, mountPath: /app/config }
          readinessProbe:
            exec: { command: ["sh","-c","echo ready"] }
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            exec: { command: ["sh","-c","echo alive"] }
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: config
          configMap: { name: drools-service-config }

---
apiVersion: v1
kind: Service
metadata:
  name: drools-rules-service
  namespace: drools
spec:
  selector:
    app: drools-rules-service
  ports:
    - { name: http, port: 8080, targetPort: 8080, protocol: TCP }
  type: ClusterIP
