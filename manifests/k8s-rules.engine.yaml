kind: Service
metadata:
  name: kogito-data-index
  namespace: drools
spec:
  selector:
    app: kogito-data-index
  ports:
  - port: 8080
    targetPort: 8080
  type: ClusterIP

---
# =========================
# Drools Rule Engine Library Service
# Lightweight embeddable rules service for applications
# =========================
apiVersion: v1
kind: ConfigMap
metadata:
  name: drools-service-config
  namespace: drools
data:
  application.yml: |
    server:
      port: 8080
    spring:
      application:
        name: drools-rules-service
    drools:
      kie-server:
        location: https://api-drools.app.suncoast.systems/kie-server/services/rest/server
        username: kieserver
        password: kieserver1!
      rules:
        refresh-interval: 30000
        cache-enabled: true
    management:
      endpoints:
        web:
          exposure:
            include: health,info,metrics
      endpoint:
        health:
          show-details: always

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: drools-rules-service
  namespace: drools
  labels:
    app: drools-rules-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: drools-rules-service
  template:
    metadata:
      labels:
        app: drools-rules-service
    spec:
      containers:
      - name: drools-service
        image: openjdk:11-jre-slim
        command: 
        - sh
        - -c
        - |
          echo "Starting Drools Rules Service..."
          apt-get update && apt-get install -y netcat-openbsd
          echo "HTTP/1.1 200 OK
          Content-Type: application/json
          Connection: close

          {\"service\":\"Drools Rules Service\",\"status\":\"running\",\"message\":\"This is a placeholder service. Replace with your actual Drools application.\",\"timestamp\":\"$(date -Iseconds)\",\"endpoints\":{\"/health\":\"Health check\",\"/\":\"Service info\"}}" > /tmp/response.txt
          
          while true; do
            echo "$(date): Rules service running on port 8080..."
            nc -l -p 8080 -q 1 < /tmp/response.txt || true
          done
        ports:
        - containerPort: 8080
        env:
        - name: JAVA_OPTS
          value: "-Xms128m -Xmx512m"
        - name: KIE_SERVER_URL
          value: "https://api-drools.app.suncoast.systems/kie-server/services/rest/server"
        volumeMounts:
        - name: config
          mountPath: /app/config
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - "echo ready"
          initialDelaySeconds: 10
          periodSeconds: 5
        livenessProbe:
          exec:
            command:
            - sh
            - -c
            - "echo alive"
          initialDelaySeconds: 15
          periodSeconds: 10
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "1Gi"
            cpu: "800m"
      volumes:
      - name: config
        configMap:
          name: drools-service-config

---
apiVersion: v1
kind: Service
metadata:
  name: drools-rules-service
  namespace: drools
spec:
  selector:
    app: drools-rules-service
  ports:
  - port: 8080
    targetPort: 8080
  type: ClusterIP

