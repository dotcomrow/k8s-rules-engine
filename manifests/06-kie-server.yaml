    gravitee.io/definition-plans: '{"jwt-internal":{"name":"JWT Internal","description":"Keycloak internal realm JWT","security":{"type":"JWT","configuration":{"signature":"RSA_RS256","publicKeyResolver":"JWKS_URL","resolverParameter":"https://auth.suncoast.systems/realms/internal/protocol/openid-connect/certs","userClaim":"preferred_username","extractClaims":true}},"status":"PUBLISHED","validation":"AUTO","type":"API","selectionRule":"{#jwt != null && #jwt.claims[\"iss\"] == \"https://auth.suncoast.systems/realms/internal\"}"},"jwt-external":{"name":"JWT External","description":"Keycloak external realm JWT","security":{"type":"JWT","configuration":{"signature":"RSA_RS256","publicKeyResolver":"JWKS_URL","resolverParameter":"https://auth.suncoast.systems/realms/external/protocol/openid-connect/certs","userClaim":"preferred_username","extractClaims":true}},"status":"PUBLISHED","validation":"AUTO","type":"API","selectionRule":"{#jwt != null && #jwt.claims[\"iss\"] == \"https://auth.suncoast.systems/realms/external\"}"}}'
